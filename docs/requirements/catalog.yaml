- id: REQ-RAG-019
  area: RAG
  statement: "Điểm tương đồng (cosine, RRF) chỉ dùng để xếp hạng và cắt ngưỡng truy xuất; không bao giờ dùng làm độ tin cậy của một fact hay xác suất một phát biểu đúng; Evidence.Confidence của đoạn tài liệu không được suy từ cosine; câu trả lời không hiển thị phần trăm 'đúng' lấy từ điểm tương đồng."
  rationale: "[HIỆU CHỈNH] Similarity 0.95 không có nghĩa '95% câu này đúng'."
