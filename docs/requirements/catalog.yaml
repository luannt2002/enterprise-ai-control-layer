  area: RTE
  statement: "Với MỌI tác vụ nghiệp vụ trong tài liệu tenant có bảng ranh giới tất định/xác suất: Task, Deterministic?, Probabilistic?, Hybrid?, Why?, Failure consequence?; ví dụ: SUM nhiên liệu → tất định; diễn giải báo cáo hiện trường mơ hồ → xác suất + validation; kiểm quyền → tất định; tìm SOP → retrieval; giải thích bất thường → xác suất; xác định tổng hoá đơn thực → tất định. Chỉ phần có bản chất bất định (nhiều cách diễn đạt đúng, cần hiểu ngôn ngữ/ngữ nghĩa, tóm tắt/phân loại/trích xuất) mới được giao cho model; không dùng model nếu SQL/code/rules giải được tốt hơn."
  rationale: "Ranh giới tất định/xác suất theo từng tác vụ là nền của router và của validation."
