    projects:
      - {id: PRJ-A, name: Cầu A, aliases: [dự án A, cầu A, công trình A]}
      - {id: PRJ-B, name: Đường B, aliases: [dự án B, đường B]}
    equipment:
      # EX-03 là máy của ca chuẩn: mỗi nguồn gọi nó bằng một mã khác.
      - {id: EX-03, type: excavator, name: Máy xúc EX-03, project: PRJ-A,
         aliases: [máy 03, máy xúc 03, MX-03],
