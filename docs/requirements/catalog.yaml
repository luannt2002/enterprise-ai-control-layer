- id: REQ-SEC-001
  area: SEC
  statement: "Bốn loại vai tách bạch và chỉ một loại nằm trong prompt: (1) vai nghiệp vụ của người dùng (trưởng dự án, kế toán, kỹ sư hiện trường, giám đốc) lưu ở principals.roles; (2) phạm vi dữ liệu (dự án nào, tài liệu nào, chỉ số nào được xem) là thuộc tính ABAC của principal + ACL tài liệu; (3) quyền capability của hệ thống (được tìm tài liệu, truy vấn số liệu, tạo báo cáo, duyệt, gọi tool nào) là chính sách vai → capability trong pack; (4) vai của model ('bạn hỗ trợ lập báo cáo ngày công trường') là mẫu prompt chỉ định hướng văn phong. Vai của model KHÔNG BAO GIỜ được dùng để phân quyền; vai 1–3 do code/chính sách thực thi."
  rationale: "'You are a project manager' là persona/instruction, không có nghĩa model có quyền Project Manager."
  sources:
