  note: null
- id: REQ-NRM-015
  area: NRM
  statement: "Trích xuất khe từ ngôn ngữ tự nhiên trả về dữ liệu có kiểu theo schema của pack: trường nào bắt buộc, kiểu, enum, miền giá trị, cho phép null, độ tin cậy, span bằng chứng; ví dụ 'Hôm nay đội A dùng khoảng 4k lít dầu' → {team: A, fuel_liters: 4000, date, estimate: true, confidence, evidence}; thiếu trường bắt buộc → CLARIFICATION; đầu ra sai schema bị từ chối và ghi nhãn, không đoán sửa."
  rationale: "Natural language → typed data là lõi của I3 (tin nhắn hiện trường)."
