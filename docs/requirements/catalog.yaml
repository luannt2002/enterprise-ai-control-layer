  note: null
- id: REQ-SEC-002
  area: SEC
  statement: "Principal có cấu trúc rõ do danh tính quyết định: user_id, tenant, vai, dự án được phép, quyền cho phép (ví dụ project.read, report.read, report.create, equipment.read), quyền bị từ chối (ví dụ payroll.read, payment.approve); chuỗi: xác thực → principal → phân quyền → dữ liệu được phép → Context Builder → chỉ bằng chứng an toàn → model; tenant lấy từ danh tính (khoá API → principal), KHÔNG tin tenant_id gửi trong body request."
  rationale: "Model không tự biết ai đang đăng nhập hay được xem gì; code enforce quyền."
  sources:
    - {file: brief-06-model-vs-enterprise-system.md, section: "5. Còn `Role` không phải là quyền doanh nghiệp", lines: "278-351"}
