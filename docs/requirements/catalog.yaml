- id: REQ-NRM-014
  area: NRM
  statement: "Tin nhắn có nhiều lượng hoặc nhiều mốc ('máy 03 lấy 2k sáng + 2k chiều') được tách thành nhiều measurement riêng (mỗi lần lấy) kèm thời điểm; tổng là fact dẫn xuất có ghi công thức chứ không phải một con số gộp mất dấu."
  rationale: "Ca CON-037: nhiều lần lấy dầu cộng với phiếu kho; gộp sớm làm mất khả năng đối chiếu."
