  statement: "Hệ thống phải thể hiện sự khác biệt demo và production bằng kỷ luật kỹ thuật chứ không bằng prompt đẹp hơn: demo là User → Prompt → Model → câu đẹp; production là User → Auth → Router → Workflow → truy xuất dữ liệu → chuẩn hoá → Context Builder → Model → tool → kiểm → luật nghiệp vụ → audit → output/action. Tiêu chí sẵn sàng production là bộ chỉ số thành phần + E2E + SLO, không phải một buổi demo."
