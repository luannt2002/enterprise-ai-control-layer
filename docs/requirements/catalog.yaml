- id: REQ-RTE-014
  area: RTE
  statement: "Cây quyết định chọn đường theo nguyên lý đầu, thử theo thứ tự: giải được bằng phần mềm tất định → CODE/SQL/RULES; cần fact có cấu trúc chính thức → SQL/DB; cần thông tin ngoài hoặc hiện tại → API/SEARCH/TOOL; cần tri thức trong tài liệu → RETRIEVAL/RAG; cần diễn giải hoặc suy luận ngữ nghĩa → MODEL; cần quy trình đã biết → SKILL/WORKFLOW; cần hành động → TOOL/API (MCP khi cổng mở); đầu vào mơ hồ → CLARIFICATION; output critical → VALIDATION/duyệt người; thành công không đo được → ĐỊNH NGHĨA EVAL TRƯỚC KHI SCALE. Hai bản ghi chú đặt khác thứ tự ở nhánh 'fact có cấu trúc/hiện tại' so với 'tri thức tài liệu' và ở nhánh 'quy trình đã biết' so với 'hành động'; EAIS chọn thứ tự của P3 (fact chính xác có cấu trúc trước, quy trình đã biết trước hành động)."
  rationale: "[HIỆU CHỈNH] Hai bản cây quyết định lệch thứ tự ở các nhánh giữa; chọn thứ tự khớp nguyên tắc 'fact đến từ nguồn có thẩm quyền'."
