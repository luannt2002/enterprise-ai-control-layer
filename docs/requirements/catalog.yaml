  area: RAG
  statement: "Chunking là quyết định kiến trúc chứ không chỉ tiền xử lý: chunk sai → embedding của mảnh thiếu → truy xuất kém → context kém → câu trả lời kém; chiến lược chọn theo loại nội dung (quy định/pháp lý, markdown, mã, bảng); bốn biến điều chỉnh được: kích thước chunk, overlap, ranh giới cắt, loại nội dung; MVP chunk theo cấu trúc (heading/đoạn; bảng theo nhóm hàng và lặp header) với dự phòng đệ quy; mỗi chunk thuộc đúng một phiên bản tài liệu."
