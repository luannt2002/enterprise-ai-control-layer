  area: OBS
  statement: "Telemetry vận hành xuất metrics, error tracking và cảnh báo cho các chỉ số SLI (độ sẵn sàng, độ trễ P95, tỉ lệ lỗi theo nhãn fault, chi phí/yêu cầu, tỉ lệ CLARIFICATION/escalation); dashboard tách theo tenant; không có dữ liệu nhạy cảm trong log."
