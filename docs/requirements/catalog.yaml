  verification: {kind: eval, ref: "cổng mở khi đo được thông lượng/độ trễ đường đồng bộ vượt ngưỡng; ADR (ADR-0004) kèm số đo"}
  note: "Điều kiện mở cổng: đo được thông lượng hoặc độ trễ của đường đồng bộ trên dữ liệu mô phỏng cỡ lớn không đạt mục tiêu SLO; mở bằng ADR-0004."
- id: REQ-RT-005
  area: RT
  statement: "Cache cho projection (tỉ số, bảng xếp hạng) có chiến lược vô hiệu hoá theo sự kiện sửa/rút lại; cache cũ (stale) là ca hỏng có nhãn CACHE; khoá cache gồm tenant, pack_version và tham số."
  rationale: "Sports là cache-heavy và read-heavy."
  sources:
