- id: REQ-CTX-003
  area: CTX
  statement: "ContextSource triển khai ở MVP cho: facts/SQL, events, truy xuất tài liệu, kết quả calculation, kết quả tool, chính sách và cấu hình tenant, dữ liệu API trực tiếp; mỗi nguồn trả Evidence chuẩn qua cùng các bước lọc quyền, khử trùng, xếp hạng."
  rationale: "Danh sách nguồn context tối thiểu cho hỏi/đáp số liệu và tri thức."
