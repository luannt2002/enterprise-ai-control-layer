    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "[Transcript thô] \"data raww video\" — dòng 2-4 (nguồn của các ý [VIDEO])", lines: "4"}
  applies_to: [evals, docs]
  phase: GATED
  verification: {kind: eval, ref: "cổng mở khi có dữ liệu thật và ca hỏng mà context/tool/luật không chữa được; mỗi triển khai khai đủ yếu tố môi trường và có đánh giá trên phân phối thật"}
  note: "Điều kiện mở cổng (docs/01-architecture.md §9): có dữ liệu thật và ca hỏng mà context/tool không chữa được; dịch vụ thị giác thuộc giai đoạn V2 (python vision) của ranh giới Go↔Python."
- id: REQ-CV-002
  area: CV
  statement: "Đầu ra thị giác (ảnh/video công trường → nhận dạng/phân loại → sự kiện có cấu trúc → CSDL dự án; ví dụ công nhân, mũ bảo hộ, máy móc, mặt đường, tiến độ, vật liệu; kèm lập chỉ mục ảnh để tìm kiếm) là observation xác suất: có độ tin cậy, ngưỡng, và đi qua cùng chuẩn hoá, kiểm, audit và duyệt người như mọi nguồn khác; không tự thành fact."
  rationale: "Nhánh Computer Vision của brief 01."
  sources:
    - {file: brief-01-case-study-construction.md, section: "Case 08 — Ảnh công trường", lines: "455-487"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "ROADMAP 13 — COMPUTER VISION / YOLO", lines: "5477-5540"}
