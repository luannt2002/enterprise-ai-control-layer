  statement: "Đầu ra của model luôn mang trạng thái đề xuất (Draft), chưa phải fact và chưa phải hành động được phép; chỉ trở thành thông tin được giao sau khi qua S9, và không có đường nào ghi Draft thẳng vào bảng facts. Model là kết quả của quá trình tối ưu hoá, không phải cơ sở dữ liệu chứa sự thật."
