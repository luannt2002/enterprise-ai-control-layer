  statement: "Đánh giá nghiệp vụ (V2): ROI, thời gian tiết kiệm, chi phí tiết kiệm, doanh thu, rủi ro; mỗi tenant khai KPI nghiệp vụ và đường cơ sở; chỉ số nghiệp vụ không thay chỉ số kỹ thuật."
