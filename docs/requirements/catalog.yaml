- id: REQ-MND-044
  area: MND
  statement: "Vấn đề của kiến trúc cũ không nằm ở chỗ RAG làm sai mà ở abstraction boundary: thiếu zoom-out BUSINESS → WORKFLOW → DATA → DECISION → CAPABILITY SELECTION → 'RAG chỉ là một lựa chọn'; mô hình sai 'RAG/MODEL ở trung tâm, mọi thứ khác bao quanh' bị đảo thành EAIS gồm DATA + DECISION + ACTION cùng các AI capabilities (RAG, Model, Agent); EAIS không phải 'RAG V2'."
  rationale: "RAG không bị vứt mà bị hạ cấp từ trung tâm kiến trúc thành một capability."
  sources:
    - {file: brief-04-rag-to-eais-expansion.md, section: "(mở đầu, chưa có tiêu đề)", lines: "3-45"}
    - {file: brief-04-rag-to-eais-expansion.md, section: "1. Vấn đề dự án cũ không phải RAG làm sai", lines: "46-109"}
    - {file: brief-04-rag-to-eais-expansion.md, section: "2. Vậy V2 không phải “RAG V2”", lines: "110-200"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "docs/01-architecture.md §1 có sơ đồ đảo và câu 'RAG là một capability'; review không còn mô tả RAG ở trung tâm"}
  note: null
- id: REQ-MND-045
  area: MND
  statement: "Kiến trúc khái niệm V2 được thể hiện đủ: RAG project V1 (giữ lại: ingestion, parsing, chunking, indexing, retrieval, reranking, citations) cắm vào EAIS; luồng BUSINESS → TENANT → DOMAIN → WORKFLOW → DATA FOUNDATION (Parse/Normalize/Resolve) → DECISION/ROUTER → {tất định SQL/Rules | RAG | MODEL} → CONTEXT ENGINE → SKILL/WORKFLOW → TOOL RUNTIME → MCP/API/DB → VALIDATION → OUTPUT; và mặt phẳng điều khiển/governance mười hai mục: Tenant Isolation, Auth/Permission, Policy, Schema, Validation, Evaluation, Tracing, Observability, Cost, Security, SLA, Audit."
  rationale: "Custom từ project cũ thành EAIS: thêm lớp trước RAG và lớp điều khiển bao quanh."
  sources:
    - {file: brief-04-rag-to-eais-expansion.md, section: "2. Vậy V2 không phải “RAG V2”", lines: "110-200"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "tài liệu kiến trúc đối chiếu sơ đồ khái niệm; mỗi mục trong 12 mục control plane có chỗ ở trong §2 hoặc REQ tương ứng"}
  note: null
- id: REQ-MND-046
  area: MND
  statement: "Thứ tự rà soát sâu (deep audit) của bộ tài liệu theo mười ba bước: #0 mental model (AI ≠ System); #1 RAG; #2 Context Engineering (đặt ngay sau RAG vì nối tự nhiên: model thấy gì); #3 Tools; #4 Router/Orchestration; #5 MCP; #6 Skills; #7 Memory + State; #8 Agent/Workflow; #9 Evals; #10 Observability; #11 Security/Permissions; #12 Production Architecture; mỗi đợt audit ghi phát hiện thành REQ hoặc ADR."
  rationale: "Lộ trình audit nối từng subsystem thành kiến trúc production hoàn chỉnh."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "24. Từ đây roadmap audit của chúng ta đã khá rõ", lines: "4465-4570"}
  applies_to: [docs]
  phase: V1
  verification: {kind: review, ref: "kế hoạch audit trong docs/06-roadmap ghi trạng thái từng bước #0–#12 và liên kết REQ/ADR phát sinh"}
  note: null
- id: REQ-MND-047
  area: MND
  statement: "Đường học và checklist ghi chú nguồn được chuyển thành tài liệu hướng dẫn: chín mức của study guide (1 mental model: AI ≠ magic, AI ≠ product, model ≠ system, công nghệ phải map vào giá trị, demo ≠ enterprise; 2 dữ liệu: GIGO, kiểm kê, phân loại, nguồn sự thật, chuẩn hoá, đọc tài liệu, quyền; 3 tất định: tất định vs xác suất, trích xuất có cấu trúc, schema validation, business rules, mơ hồ, hỏi lại; 4 context: Context Builder, context SQL/API/RAG, thẩm quyền, xung đột; 5 truy xuất: embeddings, semantic search, RAG, rerank, grounding; 6 kiến trúc ứng dụng: router, classifier, workflow, skills, tools, MCP; 7 model: phi tất định, hallucination, huấn luyện, reward, benchmark, fine-tuning, domain adaptation; 8 production: SLA/SLO, validation, evals, tracing, observability, cost, latency, trách nhiệm; 9 miền: thuật ngữ, dữ liệu, môi trường, distribution shift, eval theo miền) và bảy mức của workshop note (nền tảng; dữ liệu; truy xuất/context; kiến trúc agent/ứng dụng; độ tin cậy; đánh giá; thích nghi model); mỗi chủ đề trỏ tới REQ phủ nó."
  rationale: "Checklist học lại video; chỉ có ích nếu mỗi mục dẫn được về yêu cầu hệ thống."
