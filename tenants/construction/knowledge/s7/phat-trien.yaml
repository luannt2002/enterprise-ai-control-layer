# Bộ câu hỏi PHÁT TRIỂN cho dòng S7 của CỔNG TRƯỚC AI (docs/bao-cao/CONG-TRUOC-AI.md): "đoạn chứa đáp án nằm trong top-3
# ≥ 90%; 0 đoạn ngoài quyền; 100% bằng chứng có nguồn gốc". Người soạn = người làm RAG ⇒ số đo trên bộ này là số PHÁT TRIỂN,
# không phải số của cổng; số của cổng chỉ lấy trên bộ do người khác soạn và đóng băng bằng băm trước khi chạy
# (docs/viec/2-tra-quy-trinh/S7-BO-CA-DOC-LAP.md).
#
# Luật của bộ này: câu hỏi và kho (kho/) được viết XONG trước lần chạy đầu; băm của cả hai ghi ở S7-BO-CA-DOC-LAP.md §1. Sau
# lần chạy đầu KHÔNG sửa câu hỏi hay kho để ca trượt thành trúng — ca trượt được ghi `truot_biet_truoc` kèm lý do (ratchet:
# trúng lại thì phải gỡ cờ).
#
# Trường của một câu:
#   ma            mã câu
#   hoi           câu hỏi, viết như người ở công trường hỏi (không chép chữ của tài liệu)
#   vai, pham_vi  người hỏi: vai và thuộc tính entity_scope (phạm vi dự án)
#   ngay          ngày hỏi (mặc định ngay_mac_dinh)
#   loai          tra_loi (có đáp án người hỏi được đọc) | khong_co (không có tài liệu trả lời, hoặc có mà người hỏi không được đọc)
#   dap_an        đoạn chứa đáp án: tai_lieu, ban (0 = tài liệu không phiên bản), chua (chuỗi con của đoạn)
#   bay           với khong_co: ngoai_quyen | ngoai_pham_vi | khong_co_tai_lieu
#   truot_biet_truoc  ca tra_loi đang trượt có chủ đích: lý do + nấc sẽ sửa
ngay_mac_dinh: "2026-10-20"
k: 3
cau:
  # Nhiên liệu
  - ma: S7D-01
    hoi: "lệch dầu giữa kho xuất với máy dùng thì mấy tiếng phải có biên bản?"
    vai: [site_engineer]
    pham_vi: [PRJ-A]
    loai: tra_loi
    dap_an: [{tai_lieu: SOP-NL-01, ban: 2, chua: "trong vòng 48 giờ"}]
  - ma: S7D-02
    hoi: "lệch dầu giữa kho xuất với máy dùng thì mấy tiếng phải có biên bản?"
    vai: [site_engineer]
    pham_vi: [PRJ-A]
    ngay: "2025-06-01"
    loai: tra_loi
    dap_an: [{tai_lieu: SOP-NL-01, ban: 1, chua: "trong vòng 24 giờ"}]
  - ma: S7D-03
    hoi: "khi nào kế toán mới được đối chiếu hoá đơn dầu?"
