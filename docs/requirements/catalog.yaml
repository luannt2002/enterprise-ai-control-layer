  phase: MVP
  verification: {kind: review, ref: "danh mục corpus có đủ loại với phase; tài liệu mô phỏng dùng dữ liệu giả"}
  note: null
- id: REQ-RAG-023
  area: RAG
  statement: "Roadmap con của RAG gồm mười ba nhóm, mỗi nhóm có mục tiêu, chỉ số và cổng: ingestion nguồn; chunking; biểu diễn (embedding, chọn model, số chiều, phiên bản); indexing (vector, full-text, metadata, vòng đời); xử lý truy vấn; truy xuất (dense, sparse, lọc metadata, hybrid, graph); xếp hạng (similarity, reranker, ngưỡng, dedup); dựng context; sinh (grounding prompt, LLM, structured output, abstention); kiểm chứng (citation, faithfulness, validation, fallback); đánh giá (ingestion/retrieval/generation/E2E); production (quy mô, cache, độ trễ, chi phí, quan sát, trace, bảo mật, quyền); nâng cao (contextual, agentic, graph, multimodal, adaptive). Evaluation, Data Governance, Security/Permission, Index Lifecycle và Context Builder được nâng thành thành phần hạng nhất. Thứ tự học/xây RAG theo bảy giai đoạn: PHASE 0 mental model (retrieval + augmentation + generation), 1 nền tảng (nạp, chunking, embedding, index), 2 phân tích hỏng (failure-first), 3 chất lượng truy xuất (hybrid, rerank), 4 kỹ thuật production, 5 hệ RAG hoàn chỉnh, 6 nâng cao/thích ứng."
  rationale: "RAG zoom vào một workstream của bức tranh lớn; không mặc định Agentic/Graph/Multimodal."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "18. Đây mới là roadmap RAG tôi sẽ rút ra từ file", lines: "3047-3143"}
