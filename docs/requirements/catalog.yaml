  area: OBS
  statement: "Ngân sách chi phí theo tenant (trần token/chi phí theo ngày/tháng) được thực thi: vượt trần thì hạ cấp/từ chối có thông báo theo pack, không âm thầm tiêu tiếp; cache và chọn model là đòn bẩy chi phí, mở khi số đo đòi."
