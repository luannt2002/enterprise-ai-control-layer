- id: REQ-RT-008
  area: RT
  statement: "Không dùng model để bịa fact trực tiếp (tỉ số, người ghi bàn, thẻ phạt, H2H): các giá trị này đến từ dữ liệu có cấu trúc tất định; câu trả lời có sinh chữ (tóm tắt trận) chỉ diễn đạt fact trong gói và số trong câu phải khớp projection; khi chưa có dữ liệu trả INSUFFICIENT_EVIDENCE."
  rationale: "Không dùng LLM để invent live facts."
  sources:
