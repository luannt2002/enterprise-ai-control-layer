  verification: {kind: eval, ref: "cổng mở khi có bên tiêu thụ thật cần khám phá tool theo chuẩn; ADR kèm phân tích tích hợp nào dùng MCP"}
  note: "Điều kiện mở cổng (docs/01-architecture.md §9): có bên tiêu thụ thật cần khám phá tool theo chuẩn; chưa có consumer ở hai tenant tham chiếu nên execution/mcp chưa tạo thư mục."
- id: REQ-MCP-003
  area: MCP
  statement: "Khi mở MCP, ADR phân tích đủ chín khía cạnh cho từng tích hợp: discovery, schema, auth, authorization, tenant isolation, latency, failure, observability, governance; credentials MCP theo tenant (Shared Tool Runtime ≠ Shared Credentials)."
  rationale: "Điều kiện để mở cổng MCP một cách an toàn."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART XV — MCP", lines: "873-912"}
    - {file: brief-02-v2-two-tenants.md, section: "PART XXII — MULTI-TENANCY", lines: "1153-1198"}
