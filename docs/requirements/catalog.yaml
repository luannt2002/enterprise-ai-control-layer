  note: null
- id: REQ-OBS-004
  area: OBS
  statement: "Runbook gỡ lỗi mười lăm bước khi AI system trả lời sai, theo thứ tự: 1 requirement đúng/chính xác chưa; 2 input ambiguous; 3 parsing đúng; 4 normalization đúng; 5 source data đúng; 6 source of truth đúng; 7 router chọn đúng flow; 8 retrieval đúng; 9 Context Builder đưa đúng evidence; 10 skill/workflow đúng; 11 tool gọi đúng; 12 tool result đúng; 13 model reasoning/generation đúng; 14 validator có bắt lỗi; 15 eval suite có ca này; mỗi bước chỉ ra trường trace hoặc truy vấn dùng để trả lời."
  rationale: "Đừng đổi sang model mạnh hơn trước khi biết root cause."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "37. DEBUGGING FLOW --- KHI AI SYSTEM TRẢ LỜI SAI", lines: "2056-2119"}
