  applies_to: [tenants/sports, evals, domain/sportsevents]
  phase: MVP
  verification: {kind: test, ref: "mười hai ca SPT-F chạy trong evals; ca cache cũ chỉ áp dụng khi có cache (V1)"}
  note: null
- id: REQ-RT-007
  area: RT
  statement: "Ma trận thẩm quyền provider theo loại dữ kiện (tỉ số, thẻ phạt, đội hình, thống kê) và chính sách sửa muộn nằm trong pack sports; khi provider bất đồng, kết quả theo thẩm quyền theo loại dữ kiện, ghi lý do, và sự bất đồng được lưu để điều tra."
  rationale: "Sports Pack: provider authority, correction policies."
