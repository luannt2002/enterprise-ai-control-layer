- id: REQ-DAT-002
  area: DAT
  statement: "Mỗi dataset trong data-map ghi đủ mười sáu thuộc tính: Owner, Producer, Consumer, Schema, Authority, Freshness, Latency, Retention, Version, PII/Sensitivity, Permission, Quality, Completeness, Consistency, Lineage, Update mechanism."
  rationale: "Thuộc tính tối thiểu để quyết định nguồn nào dùng cho việc gì và ai được xem."
