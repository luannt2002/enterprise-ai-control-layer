- id: REQ-RTE-002
  area: RTE
  statement: "Bộ ca router RTE-T có tối thiểu 50 ca, mỗi route có ít nhất một ca dương và một phản ví dụ; chỉ số router accuracy tính theo route và tổng, kèm ma trận nhầm."
  rationale: "Router không có bộ ca thì không biết route đúng hay sai."
