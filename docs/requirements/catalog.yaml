- id: REQ-CTX-004
  area: CTX
  statement: "Các nguồn context nâng cao: lịch sử hội thoại được phép, memory, trạng thái người dùng, trạng thái dự án, trạng thái workflow, chỉ dẫn skill, ví dụ few-shot; đều đi qua đúng bộ lọc quyền, khử trùng, xếp hạng, ngân sách như nguồn MVP và có thẩm quyền/độ tươi của riêng nó."
  rationale: "Mở rộng context khi có ca đòi; không thêm nguồn trước."
  sources:
