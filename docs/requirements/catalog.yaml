  statement: "Trace của mỗi lượt cho phép trả lời chín câu: Why did the system answer this? Which source? Which version? Which route? Which tool? Which tenant config? Which model? Which skill? Which validation?; chuỗi trace: tenant → request → router → truy xuất/truy vấn → context → model → tool → validation → response; tương ứng trường route, bằng chứng + phiên bản nguồn, lời gọi tool, pack_version, model, skill, phán quyết kiểm."
