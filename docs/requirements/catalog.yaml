- id: REQ-DIG-002
  area: DIG
  statement: "Quy trình đọc tài liệu gồm các bước tách bạch: nhận diện loại tài liệu → parse (và OCR khi cần) → hiểu bố cục → trích bảng → khôi phục cấu trúc → chuẩn hoá → kiểm chất lượng → metadata → index/DB; không có đường tắt 'PDF → raw text → vector DB → xong'; mỗi bước có đầu ra kiểm được."
  rationale: "[VIDEO] Pipeline tốt hơn raw text cho enterprise; lỗi parse bị nhầm là hallucination."
