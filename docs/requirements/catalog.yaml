  note: null
- id: REQ-OBS-006
  area: OBS
  statement: "Cây RCA theo thành phần khi sai: dữ liệu nguồn, parsing, chuẩn hoá, retrieval, reranker, router, context builder, memory cũ, skill, tham số tool, thực thi tool, model, validator; khi sửa, hướng sửa theo đúng điểm hỏng: sửa dữ liệu, parser, retrieval, router, context, skill, tool, prompt, đổi model, fine-tune, huấn luyện — chỉ khi có lý do."
  rationale: "Production failure → trace → RCA → chọn điểm sửa."
  sources:
