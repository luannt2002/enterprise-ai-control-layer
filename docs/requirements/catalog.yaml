- id: REQ-NRM-006
  area: NRM
  statement: "Không có luật toàn cục 'k = 1000' hay '4k = 4000 lít': cùng chuỗi '4k' cho kết quả khác nhau theo tenant/domain/ngữ cảnh/intent (xây dựng 'đổ 4k dầu' → 4000 L; tài chính 'chi phí 4k USD' → 4000 USD; màn hình '4K video' → hạng độ phân giải; điện tử '4k7 resistor' → 4,7 kΩ); luật nằm trong lexicon của tenant và đi theo chuỗi raw input → tenant → domain → intent → ngữ cảnh gần → thuật ngữ/ontology → luật chuẩn hoá → giá trị chuẩn."
  rationale: "Ví dụ '4k' là lý do tồn tại của tenant/domain customization."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "7. Ví dụ “4k lít” cho thấy tại sao tenant/domain customization tồn tại", lines: "2978-3045"}
  applies_to: [data/normalization, core/tenant, tenants/construction]
  phase: MVP
  verification: {kind: test, ref: "test hai pack (construction + pack kiểm thử tổng hợp): cùng chuỗi '4k' → canonical khác hoặc không khớp; core không chứa luật cho '4k'"}
  note: null
- id: REQ-NRM-007
  area: NRM
  statement: "Bản ghi chuẩn hoá phải mang đủ trường: định danh thực thể, giá trị, đơn vị, chỉ số/vật liệu, nguồn, thời điểm, độ tin cậy và span bằng chứng gốc (ví dụ 'máy 03 lấy 2k dầu' → equipment_id, quantity 2000, unit L, material diesel, source, timestamp, confidence, evidence)."
  rationale: "Biểu diễn canonical là điều kiện để phép tính và kiểm số dùng số thay vì chữ."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART VII — NORMALIZATION ENGINE", lines: "530-581"}
  applies_to: [data/normalization, core/contracts]
  phase: MVP
  verification: {kind: test, ref: "test hợp đồng NormalizedInput/Measurement có đủ trường; thiếu span bằng chứng bị từ chối"}
  note: null
- id: REQ-NRM-008
  area: NRM
  statement: "Bộ chuẩn hoá xử lý tối thiểu: số, ngày, tiền tệ, đơn vị, mã định danh, viết tắt, mã dự án, mã thiết bị, mã vật tư; mỗi loại có bộ vector NRM-V và chỉ số riêng."
  rationale: "Danh sách loại giá trị bắt buộc của Normalization Engine."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART VII — NORMALIZATION ENGINE", lines: "554-569"}
  applies_to: [data/normalization]
  phase: MVP
  verification: {kind: test, ref: "mỗi loại có ≥1 nhóm vector NRM-V; báo cáo độ phủ theo loại"}
  note: null
- id: REQ-NRM-009
  area: NRM
  statement: "Chuẩn hoá tên và địa điểm (người, đội, công trường, địa danh) đi qua nhận dạng thực thể với bí danh theo phạm vi và so khớp mờ có ngưỡng; ghi nhận biến thể chính tả/viết tắt theo tenant."
  rationale: "Tên và địa điểm không phải số/đơn vị; cần nhận dạng thực thể."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART VII — NORMALIZATION ENGINE", lines: "554-569"}
  applies_to: [data/normalization, data/entityresolution]
  phase: V1
  verification: {kind: test, ref: "vector biến thể tên/địa điểm có đáp án; ca mơ hồ → CLARIFICATION"}
  note: null
- id: REQ-NRM-010
  area: NRM
  statement: "Phân biệt rõ sáu chặng độc lập và đo riêng từng chặng: Parsing, Normalization, Canonicalization, Entity Resolution, Validation (cú pháp/schema), Business Validation; mỗi chặng có interface và test riêng; Normalizer không truy cập danh mục thực thể và không gọi model."
  rationale: "Gộp các chặng làm lỗi khó định vị và khó đo."
  sources:
