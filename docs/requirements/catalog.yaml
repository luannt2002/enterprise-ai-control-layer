    - {file: brief-05-architecture-review.md, section: "Điểm tôi đánh giá rất đúng", lines: "40-48"}
  applies_to: [observability/traces, evals, docs]
  phase: MVP
  verification: {kind: review, ref: "mẫu RCA của sự cố có mục 'tầng sai' trước mục 'hành động'; PR đổi model phải dẫn chiếu RCA đã loại trừ các tầng khác"}
  note: null
- id: REQ-MND-037
  area: MND
  statement: "Chuỗi lập luận nền được ghi thành bộ tài liệu tư duy: AI là một component → dữ liệu quan trọng → ngữ cảnh quan trọng → phi tất định phải được kiểm soát → hallucination phải được quản lý → phần mềm tất định vẫn quan trọng → tools/retrieval/routing quan trọng → production cần metric → điều kiện domain quan trọng → MODEL ≠ SYSTEM; và chuỗi BUSINESS → DATA → ARCHITECTURE → CONTEXT → MODEL → ACTION → VALIDATION → EVALUATION → OPERATIONS với model ở giữa."
  rationale: "Giá trị thật của video là mental model nối các mảnh rời."
  sources:
