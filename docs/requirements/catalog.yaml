  statement: "Bộ đọc tài liệu trả về cấu trúc chứ không chỉ văn bản thô: trang, heading, đoạn, bảng (header, hàng, ô, hàng tổng), chú thích; giữ được quan hệ mà người nhìn thấy ngay (TOTAL thuộc cột nào, cộng từ những dòng nào); ở MVP áp dụng cho văn bản, markdown và bảng đơn giản có hàng tổng, còn PDF/DOCX/XLSX phức tạp đi qua dịch vụ document-parser ở V1; tài liệu dạng bảng có hàng tổng là ca kiểm bắt buộc."
  rationale: "[VIDEO] PDF khác xa demo: raw text làm mất quan hệ hàng/cột/tổng."
