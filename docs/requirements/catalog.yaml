- id: REQ-DAT-003
  area: DAT
  statement: "Lớp nạp dữ liệu phải phát hiện và gắn nhãn chín lớp vấn đề dữ liệu: trùng lặp, xung đột, cũ (stale), thiếu, không hợp lệ, ngoại lai, lệch đơn vị, lệch múi giờ, lệch phiên bản; mỗi lớp có fixture và kết quả mong đợi (chặn → review_queue hoặc hỏi lại/báo chủ dữ liệu); không nuốt im và không tự sửa im lặng."
  rationale: "Bản ghi bẩn không được đi tiếp thành fact hay chunk; lỗi mang nhãn fault=data."
  sources:
