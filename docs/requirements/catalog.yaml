- id: REQ-EVL-009
  area: EVL
  statement: "Truy xuất được đánh giá riêng trước khi đổ lỗi cho LLM: chạy retrieval-only (tắt sinh) trên bộ ca với Recall@K và Precision@K ở MVP; MRR, nDCG, Hit Rate ở V1; kết quả sinh không được dùng để kết luận chất lượng truy xuất."
