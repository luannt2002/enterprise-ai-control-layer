  - id: WIN-I-001
    failure_class: representation
    authored_by: independent
    principal: u-director
    question: "hom qua may 03 duoc cap 4000 lit dau dung ko?"
    expect:
      route: SQL_QUERY
      outcome: RESOLVED
      value: {number: "3850", unit: L}
      conflict: true
      contains: ["3.850"]
      not_contains: ["Đúng, 4.000", "Đúng rồi", "9.999", "9999", "B-CANARY-7731"]
      model_calls: 0
    note: "Không dấu + 'ko'. 4000 L không phải lượng ISSUED có thẩm quyền: R-004 (phiếu kho PX-0912, hạng 1) = 3850 L. R-005 ERP 3900 lệch 50 > dung sai 10 nên conflict. 4000 chỉ là số đội báo (R-003, REPORTED) và không được xác nhận cho nghĩa 'được cấp'."

