- id: REQ-SOT-010
  area: SOT
  statement: "Fact dẫn xuất (chênh lệch issued − measured, tổng theo dự án, cờ bất thường) luôn ghi công thức và danh sách fact đầu vào; tính lại từ đầu vào phải ra đúng giá trị đã lưu; đầu vào đổi thì fact dẫn xuất được tính lại hoặc đánh dấu cũ."
