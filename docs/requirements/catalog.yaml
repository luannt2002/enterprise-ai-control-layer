- id: REQ-SEC-008
  area: SEC
  statement: "Prompt injection và rò rỉ dữ liệu: văn bản trong tài liệu, tin nhắn và kết quả tool là dữ liệu không đáng tin, không thể đổi chỉ dẫn hệ thống, tập tool hay quyền; đầu ra không chứa dữ liệu ngoài gói bằng chứng được phép; bộ ca đối kháng gồm tài liệu chứa lệnh giả và yêu cầu dữ liệu tenant khác."
