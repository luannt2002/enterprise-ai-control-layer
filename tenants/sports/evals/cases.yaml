# Bộ ca kiểm thử của tenant xyz-sports (XYZ Sports Data JSC, hư cấu).
# Định dạng: CONVENTIONS §5 — đủ 23 khoá cho MỌI ca, khoá không áp dụng ghi null.
# Mọi giải, đội, cầu thủ, provider là hư cấu. Mọi con số (phút, giây, điểm, số người) là GIẢ LẬP.
# Chỉ dữ liệu thông tin thể thao: không có tính năng cá cược (câu hỏi kèo đi route REJECT).
#
# Quy ước riêng của tenant (tóm tắt, chi tiết ở docs/tenants/sports/08-test-cases.md):
#  - entry_type của ca = entry_type của kịch bản (docs/tenants/sports/05-problem-catalog.md).
#  - Ca COMMAND/EVENT/WORKFLOW/RECONCILIATION có expected_state; expected_route = null
#    (không đi route hỏi), trừ ca RECONCILIATION kết thúc bằng một câu hỏi kiểm tra.
#  - failure_injection là chuỗi mô tả lỗi cố ý gây ra, hoặc null.
#  - Mã ca hỏng SPT-F-NNN nằm trong failure_injection và/hoặc acceptance_criteria:
#    "SPT-F-NNN: điều phải đúng" nghĩa là ca này canh giữ ca hỏng đó.
#  - business_rules là mã luật (slug) định nghĩa ở docs/tenants/sports/01-business-map.md.

- id: SPT-T-001
  tenant: xyz-sports
  domain: live_match
  business_process: live-score-query
  scenario: SPT-S-001
  entry_type: QUERY
  category: happy_path
  input: "Tỉ số Sông Hồng – Phố Núi đang là bao nhiêu, trận kết thúc chưa?"
  preconditions:
    - "MATCH_0000912 (Sông Hồng FC - Phố Núi United) đang LIVE_1H, đồng hồ 23'"
    - "bàn thắng 23' của PLAYER_04571 vừa trở thành sự kiện hiệu lực 6 giây trước, match_states.state_version=3"
    - "bản cache của câu trả lời cách đây 20 giây còn ghi 0-0 (state_version=2)"
  sources: [match_events, match_states, entity_aliases]
  expected_route: SQL_QUERY
  expected_tools: [get_match_state]
  expected_context:
    - "match_state MATCH_0000912: score 1-0, status LIVE, period FIRST_HALF, state_version 3"
    - "event GOAL 23' PLAYER_04571 (hiệu lực)"
  expected_output_properties:
    - "nêu tỉ số 1-0, đội nhà (Sông Hồng FC) viết trước"
    - "nêu trạng thái đang diễn ra và thời điểm cập nhật (as_of)"
    - "dùng mẫu câu của tenant, không gọi model"
  expected_state: null
  must_not_do:
    - "không lấy tỉ số từ bài viết hay kết quả RAG"
    - "không trả bản cache có state_version cũ hơn match_states"
  business_rules: [score_is_derived_from_effective_goals, live_facts_never_from_documents, cache_keyed_by_state_version]
  permissions: {principal: fan_anonymous}
  failure_injection: null
  expected_fallback: null
  metrics: [router_accuracy, data_freshness, cache_staleness_rate]
  severity: S1
  acceptance_criteria:
    - "SPT-F-014: trận LIVE dùng TTL theo trạng thái; câu trả lời không cũ hơn state_version hiện tại"
    - "SPT-F-041: route là SQL_QUERY, không phải RAG"
    - "SPT-F-044: không dùng bài viết làm bằng chứng cho tỉ số"

