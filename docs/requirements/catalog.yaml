- id: REQ-MND-018
  area: MND
  statement: "Các thành phần 'không phải AI' là mã tất định bắt buộc, có chủ và test riêng: SQL/DB (số liệu chính xác), calculator (tổng tiền), auth/RBAC (quyền), parser/normalizer (4k → 4000), code đổi đơn vị, report builder (định dạng báo cáo), schema validator (thiếu trường bắt buộc), rules engine (ràng buộc nghiệp vụ), router (request đi flow nào; có thể không cần model), parser/OCR/layout (cấu trúc PDF), full-text (mã chính xác), tool (thực thi API), backend (retry/timeout, audit log), vận hành (SLA), quan sát (chi phí). Phần code ở ngoài lời gọi model nhiều hơn phần gọi model là bình thường và là dấu hiệu kiến trúc trưởng thành."
  rationale: "Một AI product tốt có nhiều phần mềm tất định và chỉ một vùng nhỏ thật sự cần model."
  sources:
