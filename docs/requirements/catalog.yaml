- id: REQ-RAG-017
  area: RAG
  statement: "Cây hỏng RAG mở rộng được ánh xạ tới test hoặc ghi 'chưa có': nạp (lỗi parse, OCR, chunk xấu, metadata xấu, dữ liệu cũ), truy xuất (lệch truy vấn, embedding kém, nhiễu, recall thấp, precision thấp, rerank sai), sinh (hallucination, bỏ qua evidence, tổng hợp sai, trích dẫn sai), ngữ cảnh (tràn, thiếu, trùng, mâu thuẫn, xếp sai), production (lộ quyền, index cũ, độ trễ, chi phí, quy mô, sập, cache sai, thiếu quan sát)."
