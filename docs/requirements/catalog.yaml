- id: REQ-MND-004
  area: MND
  statement: "AI là một tech stack, không phải phép thuật: mỗi capability của EAIS (router, context, RAG, model, tool, skill, MCP, agent...) có thẻ mô tả đủ sáu thuộc tính — khả năng, ràng buộc, kiểu hỏng, chi phí, cách tích hợp, yêu cầu vận hành — kể cả điểm mạnh và điểm yếu (mỗi công nghệ giỏi bài toán này nhưng không giải được bài toán khác). Mọi đề xuất capability mở đầu bằng câu 'AI đang giải quyết phần nào của bài toán?', không phải 'nhét AI vào đâu'."
  rationale: "[VIDEO] So sánh với blockchain: một database đặc biệt với điểm mạnh/yếu rõ; AI cũng là stack có failure mode và cost."
