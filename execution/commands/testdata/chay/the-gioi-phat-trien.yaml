      - {id: EX-03, type: excavator, name: Máy xúc EX-03, project: PRJ-A, aliases: [máy 03, máy xúc 03, MX-03], source_ids: {erp: asset-5003, fuel_sensor: EX003, warehouse_slip: EX-03}}
