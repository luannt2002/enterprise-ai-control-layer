# CI của EAIS: vet, gofmt, test CÓ PostgreSQL (và FAIL nếu có bất kỳ test nào bị SKIP), cổng danh tính, smoke E2E một lệnh.
#
# CHƯA CHẠY TRÊN GITHUB: tệp này được kiểm cú pháp YAML và MỌI lệnh trong nó đã được chạy tại máy với một PostgreSQL riêng, nhưng
# bản thân GitHub Actions chưa từng chạy nó. Lần chạy đầu tiên trên GitHub là phép thử thật của nó.
#
# Giới hạn đã biết (ghi thẳng, không giấu):
# - Action được ghim theo TAG đầy đủ (vN.M.P), chưa ghim theo SHA: máy dựng tệp này không tra được SHA của tag. Tag có thể bị di dời;
#   khi có mạng, thay bằng SHA đầy đủ của đúng các tag này.
# - PostgreSQL dùng đúng ảnh ghim theo digest của deploy/docker-compose.yml, xác thực "trust", không có bí mật nào trong tệp.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
        env:
          POSTGRES_DB: eais
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eais"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      EAIS_PG_ADMIN_DSN: postgres://postgres@127.0.0.1:5432/eais?sslmode=disable
      EAIS_PG_DSN: postgres://eais_app@127.0.0.1:5432/eais?sslmode=disable
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.2.0
        with:
          go-version-file: go.mod
          cache: true

      # poppler-utils: pdftotext cho bộ nạp PDF. fonts-dejavu-core: test của data/ingestion dựng PDF thử bằng DejaVuSans.ttf và TỰ BỎ QUA nếu
      # thiếu nó; cổng bên dưới cấm SKIP nên thiếu font sẽ làm CI đỏ ngay lần chạy đầu. poppler-utils chỉ kéo BẮC CẦU (libcairo2 →
      # libfontconfig1 → fontconfig-config) một TRONG nhiều gói font (fonts-dejavu-core | fonts-liberation | …): ảnh runner đã có sẵn gói
      # khác thì DejaVu không được cài. [ĐO apt-cache depends trên Linux Mint 22.3 nền Ubuntu 24.04; ảnh runner thật chưa kiểm.] Vì vậy cài
      # tường minh thay vì trông chờ.
      - name: Cài poppler-utils (pdftotext) và fonts-dejavu-core (phông dựng PDF thử)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fonts-dejavu-core
          pdftotext -v
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: go vet
        run: go vet ./...

      - name: gofmt (tệp git theo dõi)
        run: |
          bad=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$bad" ]; then
            echo "gofmt chưa chạy trên:" >&2
            echo "$bad" >&2
            exit 1
          fi

      # `go test … | tee` đi qua một đường ống: KHÔNG có pipefail thì mã thoát của cả đường ống là của tee (luôn 0) và test hỏng vẫn ra CI xanh.
      # Vì vậy bước tự đặt `set -eo pipefail` thay vì dựa vào cấu hình ngầm của runner (cmd/eais/ci_test.go chạy đúng đoạn lệnh này với một
      # `go` giả hỏng). Lớp thứ hai: scripts/kiem-skip-test.py cũng đỏ khi luồng JSON có test hay gói FAIL.
      - name: go test -count=1 -json ./... (có PG)
        run: |
          set -eo pipefail
          go test -count=1 -json ./... | tee test.json

      # Danh sách cho phép chỉ gồm test ĐO cần bên thứ ba / tệp cấu hình riêng mà CI cố ý không có (lý do ghi từng dòng trong tệp);
      # thiếu nó thì cổng đỏ trên main vì ba test evals/rag (F-014). scripts/cong/cong.sh chạy đúng bước này với cùng tệp.
      - name: Không test nào bị SKIP hay FAIL
        run: python3 -I scripts/kiem-skip-test.py test.json --cho-phep scripts/cong/skip-cho-phep.txt

      - name: Cổng danh tính và cổng kiến trúc
        run: go test -count=1 -run 'TestDanhTinh|TestSharedCodeHasNoTenantLiterals|TestSharedCodeHasNoDomainLiterals|TestRequestTypesHaveNoTenantField' .

      # EAIS_CODE_VERSION: script nhúng giá trị này vào binary bằng -ldflags (vết ghi phiên bản mã = commit đang kiểm, không phải "(devel)"),
      # rồi đối chiếu với phiên bản mà server báo lúc khởi động. Hai biến DSN ở mức job nên script dùng PG của job và không chạm Docker.
      - name: Smoke E2E một lệnh (migrate, nạp seed 42, serve, curl)
        env:
          EAIS_CODE_VERSION: ${{ github.sha }}
        run: scripts/chay-thu.sh
