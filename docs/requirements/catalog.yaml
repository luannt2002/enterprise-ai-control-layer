  area: BIZ
  statement: "Tenant cơ quan nhà nước (case #3) bị hoãn vì độ phức tạp pháp lý/compliance cao hơn nhiều và không dùng làm sandbox đầu tiên; đặc trưng cần ép: văn bản pháp luật, công văn, tờ trình, hồ sơ hành chính, biểu mẫu, chữ ký, thẩm quyền, phiên bản và hiệu lực văn bản, dữ liệu người dân/doanh nghiệp, workflow phê duyệt, RBAC, audit, trích dẫn, source authority, temporal validity, human approval."
  rationale: "Cực mạnh cho RAG, Document Intelligence, Source of Truth, Authorization, Workflow nhưng không phải nơi học kiến trúc đầu tiên."
  sources:
