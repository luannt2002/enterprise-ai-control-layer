  note: null
- id: REQ-SEC-004
  area: SEC
  statement: "Phân quyền MVP là RBAC theo vai: mỗi vai có tập quyền cho phép và bị từ chối rõ ràng (project.read, report.read, report.create, equipment.read; payroll.read, payment.approve bị từ chối); kiểm quyền là mã tất định chạy trước route, tool và truy xuất; mọi bước 'được đọc dữ liệu nào, được thực thi tool nào, có hành động ghi/xoá không' có test cho và test từ chối."
  rationale: "Permission là Auth/RBAC chứ không phải AI."
