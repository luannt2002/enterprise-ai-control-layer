  phase: GATED
  verification: {kind: review, ref: "ADR MCP có đủ 9 khía cạnh; test cô lập credentials theo tenant"}
  note: "Chỉ áp dụng sau khi cổng MCP (REQ-MCP-002) mở; kiểm bằng ADR và test cô lập tenant."
- id: REQ-MCP-004
  area: MCP
  statement: "Mô hình khi mở MCP: Enterprise AI → MCP Client → MCP Servers theo tenant (ERP, tài liệu, hệ dự án, công cụ nội bộ); capability từ server được ánh xạ thành ToolSpec và đi qua đúng luồng tool (kiểm schema, quyền, audit); MCP server cung cấp ba primitive resources, prompts, tools; đặc tả lõi chuyển sang stateless có routing/caching/auth phù hợp hạ tầng production."
  rationale: "MCP là chuẩn kết nối chứ không phải thay thế luồng kiểm soát tool."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART XV — MCP", lines: "873-912"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "9. MCP — cái này hay bị hiểu nhầm nhất", lines: "3775-3819"}
