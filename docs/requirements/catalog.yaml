  note: null
- id: REQ-RT-004
  area: RT
  statement: "Hàng đợi/stream cho realtime chỉ được thêm khi số đo thông lượng/độ trễ chứng minh đường đồng bộ không đạt."
  rationale: "Queue/Stream là capability có cổng."
