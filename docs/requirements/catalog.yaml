- id: REQ-SKL-007
  area: SKL
  statement: "Vòng đời skill ở MVP gồm: hướng dẫn thô → quy trình tác vụ → skill tái dùng → hợp đồng đầu vào → workflow → hướng dẫn dùng tool → luật quyết định → xử lý lỗi → kiểm → hợp đồng đầu ra → skill registry → chọn skill theo ý định."
