- id: REQ-MND-013
  area: MND
  statement: "Mọi ADR và đề xuất capability mở đầu bằng câu hỏi hệ thống: 'Business problem này cần một SYSTEM như thế nào để biến dữ liệu thực tế — bẩn, mơ hồ, không đồng nhất, có ràng buộc — thành output/action đủ chính xác, kiểm chứng được và chịu trách nhiệm được?'; chỉ sau đó mới trả lời có cần AI, RAG, semantic search, router, context builder, tool, MCP, skill, fine-tuning hay training; không bắt đầu từ 'model nào giải được bài này?'."
  rationale: "Câu hỏi đáng giữ lâu dài nhất từ ghi chú nguồn; chuyển từ 'tích hợp AI' sang AI Systems Engineering."
