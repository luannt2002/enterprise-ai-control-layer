    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "STUDY LOOP ĐỀ XUẤT › Vòng 4 --- First Principles", lines: "2655-2677"}
  applies_to: [tenants/construction, docs]
  phase: MVP
  verification: {kind: review, ref: "tài liệu case study có ≥20 nghiệp vụ với 12 cột; mỗi kịch bản CON-S có bảng 12 câu"}
  note: null
- id: REQ-BIZ-015
  area: BIZ
  statement: "Ba case study và thứ tự: #1 cầu đường (physical operations: dữ liệu hiện trường bẩn, độ chính xác số liệu, tài liệu, thị giác, IoT), #2 sản xuất giày-da (manufacturing & supply chain: ERP/MES/BOM, tồn kho, QC, kế hoạch sản xuất, dự báo, truy vết), #3 cơ quan nhà nước (tri thức/quy định/workflow: thẩm quyền văn bản, quyền, phê duyệt, trích dẫn, audit, hiệu lực pháp lý) trên CÙNG một lõi hệ thống. Thứ tự: học kiến trúc bằng #1, kiểm abstraction có reuse được bằng #2, ép authority/compliance/workflow/security/audit/citation bằng #3. Brief V2 thay hiện trạng: tenant tham chiếu thứ hai là Sports; giày-da lùi thành Tenant C về sau."
  rationale: "Nếu kiến trúc chỉ chạy được cầu đường thì đó là custom app, không phải platform."
  sources:
