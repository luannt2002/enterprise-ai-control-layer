- id: REQ-CTX-012
  area: CTX
  statement: "Bộ kiểm context gồm bốn họ ca: context pollution (bằng chứng không liên quan chen vào), stale context (bằng chứng cũ), conflicting context (bằng chứng mâu thuẫn), unauthorized context (bằng chứng không được xem); mỗi họ có ca và kết quả mong đợi."
  rationale: "Bốn kiểu hỏng context mà prompt V2 yêu cầu kiểm."
