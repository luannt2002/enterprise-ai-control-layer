  statement: "Không giao cho model các vai database, calculator, rules engine, workflow engine và source of truth cùng lúc; mỗi vai có chủ tất định: Database giữ facts; Code thực thi luật; Router chọn flow; RAG truy xuất tri thức; Context chuẩn bị evidence; Skills định nghĩa procedure; Tools thực thi; MCP chuẩn hoá tích hợp (khi cổng mở); Model làm reasoning và ngôn ngữ; Eval chứng minh hệ thống hoạt động. Model mạnh nhất không đồng nghĩa agent tốt nhất."
  rationale: "Nguyên tắc duy nhất nên giữ nếu chỉ giữ một câu; chuyển từ 'dùng AI' sang AI Systems Engineering."
