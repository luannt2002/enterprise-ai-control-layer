  note: null
- id: REQ-RT-003
  area: RT
  statement: "Luồng realtime của sports: provider → ingestion → chuẩn hoá → nhận dạng thực thể → khử trùng → event store → projection → API → ứng dụng; MVP chạy đồng bộ không cần hàng đợi hay cache ngoài."
  rationale: "Luồng đầu-cuối của dữ liệu realtime."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART XVIII — REALTIME DATA", lines: "1001-1028"}
