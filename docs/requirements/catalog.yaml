  note: null
- id: REQ-DAT-006
  area: DAT
  statement: "Loại dữ liệu quyết định chiến lược xử lý, không phải 'mọi dữ liệu → embedding → vector DB': structured (bảng, bản ghi có kiểu) → kho facts và SQL_QUERY; semi-structured (JSON, XML, log) → ánh xạ theo schema; unstructured (PDF, văn bản, ảnh, âm thanh, video) → đọc/OCR → chunk → index; mỗi loại nguồn của pack khai báo pipeline xử lý của nó."
