  statement: "LLM-as-judge, đánh giá người, A/B test và đánh giá online chỉ là tín hiệu bổ sung sau eval offline: không thay kiểm tất định khi kiểm tất định khả thi, và LLM-as-judge phải được hiệu chuẩn bằng nhãn người trước khi dùng."
