  verification: {kind: eval, ref: "khi cổng mở: báo cáo precision/recall/FP/FN/độ trễ trên tập test của khách"}
  note: "Chỉ áp dụng sau khi cổng thị giác mở; chưa có dataset."
- id: REQ-RT-001
  area: RT
  statement: "Mô hình sự kiện chuẩn của sports: mỗi sự kiện có kỳ (period), phút (clock), bù giờ (stoppage), loại, đội, cầu thủ; hai provider ghi khác nhau (bàn thắng phút 45+2 so với phút 47) cùng ánh xạ về period = FIRST_HALF, clock = 45, stoppage = 2; thời điểm lưu theo UTC kèm múi giờ địa phương."
  rationale: "Canonical event model là lõi của tenant sports."
  sources:
