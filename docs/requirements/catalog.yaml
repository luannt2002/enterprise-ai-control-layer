- id: REQ-MND-001
  area: MND
  statement: "Model chỉ là một capability xác suất nằm giữa hệ phần mềm tất định: chỉ chặng generate (S8) và bước model của skill được phép gọi model; mọi chặng còn lại (accept, tenant, normalize, resolve, intent, route, execute, context, validate, respond) là mã tất định có test; không có đường nào đưa đầu ra của model tới người dùng hoặc tới thao tác ghi mà không qua kiểm S9 hoặc guard của workflow engine. AI nằm trong phần mềm, phần mềm không nằm trong AI."
  rationale: "Invariant số 1 của dự án: production AI = phần mềm tất định bao quanh lõi xác suất."
