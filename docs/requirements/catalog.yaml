- id: REQ-NRM-001
  area: NRM
  statement: "Chuẩn hoá lượng và đơn vị tiếng Việt phải đưa mọi biến thể về một biểu diễn chuẩn: '4k lít', '4.000 lít', '4000 lít', '4 ngàn lít', 'bốn nghìn lít', 'dầu 4k', 'DA: 4.000', '4,000 L', '4.000L', 'đổ bốn ngàn lít dầu' → {quantity: 4000, unit: L, chỉ số: nhiên liệu}; ba cách viết khác nhau của một báo cáo ngày (ca sáng 350m/máy xúc 7h/dầu 4k/22 người/mưa từ 14h; 'DA 4.000L, KL 0.35km, NC 22, Mưa chiều'; 'bốn ngàn lít dầu, khoảng ba trăm năm chục mét') phải hội tụ về cùng một bản ghi ngày."
  rationale: "[VIDEO] Cùng một lượng nhưng mỗi người nhắn một kiểu; phải đúng gần như tuyệt đối vì là dữ liệu critical."
  sources:
