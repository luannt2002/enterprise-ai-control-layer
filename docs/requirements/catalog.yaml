  phase: GATED
  verification: {kind: eval, ref: "cổng mở khi có bộ ca multi-hop mà hybrid đo được là thất bại; ADR kèm số đo"}
  note: "Điều kiện mở cổng: có bộ ca câu hỏi quan hệ nhiều bước tái lập được mà truy xuất hybrid thất bại đo được; chưa có ca như vậy ở hai tenant tham chiếu."
- id: REQ-RAG-022
  area: RAG
  statement: "Corpus mô phỏng của construction gồm chín loại: SOP, hợp đồng, tiêu chuẩn kỹ thuật, sổ tay thiết bị, metadata bản vẽ, biên bản kiểm tra, tài liệu QA, chính sách, báo cáo lịch sử; MVP có SOP, sổ tay thiết bị, chính sách và hợp đồng; các loại còn lại ở V1."
  rationale: "Corpus là tài sản riêng của tenant (Shared RAG engine ≠ shared corpus)."
  sources:
