  area: SOT
  statement: "Ca bốn nguồn nói bốn số (Excel 4.000 L; database 3.850 L; Zalo 'dầu 4k'; phiếu xuất kho 3.900 L) phải được xử lý bằng cách gán mỗi giá trị vào chỉ số ngữ nghĩa của nó trước khi so; hệ thống không bao giờ 'chọn số hợp lý'; kết quả là hoặc hoà giải trong cùng chỉ số theo ma trận thẩm quyền, hoặc fact dẫn xuất chênh lệch kèm cờ điều tra. Brief 05 làm rõ ca này: bốn giá trị là bốn ngữ nghĩa khác nhau chứ không chỉ là bốn nguồn của một fact."
  rationale: "Ca CON-037 và Case 05 cho thấy RAG không phải lời giải; cần thẩm quyền, hoà giải, quy tắc nghiệp vụ, audit."
