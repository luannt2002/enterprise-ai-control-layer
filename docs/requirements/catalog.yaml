  applies_to: [intelligence/rag, core/contracts]
  phase: MVP
  verification: {kind: test, ref: "hai implementation giả của KnowledgeRetriever hoán đổi trong test router/context mà kết quả không đổi; kiểm package rag không import governance/workflow"}
  note: null
- id: REQ-RAG-002
  area: RAG
  statement: "Tài liệu phân biệt ba bài toán của RAG: Retrieval (tìm evidence), Augmentation (dựng context từ evidence + câu hỏi + chỉ dẫn) và Generation (sinh câu); RAG không đồng nghĩa vector DB (có thể là vector, tìm kiếm văn bản, truy xuất có cấu trúc SQL, graph, API-backed, hybrid); thang trừu tượng được giữ đúng: embedding ≠ semantic search ≠ RAG ≠ context engineering ≠ AI system."
  rationale: "[VIDEO] RAG ≠ Vector Database."
  sources:
