- id: REQ-MND-014
  area: MND
  statement: "Mỗi lượt xử lý phải trả lời được mười hai câu kiểm soát 'model được thấy thế giới nào': WHO (ai hỏi), WHAT (muốn gì), TENANT (thuộc tổ chức nào), PERMISSION (được biết/làm gì), DATA (dữ liệu nào liên quan), SOURCE (nguồn nào đáng tin), VERSION (phiên bản nào có hiệu lực), CONTEXT (đưa gì cho model), MODEL (có thực sự cần model không), ACTION (model được đề xuất hành động nào), VALIDATION (đầu ra có đúng ràng buộc không), AUDIT (vì sao hệ thống làm vậy). Mỗi câu ánh xạ tới một trường trace/audit của lượt."
  rationale: "Enterprise AI là kiểm soát model được nhìn thấy thế giới nào — model như reasoning engine bị nhốt trong phòng."
  sources:
    - {file: brief-06-model-vs-enterprise-system.md, section: "6. Enterprise AI thực chất là kiểm soát “model được nhìn thấy thế giới nào”", lines: "352-399"}
    - {file: brief-06-model-vs-enterprise-system.md, section: "4. Vậy AI thật sự nằm ở đâu?", lines: "195-200"}
  applies_to: [core/pipeline, observability/traces, governance/audit]
  phase: MVP
  verification: {kind: test, ref: "test: một lượt mẫu có đủ 12 trường (principal, tenant, tập quyền, intent, bằng chứng + phiên bản, id ContextPackage, cờ gọi model, hành động đề xuất/thực thi, Verdict, id audit)"}
  note: null
- id: REQ-MND-015
  area: MND
  statement: "Chuỗi câu hỏi thiết kế mà EAIS phải giải (rộng hơn câu 'đưa knowledge nào vào model?' của RAG): WHO → WHAT BUSINESS CONTEXT → WHICH DATA → WHICH SOURCE OF TRUTH → WHICH PERMISSION → WHICH CAPABILITY → DO WE EVEN NEED AI? → WHICH CONTEXT → WHICH MODEL / SKILL → WHAT MAY IT PROPOSE? → WHAT MAY ACTUALLY EXECUTE? → HOW DO WE VALIDATE? → HOW DO WE PROVE IT?. Mỗi bước phải có chặng, hợp đồng hoặc test tương ứng; bước nào chưa có phải ghi là khoảng trống."
  rationale: "Phần 'enterprise' mà kiến trúc model-centric/RAG-centric cũ còn thiếu."
  sources:
    - {file: brief-06-model-vs-enterprise-system.md, section: "8. Vì vậy cái bạn đang xây không phải “làm AI model” › Một câu có thể dùng làm định nghĩa EAIS", lines: "521-555"}
  applies_to: [docs, core/pipeline]
  phase: MVP
  verification: {kind: review, ref: "bảng 13 bước → chặng/hợp đồng/test trong docs/01-architecture.md; bước chưa phủ nêu rõ trong mục khoảng trống"}
  note: null
- id: REQ-MND-016
  area: MND
  statement: "README và tài liệu kiến trúc mở đầu bằng đúng câu định nghĩa: 'EAIS is a multi-tenant Enterprise AI Systems Platform for turning domain-specific business data, knowledge, workflows, and tools into governed, testable AI capabilities without coupling the core platform to a single industry.'; tên dự án là EAIS — Enterprise AI Systems, loại 'Multi-Tenant Enterprise AI Systems Platform'; không gọi là RAG Platform, AI Agent Platform hay Enterprise Chatbot vì thu hẹp dự án quá sớm."
  rationale: "Tên đúng bản chất giữ đúng mindset: AI Model chỉ là một component của Enterprise AI System."
  sources:
    - {file: brief-03-eais-naming.md, section: "(mở đầu, chưa có tiêu đề)", lines: "3-14"}
    - {file: brief-03-eais-naming.md, section: "EAIS — Enterprise AI Systems › Tôi sẽ đặt hierarchy tên như sau", lines: "132-138"}
  applies_to: [docs]
  phase: MVP
