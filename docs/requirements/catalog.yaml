  area: SOT
  statement: "Fact và tài liệu có độ tươi và hiệu lực: observed_at, khoảng hiệu lực, ngưỡng cũ (stale) theo pack; câu trả lời nêu thời điểm quan sát; fact quá hạn tươi không thắng fact còn tươi cùng chỉ số; hỏi 'phiên bản/hiệu lực nào đang áp dụng' có đường trả lời tất định."
