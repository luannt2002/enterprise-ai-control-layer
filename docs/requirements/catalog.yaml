  note: null
- id: REQ-RAG-013
  area: RAG
  statement: "Đầu ra truy xuất đi qua khử trùng và ngưỡng liên quan: bằng chứng dưới ngưỡng bị loại, kết quả rỗng đi đường lùi (không bịa), top-k cấu hình được; thứ tự: query processing → {vector, từ vựng, lọc metadata} → candidate pool → (rerank có cổng) → khử trùng → ngưỡng điểm → top evidence."
  rationale: "Retrieval engine là một mini hệ tìm kiếm với từng bước kiểm được."
