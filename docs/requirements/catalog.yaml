  area: RTE
  statement: "Phân loại ý định bằng model chỉ mở khi luật của pack trượt từ một ngưỡng đo được trên bộ ca router; kết quả classifier chỉ là đề xuất (route + điểm), ngưỡng/chính sách/quyền do code quyết, và classifier không bao giờ trực tiếp kích hoạt hành động ghi."
  rationale: "Capability xác suất có cổng của tầng điều khiển."
