- id: REQ-CV-001
  area: CV
  statement: "Thị giác máy là một hệ thống chứ không chỉ một model: chuỗi camera → độ phân giải → góc quay → ánh sáng → môi trường → dataset miền → gán nhãn → huấn luyện → ngưỡng → phần cứng → độ trễ → triển khai → đánh giá production; 'model tốt nhất' không bằng 'giải pháp production'; mỗi triển khai của một khách khai đủ các yếu tố môi trường và được đánh giá trên phân phối thật của khách, không dùng chung một model cho mọi khách."
  rationale: "[VIDEO] Không phải cứ gắn model nhận dạng nổi tiếng vào là xong; mỗi doanh nghiệp có camera, độ phân giải, góc quay, ánh sáng khác nhau."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "28. PHASE 25 --- YOLO VÀ BÀI HỌC \"MODEL TỐT ≠ SYSTEM TỐT\"", lines: "1577-1638"}
