  - id: def-build
    projects:
      - {id: PRJ-Z, name: Cầu Z, aliases: [dự án Z]}
    equipment:
      - {id: EX-03, type: excavator, name: Máy xúc EX-03 (B), project: PRJ-Z, aliases: [], source_ids: {erp: asset-7003, fuel_sensor: EX003, warehouse_slip: EX-03}}

