# Bộ ca WIN do KIỂM THỬ VIÊN ĐỘC LẬP soạn (không đọc mã, không đọc intents/lexicon/templates).
# Đáp án tính từ world.yaml + metrics.yaml + policy.yaml + docs/04. Ca nào ghi "CHƯA CHẮC" là chỗ
# luật chưa nói rõ — người soát cần phân xử trước khi coi đó là ca đóng băng.
suite: win
tenant: abc-infra
reference_date: 2026-10-20

cases:
