  statement: "Với mỗi tenant phải dựng mô hình nghiệp vụ trước khi mô hình AI: Business Model, Customers, Departments, Actors, Products/Services, Core Workflows, Supporting Workflows, Systems, Data Sources, External Integrations, Business Rules, Compliance, Risks, KPIs. Với từng phòng ban không dừng ở tên mà xác định chuỗi: Actor → Trigger → Input → Process → Decision → Output → Downstream consumer → Data produced → System touched → Exceptions → Failure consequences."
