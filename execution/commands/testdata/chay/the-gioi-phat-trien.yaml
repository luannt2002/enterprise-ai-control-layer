      - {id: EX-06, type: excavator, name: Máy xúc EX-06, project: PRJ-A, aliases: [], source_ids: {erp: asset-5006, fuel_sensor: EX006, warehouse_slip: EX-06}}
      - {id: EX-07, type: excavator, name: Máy xúc EX-07, project: PRJ-A, aliases: [], source_ids: {erp: asset-5007, fuel_sensor: EX007, warehouse_slip: EX-07}}
      - {id: EX-08, type: excavator, name: Máy xúc EX-08, project: PRJ-A, aliases: [], source_ids: {erp: asset-5008, fuel_sensor: EX008, warehouse_slip: EX-08}}
      - {id: EX-09, type: excavator, name: Máy xúc EX-09, project: PRJ-B, aliases: [], source_ids: {erp: asset-5009, fuel_sensor: EX009, warehouse_slip: EX-09}}
      - {id: EX-10, type: excavator, name: Máy xúc EX-10, project: PRJ-A, aliases: [], source_ids: {erp: asset-5010, fuel_sensor: EX010, warehouse_slip: EX-10}}
