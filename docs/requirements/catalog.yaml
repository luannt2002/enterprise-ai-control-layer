  statement: "Vòng cải tiến hệ thống: dùng thực tế → trace/phản hồi/lỗi → đánh giá → dataset/ca kiểm → cải tiến (prompt, skill, router, retrieval, tool, model/huấn luyện nếu cần) → phiên bản mới → đánh giá lại; mỗi thay đổi có phiên bản và báo cáo eval."
