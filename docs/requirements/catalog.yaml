  note: null
- id: REQ-RT-011
  area: RT
  statement: "Các nghiệp vụ lớp trên của sports (địa phương hoá tên, tìm kiếm, thông báo, sinh nội dung, giải thích bằng AI) chỉ ở V2; nội dung sinh từ fact có kiểm số S9; thêm môn thể thao mới chỉ bằng pack và adapter provider, không sửa core."
  rationale: "Mở rộng domain sau khi lõi chạy."
