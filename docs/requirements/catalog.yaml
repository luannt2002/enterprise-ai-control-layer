  phase: V1
  verification: {kind: review, ref: "tài liệu 04-platform/12-observability có runbook 15 bước với trường trace tương ứng"}
  note: null
- id: REQ-OBS-005
  area: OBS
  statement: "Cây câu hỏi gỡ lỗi hai mươi bước khi AI trả lời sai: 01 business requirement rõ không; 02 input ambiguous; 03 input đã normalize chưa; 04 data đúng không; 05 source of truth đúng không; 06 parsing đúng không; 07 entity/meaning hiểu đúng context không; 08 router đúng flow không; 09 retrieval đúng evidence không; 10 reranker chọn đúng không; 11 Context Builder đưa đúng context không; 12 permission/filter đúng không; 13 prompt/skill đúng procedure không; 14 tool gọi đúng không; 15 tool trả đúng không; 16 model reasoning/generation sai không; 17 validator có bắt lỗi không; 18 có nên abstain/hỏi lại không; 19 E2E eval có ca này chưa; 20 regression suite có ngăn lỗi quay lại không."
  rationale: "Bản mở rộng 20 bước của cây gỡ lỗi."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "PART XXX — SYSTEM IMPROVEMENT › 31. Khi hệ thống fail, sửa cái gì?", lines: "7168-7213"}
