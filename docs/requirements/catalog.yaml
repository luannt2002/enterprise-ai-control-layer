  area: RAG
  statement: "Nạp tài liệu chạy như job có thể thử lại: nạp tăng dần (chỉ phần đổi), batching nhúng, giới hạn đồng thời, retry/timeout có giới hạn, fallback khi dịch vụ nhúng/parse lỗi (nhãn third_party/infra); các vấn đề production của RAG cũ (incremental indexing, update/delete, versioning, caching, batching, concurrency, latency/cost, retry/timeout, monitoring, permissions) được chuyển vào đúng capability/control plane của EAIS chứ không bỏ."
