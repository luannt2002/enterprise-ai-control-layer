  area: DAT
  statement: "Mỗi dataset có chủ sở hữu; dữ liệu vi phạm kiểm lúc nạp được báo về chủ dữ liệu (review_queue hoặc thông báo) thay vì bị bỏ qua hay sửa im lặng; chủ sở hữu và cơ chế cập nhật là thuộc tính bắt buộc của nguồn."
