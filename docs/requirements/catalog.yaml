  area: EVL
  statement: "Mọi ca không biểu diễn được trong kiến trúc hiện tại phải được ghi thành failure: ca → kiến trúc có hỏng không → nguyên nhân gốc → thiếu primitive? → abstraction hiện có mở rộng được không → nếu không: ứng viên capability mới → test → bằng chứng → ADR → core; không thêm tính năng bằng tưởng tượng."
  rationale: "Cách tiến lên mà không phình kiến trúc vô căn cứ."
