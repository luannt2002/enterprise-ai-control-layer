  note: null
- id: REQ-BIZ-012
  area: BIZ
  statement: "Bộ kịch bản CON-S phải có ít nhất một kịch bản cho mỗi trường hợp: 01 báo cáo công trường từ ba cách viết (ca sáng làm 350 m, máy xúc chạy 7h, dầu 4k, 22 người, mưa từ 14h / 'DA 4.000L, KL 0.35km, NC 22, Mưa chiều' / 'đổ bốn ngàn lít dầu, làm được khoảng ba trăm năm chục mét') → báo cáo ngày chuẩn; 02 giám đốc hỏi số liệu chính xác; 03 hỏi kiến thức nghiệp vụ; 04 cần cả SQL và RAG; 05 xung đột dữ liệu; 06 cùng từ khác nghĩa; 07 PDF hồ sơ; 08 ảnh công trường (có cổng); 09 tool/MCP; 10 skill; 11 agent (có cổng); 12 evaluation; 13 production."
  rationale: "Mười ba tình huống của brief 01 là xương sống kịch bản construction."
  sources:
    - {file: brief-01-case-study-construction.md, section: "Và đây mới là phần cực hay", lines: "103-718"}
  applies_to: [tenants/construction, evals]
  phase: MVP
  verification: {kind: test, ref: "script kiểm danh mục CON-S: đủ nhãn case-01..case-13; case-08 và case-11 được đánh dấu GATED"}
  note: null
- id: REQ-BIZ-013
  area: BIZ
  statement: "Mỗi capability của core phải truy ngược được tới ít nhất một business case; bảng truy vết gồm: '4k / 4.000 / bốn ngàn' → đầu vào không nhất quán → Normalization; từ chuyên ngành → mơ hồ ngữ nghĩa → Context/Ontology; báo cáo Zalo → phi cấu trúc thành có cấu trúc → Extraction; số nhiên liệu → fact chính xác → SQL; SOP/quy định → truy xuất tri thức → RAG; actual vs SOP → nhiều nguồn → Context Builder; câu hỏi khác loại → chọn đường → Router; làm báo cáo → quy trình đã biết → Skill; query ERP → hành động ngoài → Tool; chuẩn tích hợp → tương tác → MCP; PDF/BOQ → cấu trúc tài liệu → Document Intelligence; ảnh công trường → hiểu hình ảnh → CV; số liệu mâu thuẫn → thẩm quyền → Data Governance; không chắc nghĩa → bất định → Clarification; output critical → độ tin cậy → Validation; chứng minh đúng → chất lượng → Evaluation; debug production → RCA → Observability; nhiều công ty → SaaS → Multi-tenancy."
  rationale: "Một domain → hàng chục problem → mỗi problem buộc một công nghệ chứng minh lý do tồn tại; sổ này là bảng truy vết đó."
  sources:
    - {file: brief-01-case-study-construction.md, section: "Đây chính là lý do tôi chọn CẦU ĐƯỜNG", lines: "719-749"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "mỗi package lõi trong §3 trỏ tới ≥1 dòng của bảng 18 dòng hoặc tới ADR ngoại lệ; kiểm bằng review catalog"}
  note: null
- id: REQ-BIZ-014
  area: BIZ
  statement: "Tài liệu case study construction dựng ABC từ con số 0 với 20–30 nghiệp vụ thực tế (mở rộng theo 30 domain); mỗi nghiệp vụ map đủ: Raw Reality → Business Problem → Data → Failure Modes → Deterministic Solution → AI Solution → Router → Context → RAG/SQL/Tool → Validation → Eval → Production Gate; và mỗi khái niệm của ghi chú nguồn map được sang business problem → data → component → flow → failure → solution → metric. Với mỗi ca thực tế phải trả lời mười hai câu: Problem? Data? Source of truth? Ambiguity? Deterministic part? Probabilistic part? Context? Route? Tool? Validation? Failure? Metric?"
  rationale: "Biến mindset thành tài liệu mà mọi keyword đều có vị trí cụ thể."
  sources:
    - {file: brief-01-case-study-construction.md, section: "Thứ tự tôi khuyên", lines: "926-933"}
