  verification: {kind: test, ref: "chạy RTE-T với ModelGateway vô hiệu → đạt ngưỡng router accuracy đã đặt"}
  note: null
- id: REQ-RTE-004
  area: RTE
  statement: "Router theo P13: luật tất định trước; nếu khớp đủ tin cậy → route; nếu không → classifier xác suất (CHỈ khi cổng đã mở); nếu vẫn không đủ tin cậy hoặc cổng đóng → CLARIFICATION kèm ứng viên. Điều khiển tất định có thể quản lý một classifier xác suất dưới ngưỡng tin cậy và đường lùi; không cực đoan hoá 'router tuyệt đối không được xác suất', cũng không để classifier tự quyết không ngưỡng."
  rationale: "Deterministic control ≠ mọi thành phần phải tất định."
