  area: ENT
  statement: "Chuỗi giải nghĩa phải theo thứ tự phạm vi: raw token → tenant → project/domain → phòng ban → loại tài liệu → trạng thái workflow → ngữ cảnh xung quanh → ontology/từ điển → danh sách nghĩa ứng viên → độ tin cậy → giải quyết hoặc hỏi lại; chín câu hỏi của bài toán nghĩa (domain nào, thực thể nào, ngữ cảnh hiện tại, ý định, từ điển thuật ngữ, ontology/taxonomy, có cần disambiguation không, đủ tin cậy không, có cần hỏi lại không) phải trả lời được từ đầu ra của resolver."
  rationale: "Disambiguation theo ngữ cảnh là phần mềm tất định có ngưỡng, không phải để model đoán."
