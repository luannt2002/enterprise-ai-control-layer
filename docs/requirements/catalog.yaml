- id: REQ-MND-005
  area: MND
  statement: "Ba vấn đề nền của AI doanh nghiệp (garbage in–garbage out, phi tất định, hallucination) mỗi vấn đề có cơ chế kiểm thử được và một chỉ số: (1) GIGO → kiểm và chuẩn hoá lúc nạp, đo tỉ lệ bản ghi bị chặn/hỏi lại; (2) phi tất định → số liệu đến từ nguồn tất định, đo độ ổn định khi lặp cùng câu hỏi số liệu ≥ 100 lần; (3) hallucination → mọi số/mã/ngày/trích dẫn khớp bằng chứng, đo groundedness và validator catch rate."
  rationale: "[VIDEO] Ba vấn đề video nhấn mạnh; mỗi vấn đề cần một cơ chế chứ không phải một model mạnh hơn."
  sources:
