  note: null
- id: REQ-NRM-013
  area: NRM
  statement: "TIME RESOLUTION là chặng tất định: biểu thức thời gian tương đối ('hôm nay', 'tháng này', 'tuần trước', 'quý 3') được đổi thành khoảng ngày đóng bằng lịch và múi giờ của tenant trước khi truy vấn; quy tắc (ví dụ 'tháng này' là từ mùng 1 đến hôm nay hay cả tháng lịch) do pack định nghĩa; khoảng đã dùng luôn được nêu trong câu trả lời và bằng chứng; không bao giờ để model đoán khoảng ngày."
  rationale: "Câu 'Tháng này dự án A dùng bao nhiêu dầu?' cần khoảng ngày chính xác trước SQL."
  sources:
