  statement: "Yêu cầu 'làm báo cáo X' đi route WORKFLOW/skill: truy vấn dữ liệu bằng tool, dựng báo cáo bằng Report Builder tất định (mẫu của tenant), phân tích báo cáo có đủ mục không (thiếu → CLARIFICATION), kiểm rồi mới trả; model không bịa báo cáo hay số trong báo cáo."
  rationale: "[VIDEO] Làm báo cáo là classifier gọi report builder, lấy dữ liệu từ DB; model không cần 'bịa' report."
