    pham_vi: [PRJ-B]
    loai: tra_loi
    dap_an: [{tai_lieu: SOP-NL-01, ban: 2, chua: "lệch quá 1%"}]
  - ma: S7D-05
    hoi: "đi lấy dầu ở kho cho máy thì cần giấy tờ gì?"
    vai: [site_supervisor]
    pham_vi: [PRJ-A]
    loai: tra_loi
    dap_an: [{tai_lieu: SOP-NL-02, chua: "phiếu xuất kho (PXK)"}]
  - ma: S7D-06
    hoi: "kho hết dầu thì có được xuất trước rồi bù sau không?"
    vai: [warehouse_keeper]
    loai: tra_loi
    dap_an: [{tai_lieu: SOP-NL-02, chua: "không xuất âm kho"}]
    truot_biet_truoc: "diễn đạt khác tài liệu ('hết dầu', 'bù sau' ≠ 'không đủ', 'xuất âm kho'); bộ tìm từ khoá không biết đồng nghĩa — nấc sửa: đồng nghĩa của pack hoặc embedding có cổng (CLAUDE.md §19)"
  - ma: S7D-07
    hoi: "đổ dầu vào bồn phụ chứ không đổ vào máy thì ghi phiếu thế nào?"
    vai: [site_supervisor]
    pham_vi: [PRJ-B]
    loai: tra_loi
    dap_an: [{tai_lieu: SOP-NL-02, chua: "vào bồn"}]
  - ma: S7D-08
    hoi: "máy khoan cọc nhồi định mức mấy lít một giờ?"
    vai: [equipment_manager]
    loai: tra_loi
    dap_an: [{tai_lieu: QD-NL-03, ban: 1, chua: "Máy khoan cọc nhồi"}]
  - ma: S7D-09
    hoi: "xe lu rung được phép vượt định mức dầu bao nhiêu phần trăm?"
    vai: [project_manager]
    pham_vi: [PRJ-B]
    loai: tra_loi
    dap_an: [{tai_lieu: QD-NL-03, ban: 1, chua: "Xe lu rung 12 tấn"}]
  - ma: S7D-10
    hoi: "lượng dầu hợp lý của một máy tính ra sao?"
    vai: [equipment_manager]
    loai: tra_loi
    dap_an: [{tai_lieu: QD-NL-03, ban: 1, chua: "nhân giờ máy theo đồng hồ"}]
  # Báo cáo ngày
