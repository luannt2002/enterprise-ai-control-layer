  statement: "Chất lượng dữ liệu được đo theo từng nguồn trên sáu chiều: chính xác (accuracy), đầy đủ (completeness), nhất quán (consistency), hợp lệ (validity), duy nhất (uniqueness), độ tươi (freshness); báo cáo chất lượng theo nguồn được sinh trong evals và dùng làm điều kiện bật route trả lời của tenant."
