  note: null
- id: REQ-SEC-006
  area: SEC
  statement: "Chính sách vai → capability khai trong pack và thực thi bởi governance/permissions trước MỌI tool, lệnh và route: được tìm tài liệu? truy vấn SQL? tạo báo cáo? duyệt? gọi tool nào?; capability không được cấp thì không tồn tại với principal đó; model không tự cấp quyền cho chính nó."
  rationale: "Quyền capability nằm trong software/policy, không nằm trong prompt."
  sources:
