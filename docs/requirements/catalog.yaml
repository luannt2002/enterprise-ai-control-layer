- id: REQ-RT-006
  area: RT
  statement: "Mười hai ca hỏng realtime có ca kiểm thử SPT-F: provider chậm, provider không khả dụng, provider bất đồng, bàn thắng trùng, bàn thắng bị rút lại/sửa, ánh xạ cầu thủ sai, trạng thái trận không nhất quán, sự kiện đến sai thứ tự, cache cũ, lỗi múi giờ, giải đổi tên, cầu thủ chuyển đội; mỗi ca có kết quả mong đợi và nhãn lỗi."
  rationale: "Failure cases của PART XVIII."
