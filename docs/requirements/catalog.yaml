  applies_to: [docs]
  phase: V1
  verification: {kind: review, ref: "bảng rubric trong docs ghi cách chấm và ngày chấm; điểm cũ đánh dấu 'ý kiến, chưa đo'"}
  note: null
- id: REQ-EVL-017
  area: EVL
  statement: "Không công bố độ chính xác chung chung (ví dụ 'AI chính xác 99%') nếu không kèm bộ dữ liệu, chỉ số, tác vụ, cỡ mẫu, khoảng tin cậy và mức giống nhau giữa dữ liệu thử và phân phối production; mọi con số đo trong tài liệu kèm lệnh tái lập."
  rationale: "Luật con số của dự án."
