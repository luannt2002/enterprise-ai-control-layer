  note: null
- id: REQ-CTX-007
  area: CTX
  statement: "Lọc quyền diễn ra TRƯỚC khi bằng chứng vào ContextPackage: bằng chứng bị lọc theo vai, phạm vi dữ liệu (ABAC: dự án, tài liệu, chỉ số) và ACL tài liệu của principal; model không bao giờ nhận dữ liệu mà người hỏi không được xem; không dùng lời dặn 'đừng tiết lộ' trong prompt thay cho lọc."
  rationale: "Model không tự biết người dùng được xem gì; phải là hệ thống quyết định trước."
  sources:
