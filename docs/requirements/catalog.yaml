    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "25. PHASE 22 --- MCP", lines: "1431-1481"}
  applies_to: [execution/mcp, execution/tools]
  phase: GATED
  verification: {kind: test, ref: "test hợp đồng: capability MCP giả đi qua kiểm schema/quyền/audit giống tool nội bộ"}
  note: "Chỉ áp dụng sau khi cổng MCP mở; mọi capability MCP phải đi qua cùng luồng tool nên không tạo đường tắt quyền."
- id: REQ-MCP-005
  area: MCP
  statement: "Roadmap MCP gồm mười ba bậc: khái niệm giao thức → MCP client → MCP server → expose capability/context → discovery → hợp đồng tool/resource → authentication → authorization → tích hợp ngoài → bảo mật → governance → observability."
  rationale: "MCP có roadmap con riêng; chỉ học và làm khi cổng mở."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "ROADMAP 10 — MCP / INTEGRATION", lines: "5332-5358"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "29. Một câu để nhớ toàn bộ workshop › Ví dụ Router tự nó đã là một roadmap nhỏ", lines: "2015-2034"}
  applies_to: [execution/mcp, docs]
  phase: GATED
  verification: {kind: review, ref: "tài liệu 04-platform/08-mcp ghi roadmap và trạng thái cổng"}
  note: "Chỉ áp dụng sau khi cổng MCP mở; trước đó roadmap là tài liệu kế hoạch."
- id: REQ-MCP-006
  area: MCP
  statement: "Skill đóng gói theo định dạng SKILL.md thông qua MCP (một thư mục skill tối thiểu chứa hướng dẫn workflow có cấu trúc) chỉ được xem xét sau khi cổng MCP mở; skill của EAIS vẫn nằm trong pack skills.yaml."
  rationale: "Ghi chú nguồn: hệ sinh thái có tiện ích Skills cho MCP."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "20. Và đây là connection quan trọng nhất giữa hai video › 1. Bức tranh nên nâng cấp thành thế này", lines: "3339-3341"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "11. SKILL — lại là một thứ hoàn toàn khác", lines: "3929-3931"}
  applies_to: [execution/mcp, execution/skills]
  phase: GATED
  verification: {kind: review, ref: "ADR riêng khi cổng MCP mở"}
  note: "Chưa có nhu cầu; chỉ xem xét khi cổng MCP mở và có consumer cần tiêu thụ skill qua giao thức."
- id: REQ-AGT-001
  area: AGT
  statement: "Agent = vòng lặp Model → Action → Observation → Model...; agent ≈ model + tools + context + state + vòng lặp + chính sách quyết định, không phải một thành phần phép màu; production agent thêm context engineering, retrieval, memory/state, router/workflow, MCP, skills, eval, guardrail, observability; EAIS không có agent (execution/agents chưa tồn tại) cho tới khi cổng mở; đừng 'nhét Agent vì Agent đang hot'."
  rationale: "Agent chỉ có lý do tồn tại khi workflow cố định không giải được ca nghiệp vụ."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "14. Ghép lại thì bắt đầu thành Agent", lines: "4047-4147"}
    - {file: brief-01-case-study-construction.md, section: "Case 11 — Agent", lines: "563-608"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "16. RAG nằm ở đâu trong Agent?", lines: "4148-4196"}
  applies_to: [execution/agents]
  phase: GATED
  verification: {kind: eval, ref: "cổng mở khi có ca nghiệp vụ mà workflow cố định không giải được, đo được; ADR kèm số đo"}
  note: "Điều kiện mở cổng (docs/01-architecture.md §9): có ca nghiệp vụ mà workflow cố định không giải được và đo được; phải có test âm chứng minh route AGENT bị từ chối khi cổng đóng."
- id: REQ-AGT-002
  area: AGT
  statement: "Mỗi agent candidate phải trả lời chín câu trước khi mở: workflow tất định có giải được không; vì sao cần lập kế hoạch; agent được quyết định gì; agent KHÔNG BAO GIỜ được quyết định gì; số bước tối đa; ngân sách; quyền tool; điều kiện dừng; cổng người duyệt."
  rationale: "Câu hỏi nhận agent của prompt V2."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART XIV — AGENT", lines: "845-872"}
  applies_to: [execution/agents, docs]
  phase: GATED
  verification: {kind: review, ref: "tài liệu admission agent có đủ 9 câu; thiếu câu → không mở"}
  note: "Chỉ áp dụng khi có agent candidate; điều kiện mở theo cổng agent."
- id: REQ-AGT-003
  area: AGT
  statement: "So sánh bắt buộc giữa fixed workflow và agent: ca 'Kiểm tra toàn bộ dự án A hôm nay và báo những vấn đề cần quản lý chú ý' (lập kế hoạch → truy vấn tiến độ, vật tư, thiết bị, nhân công → truy xuất SOP → so kế hoạch với thực tế → phát hiện bất thường → thu bằng chứng → kết luận) phải được thử bằng skill/workflow cố định (Management Briefing) trước; chỉ khi thất bại đo được mới nâng lên agent."
  rationale: "Agent không phải điểm xuất phát mà là phương án khi workflow cố định thất bại."
  sources:
    - {file: brief-01-case-study-construction.md, section: "Case 11 — Agent", lines: "563-608"}
    - {file: brief-02-v2-two-tenants.md, section: "PART XIV — AGENT", lines: "845-872"}
  applies_to: [execution/agents, execution/skills, evals]
  phase: GATED
  verification: {kind: eval, ref: "ca Management Briefing: chạy bằng skill cố định, ghi kết quả; chỉ khi thất bại đo được mới có đề xuất agent"}
  note: "Chỉ áp dụng cho ca được đề xuất làm agent; cổng agent đóng cho tới khi có thất bại đo được của workflow cố định."
- id: REQ-AGT-004
  area: AGT
  statement: "Giới hạn cứng của agent do runtime áp (không phải do prompt): không bao giờ tự quyết trạng thái workflow, quyền, lựa chọn nguồn sự thật hay giá trị con số; số bước tối đa, ngân sách token/chi phí, tập tool được phép, điều kiện dừng và cổng người duyệt đều được thực thi bởi mã."
  rationale: "Model chỉ đề xuất; phần mềm sở hữu trạng thái và quyền."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART XIV — AGENT", lines: "845-872"}
    - {file: brief-05-architecture-review.md, section: "Thiếu tiếp: Workflow/State Machine cần trở thành first-class", lines: "270-327"}
  applies_to: [execution/agents, execution/workflows, governance/permissions]
  phase: GATED
  verification: {kind: test, ref: "test âm khi cổng mở: agent giả vượt số bước/ngân sách/tool → runtime dừng; thử đổi state → bị engine từ chối"}
  note: "Chỉ áp dụng sau khi cổng agent mở; các giới hạn là điều kiện bắt buộc của mọi agent."
- id: REQ-AGT-005
  area: AGT
  statement: "Agentic RAG (model đánh giá evidence chưa đủ → viết lại truy vấn → truy xuất lại; truy xuất tự sửa) chỉ mở khi truy xuất một lượt đo được là thất bại và cổng agent đã mở; 'RAG + thư viện agent' không tự là Agentic RAG."
  rationale: "RAG trở thành một tool của agent, không biến mất."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "16. RAG nằm ở đâu trong Agent?", lines: "4148-4196"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "14. PHASE 6 — Advanced RAG", lines: "2891-2970"}
  applies_to: [execution/agents, intelligence/rag]
  phase: GATED
  verification: {kind: eval, ref: "cổng mở khi truy xuất một lượt thất bại đo được trên bộ ca và cổng agent mở"}
  note: "Điều kiện mở cổng: bộ ca truy xuất một lượt (kể cả hybrid + rerank nếu mở) thất bại đo được và cổng agent đã mở."
- id: REQ-MEM-001
  area: MEM
  statement: "Context, memory và state là ba thứ khác nhau và tách biệt về mã và dữ liệu: Context là điều model thấy ở lần suy luận hiện tại (ContextPackage tạm theo lượt); Memory là thông tin hệ thống giữ lại để dùng về sau (tóm tắt/trích xuất hội thoại); State là trạng thái workflow do engine sở hữu; trạng thái luôn đọc từ nguồn tất định, không suy ra từ hội thoại hay memory."
  rationale: "Ba khái niệm hay bị gộp làm một và gây lỗi stale memory/state sai."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "13. MEMORY / STATE — component còn thiếu nữa", lines: "3981-4046"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "20. Và đây là connection quan trọng nhất giữa hai video › 1. Bức tranh nên nâng cấp thành thế này", lines: "3284-3344"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "29. Một câu để nhớ toàn bộ workshop › Nhưng bức tranh lớn còn thiếu", lines: "2059-2155"}
  applies_to: [intelligence/context, execution/workflows, core/contracts]
  phase: MVP
  verification: {kind: test, ref: "kiểm: không có đường đọc state từ memory/hội thoại; state đến từ workflow_instances"}
  note: null
- id: REQ-MEM-002
  area: MEM
  statement: "Memory hội thoại (V1): tin nhắn cũ → tóm tắt/trích xuất → kho memory → truy xuất khi liên quan → context; mỗi mục có thời điểm, nguồn hội thoại, thuộc đúng một tenant và principal; tóm tắt không được thêm fact mới; fact trong memory không thay thế nguồn sự thật."
  rationale: "Memory là thành phần còn thiếu của sơ đồ vệ tinh."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "13. MEMORY / STATE — component còn thiếu nữa", lines: "4009-4024"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "20. Và đây là connection quan trọng nhất giữa hai video › 1. Bức tranh nên nâng cấp thành thế này", lines: "3284-3344"}
  applies_to: [intelligence/context, db/migrations]
  phase: V1
  verification: {kind: test, ref: "test: memory không lộ giữa principal/tenant; tóm tắt có span nguồn; fact trong memory không ghi vào facts"}
  note: null
- id: REQ-MEM-003
  area: MEM
  statement: "Memory có hạn dùng và cờ stale; mục stale bị loại khỏi context và mỗi lần dùng memory được ghi trace; 'memory stale' là một nhánh của cây gỡ lỗi."
  rationale: "Stale memory là một nguyên nhân sai thường bị bỏ sót."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "23. Và khi system trả lời sai, đừng lập tức blame Model", lines: "4423-4464"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "ROADMAP 16 — OBSERVABILITY", lines: "5638-5688"}
  applies_to: [intelligence/context, observability/traces]
  phase: V1
  verification: {kind: test, ref: "fixture memory quá hạn → bị loại; trace ghi memory nào được dùng"}
  note: null
- id: REQ-WFL-001
  area: WFL
  statement: "P11: model được đề xuất chuyển trạng thái nhưng workflow engine sở hữu trạng thái: model chỉ đọc, phân loại, trích xuất, đề xuất, giải thích; phần mềm sở hữu trạng thái, phép chuyển, quyền, bất biến, giao dịch; 'nên chuyển sang APPROVED' của model chỉ là đề xuất, engine thực hiện sau khi guard qua; không có mã nào ngoài execution/workflows được ghi workflow_instances hay workflow_transitions."
  rationale: "AI không được quyết định trạng thái tùy ý."
  sources:
    - {file: brief-05-architecture-review.md, section: "Thiếu tiếp: Workflow/State Machine cần trở thành first-class", lines: "270-327"}
  applies_to: [execution/workflows, intelligence/models, db/migrations]
  phase: MVP
  verification: {kind: test, ref: "kiểm tĩnh quyền ghi bảng workflow chỉ thuộc package workflows; test: đề xuất của model giả không đổi state khi guard fail"}
  note: null
- id: REQ-WFL-002
  area: WFL
  statement: "Workflow/state machine là khái niệm hạng nhất trong mô hình kiến trúc ngay từ đầu: mọi thứ có vòng đời (phiếu đề nghị vật tư, sự cố bảo dưỡng, phiếu nghiệm thu, sửa dữ liệu trận đấu) là một state machine khai báo trong pack và chạy bằng một engine dùng chung; MVP cài engine tối giản (đồng bộ, lưu PostgreSQL, timer quét định kỳ). Mental model mở rộng từ 'Question → Answer' sang 'Query + Command + Event + Workflow → controlled business outcome'."
  rationale: "Doanh nghiệp không chỉ hỏi–đáp; điểm yếu nhất của kiến trúc ban đầu là workflow/state, event, command, tiến trình dài, human-in-the-loop, giao dịch."
  sources:
    - {file: brief-05-architecture-review.md, section: "Nhưng tôi thấy một vấn đề lớn tiếp theo", lines: "102-204"}
    - {file: brief-05-architecture-review.md, section: "Thiếu tiếp: Workflow/State Machine cần trở thành first-class", lines: "270-327"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này", lines: "546-575"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này › V3 tôi sẽ ép Construction phá architecture này", lines: "653"}
  applies_to: [execution/workflows, core/pipeline, docs]
  phase: MVP
  verification: {kind: test, ref: "test engine tối giản: định nghĩa state machine từ pack, chuyển hợp lệ/không hợp lệ, lưu bền, timer quét"}
  note: null
- id: REQ-WFL-003
  area: WFL
  statement: "Engine workflow ngoài, hàng đợi và cache (ví dụ các hệ điều phối quy trình, Kafka, Redis, Temporal) chỉ được thêm khi số đo chứng minh engine nội bộ đồng bộ hoặc đường lưu trữ hiện tại không đạt; không code chúng ngay vì kiến trúc nêu khái niệm workflow."
  rationale: "Giữ cổng độ phức tạp: khái niệm có ngay, triển khai ngoài khi bằng chứng đòi."
  sources:
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này", lines: "546-575"}
    - {file: brief-05-architecture-review.md, section: "Một điểm tôi rất thích: capability gates", lines: "512-545"}
    - {file: brief-05-architecture-review.md, section: "Thiếu tiếp: Workflow/State Machine cần trở thành first-class", lines: "270-327"}
  applies_to: [execution/workflows, platform/store, deploy]
  phase: GATED
  verification: {kind: eval, ref: "cổng mở khi đo được độ trễ/tải/độ bền của engine nội bộ vượt ngưỡng; ADR kèm số đo (ADR-0004)"}
  note: "Điều kiện mở cổng: số đo tải/độ trễ/độ bền cho thấy engine đồng bộ trên PostgreSQL không đạt; mở bằng ADR (ADR-0004), kèm test âm chứng minh cổng."
- id: REQ-WFL-004
  area: WFL
  statement: "State machine trong pack khai: trạng thái, phép chuyển, guard (theo TÊN), human task, hạn chót; ví dụ phiếu đề nghị vật tư DRAFT → SUBMITTED → REVIEWING → APPROVED → ORDERED → RECEIVED → RECONCILED → CLOSED (có nhánh REJECTED); phép chuyển không khai báo bị từ chối; lịch sử chuyển được lưu."
  rationale: "Ví dụ chuẩn của vòng đời nghiệp vụ."
  sources:
    - {file: brief-05-architecture-review.md, section: "Thiếu tiếp: Workflow/State Machine cần trở thành first-class", lines: "270-327"}
  applies_to: [execution/workflows, tenants/construction]
  phase: MVP
  verification: {kind: test, ref: "test: chuỗi hợp lệ qua đủ trạng thái; phép chuyển lạ bị từ chối; lịch sử workflow_transitions đủ"}
  note: null
- id: REQ-WFL-005
  area: WFL
  statement: "Mỗi phép chuyển có guard (quyền của principal + bất biến nghiệp vụ); guard là tên do pack chọn từ danh mục mã đã cài, không phải biểu thức trong YAML; tên guard lạ → pack không hợp lệ; guard fail → từ chối và ghi audit."
  rationale: "P12 áp cho workflow: pack chọn tên, mã cài hành vi."
  sources:
    - {file: brief-05-architecture-review.md, section: "Thiếu tiếp: Workflow/State Machine cần trở thành first-class", lines: "270-327"}
    - {file: brief-05-architecture-review.md, section: "Pack hiện tại rất tốt nhưng đang có nguy cơ trở thành “God Config”", lines: "399-457"}
  applies_to: [execution/workflows, core/tenant, governance/permissions]
  phase: MVP
  verification: {kind: test, ref: "test: guard tên lạ → pack lỗi; guard fail → transition không xảy ra và audit ghi"}
  note: null
- id: REQ-WFL-006
  area: WFL
  statement: "Chuyển trạng thái, ghi lịch sử và audit diễn ra trong MỘT giao dịch cơ sở dữ liệu; lỗi giữa chừng không để trạng thái nửa vời; tác dụng phụ ngoài (tool) chạy sau khi giao dịch trạng thái thành công và idempotent."
  rationale: "Software owns transaction."
  sources:
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song", lines: "205-269"}
    - {file: brief-05-architecture-review.md, section: "Thiếu tiếp: Workflow/State Machine cần trở thành first-class", lines: "270-327"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này", lines: "546-575"}
  applies_to: [execution/workflows, platform/store]
  phase: MVP
  verification: {kind: test, ref: "failure injection giữa giao dịch: state không đổi và không có audit lẻ; tool ngoài chỉ chạy sau commit"}
  note: null
- id: REQ-WFL-007
  area: WFL
  statement: "Bước chờ người (duyệt, kiểm tra hiện trường, xác nhận) là human task có người nhận và hạn chót; quá hạn kích hoạt thông báo/leo thang theo pack; có API/hàng đợi cho người nhận xem, nhận, hoàn thành việc với kiểm quyền; hoàn thành task đẩy workflow qua engine."
  rationale: "Human-in-the-loop và tiến trình chờ là điểm yếu được chấm thấp của kiến trúc ban đầu."
  sources:
    - {file: brief-05-architecture-review.md, section: "Nhưng tôi thấy một vấn đề lớn tiếp theo", lines: "131-164"}
    - {file: brief-05-architecture-review.md, section: "Thiếu tiếp: Workflow/State Machine cần trở thành first-class", lines: "270-327"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này", lines: "546-575"}
    - {file: brief-01-case-study-construction.md, section: "Case 10 — Skill", lines: "525-562"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "ROADMAP 14 — RELIABILITY", lines: "5541-5594"}
  applies_to: [execution/workflows, platform/httpapi]
  phase: MVP
  verification: {kind: test, ref: "test: tạo human task có hạn; quá hạn → thông báo/leo thang; người không có quyền không hoàn thành được"}
  note: null
- id: REQ-WFL-008
  area: WFL
  statement: "Lệnh (command) có idempotency key: gửi lại cùng key trả kết quả cũ và không thực thi lần hai; bảng commands lưu key, tham số, kết quả và trạng thái; key khác nhau nhưng cùng nội dung vẫn được coi là hai lệnh."
  rationale: "Lệnh làm đổi trạng thái nên phải an toàn khi gửi lại."
  sources:
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song › COMMAND", lines: "243-254"}
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song", lines: "205-269"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "ROADMAP 14 — RELIABILITY", lines: "5541-5594"}
  applies_to: [core/pipeline, execution/workflows, db/migrations]
  phase: MVP
  verification: {kind: test, ref: "test: gửi hai lần cùng key → một lần thực thi, kết quả giống; tác dụng phụ đếm = 1"}
  note: null
- id: REQ-WFL-009
  area: WFL
  statement: "Pipeline lệnh gồm tám chặng C0–C7: C0 chấp nhận (xác thực, idempotency key) → C1 tenant → C2 hiểu lệnh (chuẩn hoá + nhận dạng thực thể; model chỉ trích tham số khi cổng mở) → C3 kiểm schema tham số → C4 quyền (RBAC/ABAC) → C5 workflow engine (guard + chuyển trạng thái trong một giao dịch) → C6 tool có tác dụng phụ (idempotent, timeout, kết quả được kiểm) → C7 audit + thông báo + trả trạng thái mới."
  rationale: "Ví dụ 'Tạo phiếu kiểm tra máy EX-03' là lệnh: quyền → kiểm → tool → đổi trạng thái → audit."
  sources:
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song", lines: "205-269"}
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song › COMMAND", lines: "243-254"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này › V3 tôi sẽ ép Construction phá architecture này", lines: "596-621"}
  applies_to: [core/pipeline, execution/workflows, execution/tools]
  phase: MVP
  verification: {kind: test, ref: "test từng chặng C0–C7 với lệnh mẫu; mỗi chặng có lỗi chèn và nhãn fault"}
  note: null
- id: REQ-WFL-010
  area: WFL
  statement: "Lệnh thiếu tham số bắt buộc trả về câu hỏi lại, không đoán; lệnh có tác dụng phụ lớn (theo pack) tạo human task chờ duyệt thay vì thực thi ngay; kết quả trích tham số bằng model (khi cổng mở) vẫn phải qua kiểm schema."
  rationale: "Mơ hồ thì hỏi lại; hành động lớn cần người duyệt."
  sources:
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song › COMMAND", lines: "243-254"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "8. Và Tool cần được audit production riêng", lines: "3737-3772"}
  applies_to: [core/pipeline, reliability/clarification, execution/workflows]
  phase: MVP
  verification: {kind: test, ref: "ca lệnh thiếu tham số → CLARIFICATION; ca tác dụng phụ lớn → human task; không thực thi trước khi duyệt"}
  note: null
- id: REQ-WFL-011
  area: WFL
  statement: "Pipeline sự kiện gồm bảy chặng E0–E6: E0 nhận sự kiện (tin nhắn, bản ghi, cảm biến, provider) → E1 chuẩn hoá + nhận dạng thực thể → E2 ghi quan sát có nguồn → E3 luật kích hoạt của pack (so sánh khai báo: metric op ngưỡng, trạng thái = X) → E4 khởi động/đẩy workflow qua engine → E5 hành động (tạo sự cố, gán người, thông báo) → E6 audit."
  rationale: "Sự kiện như 'nhiệt độ EX-03 vượt ngưỡng' khởi động quy trình mà model có thể không xuất hiện."
  sources:
    - {file: brief-05-architecture-review.md, section: "Nhưng tôi thấy một vấn đề lớn tiếp theo", lines: "102-204"}
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song › EVENT", lines: "255-269"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này › V3 tôi sẽ ép Construction phá architecture này", lines: "596-621"}
  applies_to: [core/pipeline, execution/triggers, execution/workflows]
  phase: MVP
  verification: {kind: test, ref: "test từng chặng E0–E6 với sự kiện mẫu; pipeline chạy khi ModelGateway vô hiệu"}
  note: null
- id: REQ-WFL-012
  area: WFL
  statement: "Luật kích hoạt (triggers.yaml) chỉ gồm so sánh khai báo một bước (metric op ngưỡng, trạng thái = X) dẫn tới lệnh hoặc khởi động workflow; logic phức tạp hơn là domain module có hợp đồng và test, không mở rộng YAML."
  rationale: "P12 áp cho trigger."
  sources:
    - {file: brief-05-architecture-review.md, section: "Pack hiện tại rất tốt nhưng đang có nguy cơ trở thành “God Config”", lines: "399-457"}
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song › EVENT", lines: "255-269"}
  applies_to: [execution/triggers, core/tenant]
  phase: MVP
  verification: {kind: test, ref: "linter triggers.yaml: cấm điều kiện lồng/biểu thức tự do; ví dụ vi phạm bị từ chối"}
  note: null
- id: REQ-WFL-013
  area: WFL
  statement: "Mỗi sự kiện được xử lý đúng một lần theo khoá khử trùng; sự kiện đến lại bị bỏ qua và ghi nhận (không khởi động lại workflow); sự kiện trùng không tạo thêm sự cố hay thông báo."
  rationale: "Duplicate events là bài toán chung của event-driven."
  sources:
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song › EVENT", lines: "255-269"}
    - {file: brief-02-v2-two-tenants.md, section: "PART XVII — SPORTS EVENT MODEL", lines: "983-998"}
  applies_to: [core/pipeline, execution/triggers, db/migrations]
  phase: MVP
  verification: {kind: test, ref: "test: cùng sự kiện hai lần → một lần xử lý, lần hai được ghi nhận bỏ qua"}
  note: null
- id: REQ-WFL-014
  area: WFL
  statement: "EAIS có ba lối vào cùng đổ về capability plane và workflow engine: QUERY (câu trả lời có nguồn) đi pipeline hỏi S0–S10, COMMAND (đổi trạng thái đúng quy trình, có audit) đi pipeline lệnh C0–C7, EVENT (khởi động hoặc đẩy tiếp quy trình) đi pipeline sự kiện E0–E6; mỗi ca kiểm thử khai entry_type (QUERY, COMMAND, EVENT, WORKFLOW, RECONCILIATION, SECURITY); API tương ứng gồm /v1/ask, /v1/commands, /v1/events, /v1/workflows, /v1/tasks."
  rationale: "Từ nền tảng hỏi–đáp doanh nghiệp thành nền tảng hệ thống AI doanh nghiệp."
  sources:
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song", lines: "205-269"}
    - {file: brief-05-architecture-review.md, section: "Nhưng tôi thấy một vấn đề lớn tiếp theo", lines: "102-204"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này › V3 tôi sẽ ép Construction phá architecture này", lines: "576-653"}
  applies_to: [core/pipeline, platform/httpapi, evals]
  phase: MVP
  verification: {kind: test, ref: "test định tuyến: mỗi loại request đi đúng pipeline; ca kiểm thử không có entry_type bị từ chối"}
  note: null
- id: REQ-WFL-015
  area: WFL
  statement: "Bảng ba lối vào: QUERY — kết quả mong muốn câu trả lời có nguồn, router + nguồn sự thật quyết, model có mặt khi cần diễn đạt tri thức tài liệu; COMMAND — trạng thái đổi đúng quy trình có audit, workflow engine (quyền + bất biến) quyết, model chỉ trích tham số từ câu tự do và kết quả vẫn qua kiểm schema; EVENT — quy trình được khởi động/đẩy tiếp, luật kích hoạt + workflow engine quyết, model hầu như không có mặt (chỉ giải thích bất thường cho người)."
  rationale: "Khác biệt lớn nhất của kiến trúc mở rộng: nhiều giá trị nằm ở lệnh và sự kiện, nơi model có thể không xuất hiện."
  sources:
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song", lines: "205-269"}
    - {file: brief-05-architecture-review.md, section: "Nhưng tôi thấy một vấn đề lớn tiếp theo", lines: "130-203"}
  applies_to: [core/pipeline, intelligence/models]
  phase: MVP
  verification: {kind: test, ref: "test: pipeline EVENT chạy với ModelGateway vô hiệu; COMMAND chỉ gọi model ở C2 khi cổng mở"}
  note: null
- id: REQ-WFL-016
  area: WFL
  statement: "Quy trình sự cố bảo dưỡng của construction: sự kiện 'máy xúc EX-03 báo nhiệt độ bất thường' → phát hiện bất thường → tra thiết bị → luật → tạo sự cố bảo dưỡng → báo giám sát viên → giao kỹ thuật viên → chờ → nhận kết quả kiểm tra → cập nhật trạng thái máy → đóng sự cố; không có bước sinh văn bản nào bắt buộc."
  rationale: "Ca EVENT mẫu của brief 05: nhiều bước, không phải câu hỏi."
  sources:
    - {file: brief-05-architecture-review.md, section: "Nhưng tôi thấy một vấn đề lớn tiếp theo", lines: "131-164"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này › V3 tôi sẽ ép Construction phá architecture này", lines: "596-621"}
  applies_to: [tenants/construction, execution/workflows, execution/triggers]
  phase: MVP
  verification: {kind: test, ref: "kịch bản CON-T entry_type=EVENT: kiểm chuỗi chuyển trạng thái, human task và audit; không gọi model"}
  note: null
- id: REQ-WFL-017
  area: WFL
  statement: "Quy trình mua vật tư của construction: tồn kho thép dưới mức an toàn → kiểm PO hiện có → tính nhu cầu → chọn nhà cung cấp → duyệt (trưởng dự án rồi kế toán) → tạo PO → chờ phản hồi bên ngoài → cập nhật trạng thái; nhiều bước chờ người và chờ hệ thống ngoài."
  rationale: "Ca WORKFLOW mẫu của brief 05."
  sources:
    - {file: brief-05-architecture-review.md, section: "Nhưng tôi thấy một vấn đề lớn tiếp theo", lines: "165-186"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này › V3 tôi sẽ ép Construction phá architecture này", lines: "596-621"}
  applies_to: [tenants/construction, execution/workflows]
  phase: V1
  verification: {kind: test, ref: "kịch bản CON-T entry_type=WORKFLOW: duyệt hai cấp, chờ phản hồi ngoài, timeout, audit"}
  note: null
- id: REQ-WFL-018
  area: WFL
  statement: "Tiến trình dài (workflow nhiều ngày) phải sống sót qua khởi động lại: trạng thái và timer lưu bền; engine nạp lại instance đang chạy khi khởi động; hạn chót human task không mất khi dịch vụ restart."
  rationale: "Long-running processes được chấm thấp nhất của kiến trúc ban đầu."
  sources:
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này", lines: "546-575"}
  applies_to: [execution/workflows, platform/store]
  phase: V1
  verification: {kind: test, ref: "test: khởi động lại giữa chừng → workflow tiếp tục; human task quá hạn vẫn bị phát hiện"}
  note: null
- id: REQ-WFL-019
  area: WFL
  statement: "Nhất quán giao dịch doanh nghiệp: mỗi phép chuyển kèm tác dụng phụ có chiến lược rõ (trạng thái trong giao dịch DB; tác dụng phụ ngoài idempotent và thử lại an toàn; kết quả được kiểm; lỗi → trạng thái an toàn và audit); không có 'trạng thái ma' khi bên ngoài lỗi."
  rationale: "Enterprise transactions là một điểm yếu được chấm thấp."
  sources:
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này", lines: "546-575"}
    - {file: brief-05-architecture-review.md, section: "Tôi sẽ thêm một execution architecture song song", lines: "205-269"}
  applies_to: [execution/workflows, execution/tools]
  phase: V1
  verification: {kind: test, ref: "failure injection tool ngoài sau commit: không có trạng thái ma; thử lại idempotent; audit đủ"}
  note: null
- id: REQ-PCK-001
  area: PCK
  statement: "Pack là nơi duy nhất chứa khác biệt giữa tenant: pack.yaml, lexicon.yaml, entities.yaml, metrics.yaml, intents.yaml, tools.yaml, skills.yaml, workflows.yaml, triggers.yaml, templates.yaml, validation.yaml; pack tương ứng các thành phần của tenant runtime (dữ liệu, ontology, schema, rules, skills, tools, corpus, quyền, eval); Construction Pack và Sports Pack cung cấp implementation/cấu hình cho cùng một bộ abstraction (Normalizer, EntityResolver, SourceAuthority, Router, ContextSource, Retriever, Tool, Skill, Validator, Policy, Evaluator)."
  rationale: "Core biết abstraction, tenant cung cấp implementation/cấu hình."
  sources:
    - {file: brief-03-eais-naming.md, section: "EAIS — Enterprise AI Systems", lines: "36-52"}
    - {file: brief-04-rag-to-eais-expansion.md, section: "8. Construction tenant cũng không được chui vào Core", lines: "673-743"}
    - {file: brief-02-v2-two-tenants.md, section: "CORE HYPOTHESIS TO TEST", lines: "97-134"}
  applies_to: [core/tenant, tenants/construction, tenants/sports]
  phase: MVP
  verification: {kind: test, ref: "bộ nạp pack kiểm đủ các tệp của cả hai tenant; thiếu tệp bắt buộc → từ chối"}
  note: null
- id: REQ-PCK-002
  area: PCK
  statement: "P12: pack mô tả chính sách và cấu hình, mã cài hành vi; YAML không có điều kiện lồng (if/when/unless/foreach), vòng lặp hay biểu thức tự do (evaluate); khi nhu cầu vượt mức đó thì viết domain module/plugin có hợp đồng và test, không mở rộng YAML thành ngôn ngữ lập trình."
  rationale: "Pack có nguy cơ thành 'God Config' — một ngôn ngữ lập trình bằng YAML."
  sources:
    - {file: brief-05-architecture-review.md, section: "Pack hiện tại rất tốt nhưng đang có nguy cơ trở thành “God Config”", lines: "399-457"}
  applies_to: [core/tenant, domain/sportsevents]
  phase: MVP
  verification: {kind: test, ref: "linter pack: cấm khoá if/when/unless/foreach/evaluate/expr và độ sâu lồng quá giới hạn; ví dụ vi phạm bị từ chối"}
  note: null
- id: REQ-PCK-003
  area: PCK
  statement: "Giới hạn của pack: ĐƯỢC danh sách, bảng tra, ngưỡng, đơn vị, bí danh, mẫu câu; so sánh một bước (metric op value, state == X); chọn guard/validator/tool theo tên từ danh mục mã; KHÔNG được if/when/unless/foreach lồng nhau, biểu thức tự do, gọi hàm tuỳ ý, định nghĩa hành vi mới trong YAML."
  rationale: "Bảng được/không được làm cụ thể hoá P12."
  sources:
    - {file: brief-05-architecture-review.md, section: "Pack hiện tại rất tốt nhưng đang có nguy cơ trở thành “God Config”", lines: "399-457"}
  applies_to: [core/tenant]
  phase: MVP
  verification: {kind: test, ref: "bộ ca âm/dương cho từng ô của bảng được/không được"}
  note: null
- id: REQ-PCK-004
  area: PCK
  statement: "Core kiểm toàn bộ pack lúc khởi động (cấu hình hỏng thì không chạy) và đóng dấu pack_version (băm nội dung) vào mọi lượt; thay đổi pack đổi pack_version."
  rationale: "Tenant cung cấp cấu hình; core chịu trách nhiệm kiểm và truy vết."
  sources:
    - {file: brief-04-rag-to-eais-expansion.md, section: "8. Construction tenant cũng không được chui vào Core", lines: "673-743"}
    - {file: brief-05-architecture-review.md, section: "Pack hiện tại rất tốt nhưng đang có nguy cơ trở thành “God Config”", lines: "399-457"}
  applies_to: [core/tenant, observability/traces]
  phase: MVP
  verification: {kind: test, ref: "test: pack hỏng → tiến trình thoát mã khác 0; mỗi lượt có pack_version; đổi nội dung → đổi băm"}
  note: null
- id: REQ-PCK-005
  area: PCK
  statement: "Cỡ pack thực tế (hàng trăm thuật ngữ, hàng trăm chỉ số, hàng trăm loại thực thể và intent, hàng chục tool và workflow, hàng trăm luật validation) vẫn nạp và kiểm được trong thời gian đo; pack tách theo tệp/loại; khi một vùng pack bắt đầu mô phỏng logic thủ tục thì ra ADR chuyển sang domain module."
  rationale: "Quy mô làm lộ nguy cơ God Config."
  sources:
    - {file: brief-05-architecture-review.md, section: "Pack hiện tại rất tốt nhưng đang có nguy cơ trở thành “God Config”", lines: "399-457"}
  applies_to: [core/tenant, evals]
  phase: V1
  verification: {kind: eval, ref: "benchmark nạp pack giả cỡ 500 thuật ngữ/200 chỉ số/100 loại thực thể/150 intent/80 tool/50 workflow: thời gian nạp và kiểm (chưa đo)"}
  note: null
- id: REQ-PCK-006
  area: PCK
  statement: "Guard, validator và tool được pack tham chiếu theo TÊN trong danh mục mã đã cài; tên không có trong danh mục làm pack không hợp lệ."
  rationale: "Khi nhu cầu vượt cột 'được', viết mã thay vì mở rộng YAML."
  sources:
    - {file: brief-05-architecture-review.md, section: "Pack hiện tại rất tốt nhưng đang có nguy cơ trở thành “God Config”", lines: "399-457"}
    - {file: brief-05-architecture-review.md, section: "Thiếu tiếp: Workflow/State Machine cần trở thành first-class", lines: "270-327"}
  applies_to: [core/tenant, execution/workflows, reliability/validation]
  phase: MVP
  verification: {kind: test, ref: "test: tham chiếu tên lạ → pack lỗi; tên hợp lệ → liên kết đúng mã"}
  note: null
- id: REQ-PCK-007
  area: PCK
  statement: "Mỗi intent khai mức nghiêm trọng của đầu ra (thường hoặc critical): intent critical bắt buộc gắn validator và (nếu có tác dụng phụ) human approval; pack có intent critical không validator bị từ chối; cùng một capability AI nhưng khác mức critical thì yêu cầu kỹ thuật khác hoàn toàn."
  rationale: "Same AI capability + different criticality = completely different engineering requirement."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "5. PHASE 2 --- DEMO AI VÀ ENTERPRISE AI LÀ HAI BÀI TOÁN KHÁC NHAU", lines: "381-439"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "ROADMAP 14 — RELIABILITY", lines: "5541-5594"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "[Transcript thô] \"data raww video\" — dòng 2-4 (nguồn của các ý [VIDEO])", lines: "4"}
  applies_to: [core/tenant, reliability/validation]
  phase: MVP
  verification: {kind: test, ref: "test âm pack: intent critical thiếu validator → từ chối; có validator → nạp được"}
  note: null
- id: REQ-PCK-008
  area: PCK
  statement: "Pack khai đủ bốn nhóm chính sách cốt lõi: intents.yaml (từ khoá/mẫu, khe bắt buộc, route, ngưỡng), metrics.yaml (chỉ số có kiểu, đơn vị chuẩn, miền giá trị, ma trận thẩm quyền), templates.yaml (mẫu trả lời/hỏi lại/từ chối/lùi do tenant viết), validation.yaml (validator bật/tắt và hành động khi vi phạm); thiếu mẫu cho route không gọi model thì pack không hợp lệ."
  rationale: "Route không cần model trả lời bằng mẫu của tenant; ứng dụng không tự sáng tác chữ cho khách."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART IX — ROUTER", lines: "622-658"}
    - {file: brief-02-v2-two-tenants.md, section: "PART VI — SOURCE OF TRUTH", lines: "491-528"}
    - {file: brief-06-model-vs-enterprise-system.md, section: "3. “Enterprise” nằm rất nhiều ở phần trước và sau model", lines: "113-194"}
    - {file: brief-02-v2-two-tenants.md, section: "PART XXII — MULTI-TENANCY", lines: "1153-1198"}
  applies_to: [core/tenant, intelligence/router, reliability/validation]
  phase: MVP
  verification: {kind: test, ref: "bộ kiểm pack: thiếu mẫu cho route không gọi model → từ chối; ngưỡng intent và hành động validation được nạp"}
  note: null
- id: REQ-VAL-001
  area: VAL
  statement: "Model không bao giờ là nguồn của một con số: mọi số, mã và ngày trong câu trả lời phải khớp (sau chuẩn hoá) một giá trị trong gói bằng chứng hoặc là kết quả CALCULATION có ghi phép tính; ví dụ câu 'Khoảng 38.000 lít' do model đoán bị chặn, câu '38.427 L' phải là kết quả SUM từ nguồn tất định kèm khoảng thời gian và nguồn."
  rationale: "Anti-pattern 4: critical number do LLM đoán rồi vào báo cáo kinh doanh."
  sources:
    - {file: brief-05-architecture-review.md, section: "S0 → S10 là phần mạnh nhất", lines: "82-100"}
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "16. PHASE 13 --- PROBLEM #3: HALLUCINATION › Mitigation map", lines: "1034-1048"}
    - {file: brief-01-case-study-construction.md, section: "Case 02 — Giám đốc hỏi số liệu chính xác", lines: "182-221"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "9. Non-determinism", lines: "1143-1183"}
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "39. ANTI-PATTERNS MÀ VIDEO CẢNH BÁO › Anti-pattern 4", lines: "2212-2221"}
  applies_to: [reliability/validation, core/pipeline]
  phase: MVP
  verification: {kind: eval, ref: "validator catch rate trên bộ bơm lỗi số/mã/ngày vào Draft và false block rate trên ca đúng (chưa đo)"}
  note: null
- id: REQ-VAL-002
  area: VAL
  statement: "Kiểm thất bại thì không giao câu đó: S9 fail đi đường lùi do pack quy định (fallback bằng mẫu 'chưa đủ dữ liệu chính xác', clarify, hoặc escalate) và không bao giờ trả đầu ra như thành công; mọi vi phạm ghi vào Verdict và trace."
  rationale: "Luật cứng thứ ba của luồng hỏi."
  sources:
    - {file: brief-05-architecture-review.md, section: "S0 → S10 là phần mạnh nhất", lines: "82-100"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "ROADMAP 14 — RELIABILITY", lines: "5541-5594"}
  applies_to: [reliability/validation, core/pipeline, reliability/clarification]
  phase: MVP
  verification: {kind: test, ref: "test: Draft sai bị chặn, phản hồi dùng mẫu lùi, Verdict ghi vi phạm"}
  note: null
- id: REQ-VAL-003
  area: VAL
  statement: "Kiểm đầu ra theo sáu lớp: cú pháp (JSON hợp lệ) → schema → ngữ nghĩa → luật nghiệp vụ → chéo trường → lịch sử; hợp lệ về cú pháp không có nghĩa hợp lệ nghiệp vụ; MVP có năm lớp đầu, lớp lịch sử ở REQ riêng."
  rationale: "{\"fuel_liters\": 400000000} hợp lệ JSON nhưng vô lý nghiệp vụ."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "PART VII — STRUCTURED EXTRACTION › 08. Natural Language → Typed Data", lines: "6332-6373"}
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "13. PHASE 10 --- VÍ DỤ CẦU ĐƯỜNG VÀ \"4K LÍT DẦU\" › Pipeline nên nghĩ tới", lines: "887-925"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "8. Ví dụ 4k lít dầu — bài học về deterministic boundary", lines: "1094-1141"}
  applies_to: [reliability/validation, core/tenant]
  phase: MVP
  verification: {kind: test, ref: "bộ ca: JSON hợp lệ nhưng 400.000.000 L bị bắt ở lớp miền giá trị; từng lớp có ca dương/âm"}
  note: null
- id: REQ-VAL-004
  area: VAL
  statement: "Luật nghiệp vụ và miền giá trị khai trong pack (metrics.yaml, validation.yaml): miền giá trị theo chỉ số (số lít hợp lý, giờ máy tối đa trong ngày), ràng buộc chéo trường (tổng các phần bằng tổng, nhiên liệu tương xứng giờ máy), đơn vị hợp lệ, trường bắt buộc; vi phạm → đường lùi (hỏi lại hoặc duyệt người), không tự sửa số."
  rationale: "Rules engine, schema validator và range check là code tất định, không phải AI."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "PART VII — STRUCTURED EXTRACTION › 08. Natural Language → Typed Data", lines: "6332-6373"}
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "13. PHASE 10 --- VÍ DỤ CẦU ĐƯỜNG VÀ \"4K LÍT DẦU\" › Pipeline nên nghĩ tới", lines: "887-925"}
    - {file: brief-01-case-study-construction.md, section: "Case 10 — Skill", lines: "525-562"}
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "33. NHỮNG PHẦN HOÀN TOÀN KHÔNG PHẢI AI NHƯNG CỰC KỲ QUAN TRỌNG", lines: "1881-1916"}
  applies_to: [reliability/validation, core/tenant, tenants/construction]
  phase: MVP
  verification: {kind: test, ref: "ca miền giá trị, chéo trường, thiếu trường bắt buộc, đơn vị sai → đúng đường lùi và nhãn"}
  note: null
- id: REQ-VAL-005
  area: VAL
  statement: "Kiểm lịch sử và bất thường (V1): so với ngày trước/định mức/phân phối quá khứ để phát hiện số liệu bất thường (ví dụ mức dùng nhiên liệu vượt định mức, nhảy vọt so với hôm qua); kết quả là cờ và fact dẫn xuất kèm công thức, đưa người xem xét chứ không tự sửa."
  rationale: "Historical validation và anomaly detection là lớp kiểm cuối."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "PART VIII — BUSINESS VALIDATION › 09. Syntactically valid ≠ Business valid", lines: "6349-6373"}
    - {file: brief-01-case-study-construction.md, section: "Case 10 — Skill", lines: "525-562"}
    - {file: brief-01-case-study-construction.md, section: "Case 04 — Một câu hỏi cần cả SQL + RAG", lines: "256-292"}
