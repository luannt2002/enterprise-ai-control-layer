  area: EVL
  statement: "Kiến trúc được chấm lại theo rubric mười bốn trục (tám trục mạnh: mindset, ranh giới model/system, ranh giới RAG, trừu tượng tenant, kiến trúc dữ liệu, router/điều khiển, kiến trúc bằng chứng, triết lý đánh giá; sáu trục yếu: workflow/state, vận hành theo sự kiện, luồng lệnh/hành động, tiến trình dài, human-in-the-loop, giao dịch doanh nghiệp) sau mỗi vòng chạy bộ ca; điểm ban đầu 5/4/5/3/5/4 của sáu trục yếu là ý kiến một người đánh giá, chưa đo."
  rationale: "Rubric giúp biết trục nào kiến trúc còn yếu, không phải điểm chất lượng mã."
