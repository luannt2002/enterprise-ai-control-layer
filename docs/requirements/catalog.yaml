  statement: "Ổn định thông tin khi lặp: câu hỏi số liệu chạy lặp tối thiểu 100 lần phải cho cùng (giá trị, đơn vị, thực thể, kỳ, nguồn); chỉ cho phép khác nhau ở cách diễn đạt nếu có sinh câu; 'hỏi 100 lần ra 100 con số khác nhau' là thất bại."
