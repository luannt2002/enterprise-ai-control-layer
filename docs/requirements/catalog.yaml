- id: REQ-CTX-014
  area: CTX
  statement: "ContextPackage gồm cả chỉ dẫn hệ thống/mẫu, câu hỏi, lịch sử được phép, bằng chứng, định nghĩa/kết quả tool, trạng thái workflow và ví dụ few-shot (context engineering rộng hơn prompt engineering: 'model cần thấy gì NGAY LÚC NÀY để quyết định'); gói được băm (context hash) và ghi vào trace để tái hiện mọi lượt."
  rationale: "Prompt chỉ là một phần của context."
  sources:
