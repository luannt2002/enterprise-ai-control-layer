  area: RTE
  statement: "Sports: bảy loại câu hỏi có route mong đợi: 'tỉ số?' → SQL_QUERY (dữ liệu realtime tất định); 'ai ghi bàn?' → SQL_QUERY (sự kiện có cấu trúc); 'H2H' → SQL_QUERY; 'tóm tắt trận' → HYBRID_RETRIEVAL (model trên fact có cấu trúc); 'vì sao đội A phong độ kém?' → HYBRID_RETRIEVAL (phân tích/ngữ nghĩa, số lấy từ thống kê); 'giải thích phong độ gần đây' → thống kê + model; 'tìm các trận lịch sử tương tự' → truy xuất/phân tích; không dùng model để bịa fact trực tiếp."
