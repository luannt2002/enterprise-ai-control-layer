- id: REQ-OBS-010
  area: OBS
  statement: "Quan sát realtime cho tenant sports: độ trễ từ provider tới API, độ cũ của projection, tỉ lệ sự kiện muộn/sửa/trùng, lag của hàng đợi (nếu có), tỉ lệ cache hit; cảnh báo theo ngưỡng đặt sau lần đo đầu."
