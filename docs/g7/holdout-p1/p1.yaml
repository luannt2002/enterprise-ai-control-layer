# Bộ ca GIỮ LẠI độc lập cho hợp đồng Phase 1 (khối M4 của MVP: lệnh open_discrepancy_ticket).
# Khuôn: HOP-DONG §12.1 + CONVENTIONS §5 — mỗi ca đúng 23 khoá, entry_type COMMAND, expected_route TOOL.
# Thế giới: world-p1.yaml (cùng thư mục) = world.yaml gốc + phần thêm [P1+]; mọi máy, ngày, người gọi
# trong ca đều lấy từ tệp đó. Kỳ vọng suy từ world-p1.yaml + luật của hợp đồng (không đọc mã, không đọc pack).
# `scenario` = mã lớp ca ở §10. Lớp không khai được bằng khuôn §12.1 không có ở đây (xem báo cáo của người soạn).
# Lượt sửa 1 (sau soát độc lập; xem mục "Đã xử lý" cuối soat-ca.md): sửa ca theo cờ S2, S3 và vài ghi chú S4; ca mới đánh tiếp từ
# CON-T-855, không dùng lại id nào; không ca nào bị bỏ. Ca thêm nằm cuối tệp.
suite: lenh
cases:
  - id: CON-T-701
    tenant: abc-infra
    domain: fuel
    business_process: fuel-discrepancy-ticket
    scenario: A01
    entry_type: COMMAND
    category: happy_path
    input:
      - {id: send, principal: {id: u-director, role: director}, command_id: "7a3e0001-0001-4000-8000-000100000001", subject_key: EX-11, metric: issue_vs_measured, day: "2026-10-19", repeat: 2}
    preconditions:
      - "world-p1: abc-infra · EX-11 · 2026-10-19: vế kho xuất = phiếu kho 2750 L; vế đo = cảm biến 2689 L"
      - "chưa có phiếu nào ở mọi tenant; hôm nay của mọi tenant = 2026-10-20 lúc 10:00"
    sources:
      - warehouse_slip
      - fuel_sensor
    expected_route: TOOL
    expected_tools: [open_discrepancy_ticket]
    expected_context: []
    expected_output_properties:
      results: {DONE: 2}
      replayed_false: 1
      replayed_true: 1
      distinct_ticket_ids: 1
      ticket:
        status: OPEN
        subject_key: EX-11
        metric: issue_vs_measured
        day: "2026-10-19"
        diff: "61"
        approx: false
        left: {metric: issued_fuel, value: "2750", unit: L}
        right: {metric: measured_consumption, value: "2689", unit: L}
    expected_state:
      tickets_open: 1
      ledger_rows: 1
      audit:
        - {outcome: EXECUTED, count: 1}
        - {outcome: REPLAYED, count: 1}
        - {outcome: REFUSED, count: 0}
        - {outcome: VERIFY_FAILED, count: 0}
    must_not_do:
      - "không tạo phiếu thứ hai"
      - "không trả DUPLICATE_OPEN_TICKET cho lần gửi lại hợp lệ của chính mình (C4b đứng trước R5, §3)"
      - "không đổi số liệu trong bản chụp phiếu khi phát lại"
    business_rules:
      - "§6.3 gửi lại tuần tự"
      - "§3 C4b trước C5 (R5)"
      - "§7.2 phát lại cũng đọc lại (I3)"
      - "R7 số do hệ tính"
      - "phụ thuộc Q-P1-7 (§3, ĐỀ XUẤT): ca đúng khi C4b (tra sổ lệnh) đứng trước R5 (luật không trùng); chủ dự án đảo thứ tự thì ca này phải làm lại"
    permissions: null
    failure_injection: null
    expected_fallback: null
    metrics: [idempotency_correctness, tool_success]
    severity: S1
    acceptance_criteria:
      - "Biến thể: giám đốc gửi hai lần liên tiếp cho máy có số liệu hai ngày; chỉ ngày 19/10 được gọi."
      - "Lần đầu: DONE, replayed=false, phiếu OPEN mang hai vế, chênh lệch và cờ approx do hệ tính từ fact có thẩm quyền (R7)."
      - "Mỗi lần gửi lại cùng khoá, cùng nội dung: DONE, replayed=true, cùng mã phiếu; không ghi thêm phiếu hay dòng sổ lệnh; mỗi lần phát lại để lại đúng một dòng audit REPLAYED (§6.3)."

