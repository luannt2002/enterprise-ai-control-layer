  area: CTX
  statement: "Nén context (compression) chỉ thêm khi ngân sách đòi: bản nén không được làm mất con số, nguồn hay điều kiện áp dụng; so sánh chất lượng trả lời trước/sau nén trên bộ ca trước khi giữ."
