  area: EVL
  statement: "Benchmark không đồng nghĩa chất lượng production: phân biệt bốn mức đánh giá (benchmark → domain → application → production); điểm benchmark cao phải được hỏi: đo gì, dataset nào, có nhiễm (contamination), có overfit, cùng miền, cùng phân phối production không; quyết định chọn/đổi model hay tuyên bố sẵn sàng production dùng bộ ca của tenant chứ không dùng điểm benchmark công khai."
  rationale: "Anti-pattern 5: high benchmark → 'production ready'."
