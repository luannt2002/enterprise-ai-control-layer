  statement: "Context Builder là phần mềm tất định (kiến trúc + lập trình thuần), không phải 'phép màu AI': nó xử lý schema, truy vấn DB, tích hợp API, parsing, chuẩn hoá, phân quyền, phiên bản, nguồn sự thật, giải quyết xung đột, cache, tuần tự hoá, validation, xử lý lỗi; model có thể hỗ trợ vài bước nhưng nền móng vẫn là kỹ thuật; câu hỏi nó trả lời: 'để giải task hiện tại, model cần chính xác thông tin gì, dưới dạng nào?'."
  rationale: "[VIDEO] Độ chính xác của bước dựng context phải gần như tuyệt đối vì sai ở đây là sai số liệu."
  sources:
