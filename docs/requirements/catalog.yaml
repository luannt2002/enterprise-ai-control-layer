  verification: {kind: test, ref: "khi cổng mở: ca nhận dạng giả → observation kèm độ tin cậy; dưới ngưỡng → duyệt người; không ghi thẳng fact"}
  note: "Chỉ áp dụng sau khi cổng thị giác mở; ca nhận dạng ảnh công trường chưa có dữ liệu thật hợp pháp."
- id: REQ-CV-003
  area: CV
  statement: "Dataset thị giác có QA: gán nhãn có kiểm, chia train/validation/test, quản lý phiên bản dataset/model; chỉ số precision, recall, false positive, false negative, độ trễ suy luận, trôi môi trường (environment drift) và giám sát sau triển khai."
  rationale: "Dataset → labeling → dataset management → training → model management."
  sources:
