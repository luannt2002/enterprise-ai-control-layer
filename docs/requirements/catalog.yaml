- id: REQ-ENT-001
  area: ENT
  statement: "Từ điển miền (domain dictionary) của tenant có đủ các trường: Canonical Term, Aliases, Abbreviations, Department Meaning, Context-dependent Meaning, Unit, Data Type, Validation Rule, Examples, Counterexamples; ví dụ và phản ví dụ được dùng làm ca kiểm thử."
