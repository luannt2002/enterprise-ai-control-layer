  area: EVL
  statement: "Chất lượng production là tích của chất lượng model, chất lượng dữ liệu, độ khớp môi trường, chất lượng tích hợp và chất lượng đánh giá; mỗi hệ số được đánh giá riêng; model được đánh giá trên phân phối và môi trường thật của tenant, không trên phân phối của benchmark."
