         aliases: [máy xúc 07, máy 07],
         source_ids: {erp: asset-8401, fuel_sensor: EX007, warehouse_slip: EX-07}}
      - {id: RL-07, type: roller, name: Lu rung RL-07, project: PRJ-B,
