- id: REQ-RTE-003
  area: RTE
  statement: "Router thử luật tất định trước (từ khoá, mẫu, khe và ngưỡng của pack); không có route 'mọi thứ → frontier LLM'; router phải chạy và đạt chỉ số trên bộ RTE-T khi không có model nào được cấu hình. Câu hỏi đầu: 'Có luật tất định giải được không? → dùng luật'."
  rationale: "Router có thể không cần AI; đưa mọi thứ qua frontier model là anti-pattern 1."
