- id: REQ-SOT-004
  area: SOT
  statement: "Mỗi fact mang provenance đầy đủ: observation gốc nguyên văn, nguồn và loại nguồn, phiên bản tài liệu/bản ghi, chủ sở hữu, thời điểm quan sát, độ tin cậy; không có fact vô danh; câu trả lời dẫn được về nguồn và phiên bản."
