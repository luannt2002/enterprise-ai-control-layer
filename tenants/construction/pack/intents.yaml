# Ý định theo LUẬT. Một ý định khớp khi có ít nhất một keyword VÀ (nếu khai báo) ít nhất một
# term. Hai ý định cùng priority cùng khớp → hỏi lại, không chọn bừa.

unmatched_route: REJECT
unmatched_template: out_of_scope

# Câu hỏi số liệu kèm một con số người dùng đưa ra + cụm dưới đây là câu XÁC NHẬN: trả "Đúng/Không"
# theo nguồn có thẩm quyền, kèm các số khác cùng kỳ (đều có nhãn) — không xác nhận theo cảm tính.
confirm_markers: [đúng không, phải không, có đúng, đúng chưa, đúng ko, phải ko, đúng hông]

# Câu xác nhận chỉ được phán quyết "Đúng." / "Không." khi MỌI chữ của câu được giải thích: thực thể, mốc đọc được, từ khoá của chính
# ý định, thuật ngữ vật tư, đúng một con số có đơn vị, cụm xác nhận, hoặc một từ dưới đây (ADR-0009). Đây là danh sách CHO PHÉP:
# thiếu một từ chỉ làm câu mất phán quyết (vẫn trả số), không bao giờ làm phán quyết sai. Chỉ thêm từ không mang nghĩa claim. Chỉ áp
# cho câu CÓ DẤU: câu không dấu không được phán quyết (khớp bỏ dấu làm chữ trùng nhau: "co" = có / cỡ, "do" = đo / độ).
claim_neutral_words: [cho hỏi, cho tôi hỏi, cho em hỏi, cho mình hỏi, xin hỏi, ơi, ạ, à, nhé, nhỉ, nha, vậy, thế, đã, có, là, được, dc, đc, của, cho, ghi, đo]

# Cụm KHÔNG phải từ khoá dù chứa từ khoá ("người dùng" không phải "dùng" = tiêu thụ). "xác nhận" (nhờ xác nhận) không phải "nhận" của ý định
# kho xuất: chữ con của từ ghép (S4R-03, S4BS-01). Cụm ghép mang nghĩa khác mà bỏ qua không làm đổi nghĩa câu (S4R-03, sửa sau H4):
# "ghi nhận" / "nhận xét" ≠ "nhận", "cấp bách" ≠ "cấp". "ghi nhận" / "nhận xét" cũng là cụm báo nghĩa lệnh ghi / đánh giá ở mục nghĩa chưa
# hỗ trợ bên dưới — cơ chế đó chạy TRƯỚC bước đếm từ khoá, nên có mặt ở đây không đổi kết cục (soát gộp 24/10). Cụm nghĩa chưa hỗ trợ khác
# ("dự báo", "báo giá", "cảnh báo") khai ở mục nghĩa chưa hỗ trợ, không ở đây.
ignore_phrases: [người dùng, người sử dụng, xác nhận, ghi nhận, nhận xét, cấp bách]

# Trợ lý nhiên liệu: câu nhắc máy/dự án mà không nói vật tư, và không có đại lượng nào khác
# ("giá", "nhân công"…), thì hiểu là DẦU. Chính sách của tenant, viết ra rõ ràng (ADR-0001 D7).
default_terms: [diesel_fuel]

# Cụm cho biết câu hỏi đòi một LƯỢNG. Câu hỏi lượng dầu mà chỉ có tài liệu trả lời ("theo quy trình
# được cấp tối đa bao nhiêu lít?") thì báo thiếu bằng chứng: tài liệu không phải nguồn của số liệu.
quantity_markers: [bao nhiêu, định mức, mấy]

# Từ so sánh bậc hơn / kém (cụm đóng của tiếng Việt: "cao hơn", "nhiều hơn", "kém", "so với"). Mệnh đề có từ này mà nêu ĐÚNG hai chỉ số khác nhau ("đội báo nhiều hơn kho xuất
# bao nhiêu") là phép tính hiệu theo thứ tự nhắc (vế trước − vế sau); nêu hai chỉ số mà không có từ so sánh (hay "chênh / lệch") thì hoà ⇒ hỏi lại, không chọn theo số cụm khớp.
comparison_markers: [hơn, kém, so với]

# Nghĩa hệ CHƯA hỗ trợ (D-OP-18 = c): câu mang nghĩa này không được trả lời theo chỉ số còn lại ("dự báo" không phải "đội báo", "nhà cung cấp" không phải
# "cấp", "ghi nhận" không phải "nhận"); hệ hỏi lại và nói rõ nghĩa nào chưa có. Cụm báo nghĩa chiếm chỗ trong luật khớp dài nhất.
# cues là danh sách theo HỌ NGHĨA (đồng nghĩa trong cùng họ, không theo từng câu của bộ ca nào); độ phủ của danh sách do bộ giữ lại độc lập đo — nghĩa / cụm mới
# phải thêm ở đây. signals là tín hiệu CẤU TRÚC (không cần chữ trong cues): span:money (bộ chuẩn hoá thấy số + đơn vị tiền), asked_unit:currency ("bao nhiêu" +
# đơn vị tiền ở cuối mệnh đề); tín hiệu cấu trúc chỉ tính khi câu không nêu lượng cùng chiều đo với chỉ số ("3850 L … 25.000 đồng" vẫn là câu về lượng). Số nói tắt
# không đơn vị ("1tr dầu", "4 củ") KHÔNG phải tín hiệu: ca WIN-I-010 ghim câu trả lời theo nguồn có thẩm quyền. Không dùng thuật ngữ "giá" của lexicon làm tín hiệu: nó khớp
# cả "giá trị" ("báo cáo giá trị" không phải hỏi tiền) — "đơn giá", "giá dầu" là cụm. needs_value: chỉ tính khi câu nêu một con số và không phải câu hỏi (cụm xác nhận / cụm hỏi lượng) — dấu "?" một mình không làm câu thành
# câu hỏi ("Ghi nhận EX-03 tiêu thụ 3782 L dầu nhé?" là lệnh ghi; "EX-03 ghi nhận tiêu bao nhiêu dầu?" là câu hỏi).
# Cụm cho biết một MỆNH ĐỀ bị bỏ qua ("chi phí không quan tâm, …", "tiền dầu thì để sau, …"): cụm báo nghĩa chưa hỗ trợ nằm trong mệnh đề ấy không làm câu thành hỏi lại (cụm vẫn
# chiếm chỗ trong luật khớp dài nhất). Dấu hiệu phải ở CÙNG mệnh đề với cụm.
# Hoãn / đã xong ("Chi phí em lo sau, …", "Tiền em tính sau, …", "Quyết toán kỳ trước xong, …") cũng là mệnh đề không phải điều đang hỏi (S4BS-05); phủ định thì theo negation_markers (không đứng cuối mệnh đề).
dismiss_markers: [không quan tâm, không cần, chưa cần, khỏi cần, để sau, bỏ qua, lo sau, tính sau, làm sau, xong]

# Từ nối mở đoạn MỤC ĐÍCH (S4BS-01): đoạn từ từ nối tới hết mệnh đề nói vì sao người hỏi cần câu trả lời ("… để em báo cáo gấp", "… nhằm lập báo cáo tuần"), không nói chỉ số nào: chữ trong đó không góp từ khoá
# chỉ số, không kích hoạt cụm báo nghĩa chưa hỗ trợ. Đoạn mang cụm hỏi ("để biết đội báo bao nhiêu dầu?") là chính câu hỏi nên vẫn tính. Đây là từ nối ngữ pháp (lớp đóng), không phải danh sách nghĩa.
purpose_markers: [để, nhằm]

# Từ phủ định (lớp đóng của ngữ pháp). Đứng CUỐI câu chúng là đuôi hỏi có / không ("EX-03 hôm nay có dùng quá 4000 L dầu không"): một dấu hiệu hỏi như cụm xác nhận và dấu "?".
negation_markers: [không, chưa, hông, ko]

# Từ nối mở mệnh đề điều kiện ("Nếu dự báo mưa, EX-03 hôm nay dùng bao nhiêu dầu?"): giả thiết, không phải điều đang hỏi nên cụm báo nghĩa trong đó không kích hoạt (S4BS-05).
condition_markers: [nếu, giả sử, hễ]

# Động từ của NGUỒN (S4BS-06): "<tên nguồn> báo" ("cảm biến báo", "hoá đơn báo", "phiếu kho báo", "ERP báo") là chữ của nguồn, không phải chỉ số đội báo. Tên nguồn lấy từ metrics.yaml (nhãn + bí danh) cho MỌI
# chỉ số; lúc nạp ý định của chỉ số nhận thêm cụm "<tên nguồn> <động từ>" (cụm dài thắng "báo" trong luật khớp dài nhất). Thêm nguồn mới ở metrics.yaml là đủ — không thêm từ khoá theo từng nguồn.
source_verbs: [báo]

unsupported_meanings:
  - {name: money, template: unsupported_money, cues: [tiền, nhà cung cấp, chi phí, thành tiền, kinh phí, ngân sách, giá thành, trị giá, đơn giá, giá dầu, giá nhiên liệu, quyết toán], signals: ["span:money", "asked_unit:currency", "asked_unit:currency_usd"]}
  - {name: forecast, template: unsupported_forecast, cues: [dự báo, dự đoán, dự phóng, dự trù], weak_cues: [dự kiến, dự tính, ước tính, sẽ]}
  - {name: quote, template: unsupported_quote, cues: [báo giá, hỏi giá, xin giá, chào giá, giá chào]}
  - {name: warning, template: unsupported_warning, cues: [cảnh báo, báo động, nhắc tôi, nhắc em, nhắc mình, nhắc nhở, báo khi, thông báo khi]}
  # signals "stated_value" (D-OP-18 = c ĐÚNG CHỮ): câu nêu thực thể + con số có đơn vị mà KHÔNG có dấu hiệu hỏi / xác nhận (cụm hỏi, "?", đuôi "… không") là lệnh ghi BẤT KỂ động từ — danh sách cues chỉ còn là
  # phần phụ cho câu có "?" (lệnh lịch sự "Ghi nhận … nhé?") và cho yêu cầu kèm thêm; chỉ dùng khi chưa nghĩa nào khác được báo.
  - {name: write, template: unsupported_write, cues: [ghi nhận, ghi lại, ghi sổ, ghi vào, ghi chép, cập nhật, lưu lại, nhập số liệu, nhập vào, khai báo, sửa số, chỉnh số, điều chỉnh số, hiệu chỉnh, thay số, lập phiếu], needs_value: true, signals: ["stated_value"]}
  - {name: evaluation, template: unsupported_evaluation, cues: [nhận xét, đánh giá, nhận định, bình luận, phân tích, chấm điểm, cho ý kiến, ý kiến về, kết luận, hợp lý, bất thường, bình thường, quá nhiều, tiết kiệm, cao hay thấp], needs_value: true}

