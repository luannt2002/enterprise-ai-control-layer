- id: REQ-DIG-006
  area: DIG
  statement: "Mỗi tài liệu có loại lấy từ danh mục của pack (hợp đồng, hồ sơ thầu, tiêu chuẩn kỹ thuật, BOQ, bản vẽ, biên bản nghiệm thu, hoá đơn, quy định an toàn, sổ tay thiết bị); loại quyết định chiến lược đọc/chunk và ACL; loại chưa biết đi hàng đợi duyệt; BOQ xử lý theo cấu trúc bảng phân cấp, bản vẽ chỉ lưu metadata; metadata gồm phiên bản và quan hệ giữa các tài liệu."
  rationale: "Bộ hồ sơ doanh nghiệp không thể 'cắt mỗi 500 token rồi đẩy vào Vector DB'."
