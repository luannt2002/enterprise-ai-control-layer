  statement: "Trước khi thêm một capability hoặc use case AI phải có bản ghi giá trị gồm: business problem thật sự là gì; nếu bỏ model thì rule/code/search/database giải được bao nhiêu; AI tạo thêm capability gì và có giá trị đo được không; AI đang giải problem hay chỉ là marketing; hậu quả khi AI sai; có đáng trả thêm latency/cost/complexity không. Nếu không có giá trị đo thêm thì không dùng AI."
