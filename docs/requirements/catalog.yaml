  note: null
- id: REQ-SEC-007
  area: SEC
  statement: "Truy xuất có nhận biết quyền: ACL theo tài liệu, bộ lọc theo dự án/chỉ số, và lọc quyền áp ở MỌI đường dữ liệu (facts, events, truy xuất tài liệu, tool) trước khi vào ContextPackage; ca 'permission leak' và 'unauthorized data' có test; tenant A cố truy xuất tài liệu tenant B bị chặn."
  rationale: "Không để retrieval bypass ACL."
