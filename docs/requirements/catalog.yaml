- id: REQ-EVL-014
  area: EVL
  statement: "Bộ ca construction V3 gồm khoảng 100 ca không chỉ hỏi–đáp theo tỉ lệ 25 Query, 20 Command, 20 Event, 15 Workflow, 10 Conflict/Reconciliation, 10 Failure/Security (ví dụ CASE 001 'Hôm nay dự án A dùng bao nhiêu dầu?' → QUERY; CASE 026 'Tạo yêu cầu kiểm tra EX-03' → COMMAND; CASE 046 'EX-03 vượt nhiệt độ giới hạn' → EVENT; CASE 066 'phiếu mua vật tư cần trưởng dự án rồi kế toán duyệt' → WORKFLOW; CASE 081 'ERP 3900 L / kho 3850 L / supervisor 4k / sensor 3782 L' → RECONCILIATION; CASE 091 'Tenant A cố retrieve tài liệu Tenant B' → SECURITY); 75% số ca không phải Query."
  rationale: "Problem map tiếp theo phải sinh ca không phải Ask/Answer."
  sources:
