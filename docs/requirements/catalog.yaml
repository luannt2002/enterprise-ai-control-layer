- id: REQ-SOT-007
  area: SOT
  statement: "Dữ liệu sự thật đi qua bốn tầng: OBSERVATION (điều một nguồn đã nói/ghi, nguyên văn + nguồn + thời điểm) → MEASUREMENT (giá trị có kiểu + đơn vị + thực thể + kỳ, còn gắn observation gốc) → FACT (theo chỉ số ngữ nghĩa do pack định nghĩa) → DERIVED FACT (suy ra từ fact khác); data/sourceoftruth không được là kho fact generic một bảng."
  rationale: "Tách Fact khỏi Observation sớm, nếu không sourceoftruth thành kho fact quá đơn giản."
