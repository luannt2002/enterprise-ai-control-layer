  statement: "Dấu phân cách và hậu tố số do locale/lexicon của pack quy định, không đoán ngầm: '4.000' theo locale vi là 4000, '0.35km' là 0,35 km, 'k' là nghìn trong ngữ cảnh lượng nhiên liệu; chuỗi còn hai cách hiểu mà miền giá trị của chỉ số không phân định được thì đi CLARIFICATION; lỗi lệch 1000 lần (4000 L bị hiểu là 4 L) là mức S1 và phải bị chặn bởi kiểm miền giá trị."
