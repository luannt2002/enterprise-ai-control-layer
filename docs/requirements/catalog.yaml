  area: SKL
  statement: "Skill báo cáo ngày công trường thực hiện đúng thứ tự: thu đầu vào trong ngày → kiểm trường thiếu → chuẩn hoá đơn vị → nhận dạng dự án → kiểm số lượng → so với ngày trước → phát hiện bất thường → sinh báo cáo → kiểm tổng → đính kèm bằng chứng → xin duyệt; trường thiếu → CLARIFICATION, kiểm tổng do code, xin duyệt là human task."
