  area: EVL
  statement: "Vòng đánh giá liên tục: baseline → thí nghiệm → đánh giá → so sánh → kiểm thử hồi quy → phát hành; Build → Evaluate → Deploy → Observe → thu lỗi → tạo ca hồi quy → cải tiến → đánh giá lại; không có eval thì không biết router đúng không, retrieval lấy đúng tài liệu không, context thiếu fact không, parser làm mất bảng không, model đúng không, tool chạy đúng không, phiên bản mới tốt hơn hay hồi quy."
