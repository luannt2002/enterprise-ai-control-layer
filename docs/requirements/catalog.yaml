  note: null
- id: REQ-OBS-007
  area: OBS
  statement: "Chi phí mỗi lượt được tính từ số token vào/ra và bảng giá model có hiệu lực theo thời điểm, ghi vào bản ghi lượt; báo cáo chi phí theo route/tenant; chi phí/yêu cầu là chỉ số hạng nhất."
