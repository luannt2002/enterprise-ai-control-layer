- id: REQ-CTX-013
  area: CTX
  statement: "Với route số liệu, gói bằng chứng là bản ghi có kiểu {thực thể, kỳ, giá trị, đơn vị, nguồn} (ví dụ project A, ngày, fuel_liters 4000, nguồn báo cáo ngày) thay vì văn bản tự do hay bảng/PDF thô; mỗi loại dữ liệu (JSON, văn bản, XML, bản ghi) có bộ chuyển thành bằng chứng riêng."
  rationale: "[VIDEO] Cần xử lý đúng từng loại dữ liệu để context đưa vào AI chính xác gần như tuyệt đối."
