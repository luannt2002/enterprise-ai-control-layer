  phase: MVP
  verification: {kind: review, ref: "thuật ngữ trong 04-platform/08-mcp đúng; test: tool chạy đủ luồng mà không cần MCP"}
  note: null
- id: REQ-MCP-002
  area: MCP
  statement: "Không dùng MCP chỉ vì trend: mặc định tích hợp trực tiếp qua Tool/API; xác định tích hợp nào đáng MCP và tích hợp nào giữ API trực tiếp; MCP chỉ mở khi có bên tiêu thụ thật cần khám phá tool theo chuẩn."
  rationale: "Cổng MCP của kiến trúc."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART XV — MCP", lines: "873-912"}
