  phase: MVP
  verification: {kind: test, ref: "test rò rỉ: principal thiếu quyền → ContextPackage không chứa bằng chứng bị cấm; prompt gửi model được ghi lại và kiểm không chứa chuỗi bị cấm"}
  note: null
- id: REQ-CTX-008
  area: CTX
  statement: "Khử trùng và xử lý xung đột nằm trong context: bằng chứng trùng được gộp; bằng chứng mâu thuẫn trong cùng chỉ số được hoà giải theo thẩm quyền (không theo thứ tự đến) và được gắn cờ nếu không hoà giải được; context nào stale, conflict, trùng được xử lý trước khi tới model."
  rationale: "Nhiều nguồn cùng nói là việc của hoà giải, không phải của model."
