- id: REQ-NRM-012
  area: NRM
  statement: "Chuẩn hoá ngày giờ: ngày tường minh, giờ ('mưa từ 14h'), buổi (sáng/chiều), múi giờ theo tenant; thời điểm quan sát và thời điểm hiệu lực lưu riêng; lệch múi giờ là lớp lỗi dữ liệu có nhãn."
  rationale: "Báo cáo ngày có giờ ca, giờ mưa; lệch múi giờ là một lớp lỗi dữ liệu."
  sources:
