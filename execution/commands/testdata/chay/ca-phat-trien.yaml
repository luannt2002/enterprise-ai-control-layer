# Bộ ca PHÁT TRIỂN của ca lệnh open_discrepancy_ticket (HOP-DONG §10, §12.1): tầng 1, do người viết mã soạn; viết từ ví dụ của §10 và §12.1,
# KHÔNG chép từ bộ giữ lại độc lập. Dạng tệp {suite: lenh, cases: [...]}; mỗi ca đúng 23 khoá của docs/CONVENTIONS.md §5, khoá `scenario` ghi mã lớp ca.
# Chạy bằng bộ chạy chung (execution/commands/bochay_test.go) trên bộ nhớ và PostgreSQL với tệp thế giới the-gioi-phat-trien.yaml; thay đổi một ca
# là đổi bộ ca phát triển, không phải bộ giữ lại. Chuỗi mà YAML dễ hiểu thành kiểu khác (ngày, số) viết có nháy.
#
# Phủ các lớp ca khai được bằng khuôn: A01–A08 (kể cả A02b, A04b), A09 (chỉ ca phát triển: vai thêm ticket_only), A10, A13–A23, và A29e (điểm
# chèn lỗi F8, phần đếm dòng của A29 (e); phần trace_id và bộ đếm lỗi lưu vết chờ đường lưu vết của K3). A11, A12, A24–A29 cần cửa HTTP, tệp
# pack, đếm model, đường hỏi, quyền SQL hay vết mà khuôn chưa có (§12, U10): phủ bằng test Go riêng, không nằm trong tệp này.
#
# Khuôn chung (anchor khuon) là ca đầu; các ca sau chỉ ghi khoá khác (`<<: *khuon`).
