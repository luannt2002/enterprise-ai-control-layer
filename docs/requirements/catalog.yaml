- id: REQ-RAG-016
  area: RAG
  statement: "Bộ ca hỏng RAG phủ năm nhóm: chunking xấu, embedding không khớp, nhiễu truy xuất, tràn ngữ cảnh, hallucination; và mười ca của brief V2: wrong chunk, missing document, old version, conflicting versions, low recall, wrong entity, wrong project, permission leak, retrieval pollution, citation mismatch; mỗi ca có kỳ vọng phát hiện hoặc chặn."
  rationale: "Failure-first RAG: build → break → diagnose → measure → fix."
