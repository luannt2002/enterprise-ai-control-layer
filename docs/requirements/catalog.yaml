  note: null
- id: REQ-MND-017
  area: MND
  statement: "Định nghĩa vận hành của EAIS trong tài liệu: Enterprise AI Engineering không chủ yếu là làm model thông minh hơn mà là xây hệ thống kiểm soát model được thấy dữ liệu gì, hiểu ngữ cảnh nào, được quyết định gì, được hành động gì và chứng minh đầu ra/hành động đáng tin; EAIS = Software + Data + AI + Control, không phải 'AI = tất cả'; không train một model mới mà xây hệ thống quanh model."
  rationale: "Định nghĩa gọn để mọi quyết định thiết kế quy chiếu về."
