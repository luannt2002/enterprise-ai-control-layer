  area: EVL
  statement: "Giữ tập holdout không dùng khi tinh chỉnh luật, prompt, few-shot hoặc pack và báo số liệu trên holdout; tránh rò rỉ train/test và nhiễm benchmark (contamination); thay đổi dựa trên chính bộ ca đang báo cáo phải bị đánh dấu."
