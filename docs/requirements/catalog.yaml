  note: null
- id: REQ-CTX-005
  area: CTX
  statement: "Quy trình dựng context gồm các bước cố định theo thứ tự: chọn nguồn → thẩm quyền → lọc quyền → khử trùng → xử lý xung đột → xếp hạng → (nén ở V1) → sắp thứ tự → cắt theo ngân sách token → gắn bằng chứng và provenance; lọc quyền luôn trước khi bằng chứng đi tiếp; mỗi bước có test đơn vị."
  rationale: "Context assembly line: mỗi bước sai là một kiểu hỏng riêng."
