- id: REQ-CTX-015
  area: CTX
  statement: "Chất lượng context (precision/recall bằng chứng trên bộ ca vàng) phải được đo và sửa trước khi nâng model: model vừa với context đúng + tool đúng + kiểm chứng cho hệ thống tốt hơn frontier model với context rác; nâng model không được dùng để che lỗi context."
  rationale: "Context có thể quan trọng hơn model."
  sources:
