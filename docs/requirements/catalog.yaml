  statement: "Nhiều nguồn nói về cùng một đại lượng đời thực có thể là các chỉ số ngữ nghĩa khác nhau: reported_fuel (đội trưởng báo), issued_fuel (kho xuất), measured_consumption (cảm biến đo), billed_fuel (hoá đơn); chỉ số do pack định nghĩa và mỗi loại nguồn ánh xạ vào đúng một chỉ số."
