  area: CTX
  statement: "Thứ tự bằng chứng trong gói được quyết định bởi luật tất định (hạng thẩm quyền rồi độ liên quan); thứ tự xấu và thiếu/trùng/mâu thuẫn bằng chứng là các kiểu hỏng context được đo riêng."
