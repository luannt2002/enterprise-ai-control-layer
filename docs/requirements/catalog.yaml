  note: null
- id: REQ-RAG-020
  area: RAG
  statement: "Contextual retrieval (thêm ngữ cảnh trước khi nhúng) chỉ mở khi lỗi ngữ cảnh đo được (mảnh thiếu ngữ cảnh) sau khi đã có hybrid; thứ tự nâng cấp: truy xuất đơn giản → đo → đủ tốt thì dừng → xác định lỗi (recall → hybrid; precision → rerank; context → contextual) → vẫn thiếu mới agentic/graph."
  rationale: "Không lấy 'agentic patterns là core production' làm mặc định."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "14. PHASE 6 — Advanced RAG", lines: "2891-2970"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "18. Đây mới là roadmap RAG tôi sẽ rút ra từ file", lines: "3047-3143"}
  applies_to: [intelligence/rag]
  phase: GATED
  verification: {kind: eval, ref: "cổng mở khi lỗi thiếu ngữ cảnh của chunk đo được trên bộ ca sau khi đã có hybrid"}
  note: "Điều kiện mở cổng: hybrid (+ rerank nếu mở) vẫn trượt vì mảnh tài liệu thiếu ngữ cảnh, đo được trên bộ ca truy xuất; kèm ADR và số đo trước–sau."
- id: REQ-RAG-021
  area: RAG
  statement: "Graph RAG chỉ mở cho câu hỏi cần quan hệ nhiều bước giữa các thực thể (ví dụ A mua B, CEO cũ của B từng làm ở công ty có liên hệ với C) mà hybrid không trả lời được; câu hỏi chính sách thông thường dùng hybrid; không dựng graph DB chỉ vì nó phổ biến."
  rationale: "Graph có giá trị khi thật sự cần multi-hop."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "16. Ví dụ Graph RAG", lines: "2971-3009"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "14. PHASE 6 — Advanced RAG", lines: "2891-2970"}
