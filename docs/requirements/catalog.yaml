  note: null
- id: REQ-MND-020
  area: MND
  statement: "Kiến trúc đích dùng bốn mặt phẳng — Intelligence (model, reasoning, router, skills, planning), Context (RAG, memory, history, state, context builder), Action/Integration (tools, MCP, API, DB, search, files, services), Control (auth, policy, evals, trace, security, cost, validation, retry, approval, audit, observability) — và tám tầng L0–L7 (nghiệp vụ, nền dữ liệu, tri thức/ngữ cảnh, trí tuệ/quyết định, hành động/tích hợp, độ tin cậy/kiểm soát, bằng chứng/vận hành, cải tiến). Sơ đồ 'model ở giữa + vệ tinh RAG/Router/Skills/Tools/MCP' chỉ là minh hoạ, không phải kiến trúc chuẩn; AI Model chỉ là một ô trong mặt phẳng Intelligence."
  rationale: "Các vệ tinh không ngang hàng nhau và còn thiếu context/state/memory cùng lớp reliability/eval/security/observability."
