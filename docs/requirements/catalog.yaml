  note: null
- id: REQ-NRM-011
  area: NRM
  statement: "S2 chuẩn hoá và trích span có kiểu chỉ dùng luật và lexicon của pack; model chỉ là phương án lùi có cổng cho phần luật không bắt được và kết quả của nó phải đi qua đúng các bước kiểm như đường luật."
  rationale: "Đừng dùng thành phần xác suất cho phần mà code tất định giải được tốt hơn."
  sources:
