- id: REQ-MDL-012
  area: MDL
  statement: "Mọi thông tin model không tự biết phải do hệ thống đưa vào có kiểm soát qua ContextPackage: database doanh nghiệp, ERP, dự án hiện tại, ai đang đăng nhập, người dùng được xem gì, hợp đồng nào còn hiệu lực, file nào authoritative, số nào chính xác, workflow đang ở state nào, tool nào được phép chạy, tenant nào đang dùng; khi gói rỗng thì trả INSUFFICIENT_EVIDENCE chứ không để model 'biết'."
  rationale: "Câu 'AI biết dữ liệu doanh nghiệp' thực chất là phần mềm tìm/chọn/kiểm rồi đưa phần thích hợp cho model."
  sources:
