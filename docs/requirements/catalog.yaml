- id: REQ-MND-023
  area: MND
  statement: "Mỗi đợt thiết kế đối chiếu mười hai cặp hỏi–đáp nguyên lý đầu cho từng subsystem: Model (việc gì cần suy luận/sinh xác suất?), Context (model cần biết gì ngay lúc này?), RAG (evidence nào cần truy xuất từ tri thức lớn?), Router (request/bước này nên đi đâu?), Tool (hành động tất định nào cần thực hiện?), MCP (capability/context ngoài được expose theo chuẩn nào?), Skill (công việc theo procedure nào?), Memory (điều gì cần giữ qua thời gian?), State (workflow đang ở đâu?), Eval (làm sao biết đúng/tốt hơn?), Guard/Policy (model được phép làm gì?), Observability (sai ở thành phần nào?)."
  rationale: "Checklist mạnh để debug và để kiểm tra mỗi subsystem có lý do tồn tại."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "22. Và mỗi subsystem lại có câu hỏi First Principles riêng", lines: "4402-4422"}
  applies_to: [docs]
  phase: V1
  verification: {kind: review, ref: "tài liệu 04-platform trả lời đủ 12 câu cho 12 subsystem"}
  note: null
- id: REQ-MND-024
  area: MND
  statement: "Question Map 35 câu phải được trả lời trước khi build một capability hoặc tenant: 1 business problem thật sự là gì; 2 bỏ AI thì phần nào vẫn giải được; 3 AI tạo value gì; 4 output nào critical; 5 output nào phải exact; 6 phần nào deterministic; 7 phần nào probabilistic; 8 data nằm ở đâu; 9 source of truth là gì; 10 data có sạch không; 11 có conflict/version/stale không; 12 input có ambiguity không; 13 cùng một từ có đổi nghĩa theo domain không; 14 có cần clarification không; 15 document có structure/layout không; 16 parser giữ được meaning không; 17 request route đi đâu; 18 cần SQL, API, search hay RAG; 19 model cần context gì; 20 context nào authoritative; 21 user được xem context nào; 22 tool nào cần gọi; 23 tool có side effect không; 24 output validate bằng gì; 25 khi model không chắc thì làm gì; 26 failure fallback là gì; 27 có cần human approval không; 28 metric success là gì; 29 golden dataset ở đâu; 30 regression test thế nào; 31 cost/request; 32 latency; 33 SLA/SLO; 34 trace lỗi tới component nào; 35 có thật sự cần fine-tuning/training không."
  rationale: "Danh sách câu hỏi đặt trước khi build; mỗi câu chưa trả lời là rủi ro thiết kế."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "36. QUESTION MAP --- CÂU HỎI PHẢI BIẾT ĐẶT TRƯỚC KHI BUILD", lines: "2016-2055"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "mẫu thiết kế capability/tenant chứa bảng 35 câu; câu để trống phải ghi lý do"}
  note: null
- id: REQ-MND-025
  area: MND
  statement: "Khi có người nói 'tích hợp AI', chưa hỏi 'dùng model nào' mà hỏi hai mươi câu: 1 business problem; 2 output nào cần chính xác tuyệt đối; 3 phần nào deterministic; 4 phần nào cần probabilistic reasoning; 5 data ở đâu; 6 source of truth; 7 data có sạch/nhất quán không; 8 user có quyền xem dữ liệu nào; 9 request route tới flow nào; 10 model cần context gì; 11 context lấy bằng SQL/search/RAG/API; 12 tool nào thực hiện hành động; 13 thiếu/mâu thuẫn dữ liệu thì hỏi lại thế nào; 14 output validate bằng gì; 15 failure/fallback; 16 có cần human approval không; 17 metric success; 18 golden dataset ở đâu; 19 regression test thế nào; 20 cost/latency/SLA chấp nhận được. Chưa trả lời được thì 'chọn model' còn quá sớm."
  rationale: "Checklist 20 câu của workshop note, ngắn hơn Question Map nhưng cùng tinh thần."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "28. First-principles checklist khi có người nói “tích hợp AI”", lines: "1801-1833"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "checklist 20 câu có trong mẫu tiếp nhận yêu cầu tích hợp AI của tenant mới"}
  note: null
- id: REQ-MND-026
  area: MND
  statement: "Cổng nguyên lý đầu (First Principles Gate) mười lăm câu phải được trả lời trước MỌI capability AI: 1 problem thật sự là gì; 2 bỏ AI thì giải được bao nhiêu %; 3 fact nằm ở đâu; 4 source of truth; 5 exact hay approximate; 6 deterministic hay probabilistic; 7 có ambiguity không; 8 có cần retrieval không; 9 có cần reasoning không; 10 có cần action không; 11 có cần agent không; 12 failure consequence; 13 validation; 14 metric; 15 complexity mới thêm có chứng minh được ROI không. Nguyên tắc: Complexity must be earned by evidence."
  rationale: "Cổng chuẩn hoá lý do tồn tại của từng capability."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART XXVII — FIRST PRINCIPLES GATE", lines: "1366-1406"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "ADR capability mới chứa bảng 15 câu; câu 2 và 15 phải có số đo hoặc ghi 'chưa đo'"}
  note: null
- id: REQ-MND-027
  area: MND
  statement: "Độ phức tạp phải được bằng chứng đòi: bắt đầu bằng truy xuất/luật đơn giản, đo chất lượng, đủ tốt thì dừng; chỉ khi thất bại đo được mới nâng cấp đúng chỗ hỏng (recall thấp → hybrid; precision thấp → rerank; ngữ cảnh thiếu → contextual retrieval; vẫn thiếu → agentic/graph). 'Production' không đồng nghĩa phải Agentic RAG, Graph hay Multimodal."
  rationale: "Biến nguyên tắc 'earned by evidence' thành quy trình nâng cấp."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "14. PHASE 6 — Advanced RAG", lines: "2891-2970"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "16. Ví dụ Graph RAG", lines: "2971-3046"}
    - {file: brief-02-v2-two-tenants.md, section: "PART XXVII — FIRST PRINCIPLES GATE", lines: "1366-1406"}
  applies_to: [docs, evals]
  phase: MVP
  verification: {kind: review, ref: "ADR nâng cấp retrieval/router/context nêu số đo của cấu hình đơn giản hơn đã thất bại"}
  note: null
- id: REQ-MND-028
  area: MND
  statement: "Không capability AI nào được vào core chỉ vì nó phổ biến: mỗi capability lõi phải gắn ít nhất một ca hỏng nghiệp vụ tái lập được và một test chứng minh; chuỗi BUSINESS FAILURE → ENGINEERING REQUIREMENT → CAPABILITY → IMPLEMENTATION → EVIDENCE; chiều ngược (Technology → tìm chỗ nhét vào business) bị cấm. Tính năng EAIS sinh ra từ ca hỏng, không từ danh sách từ khoá."
  rationale: "Luật mạnh nhất của dự án; giúp EAIS không lặp lại vấn đề 'RAG ở trung tâm + thêm tính năng'."
  sources:
    - {file: brief-04-rag-to-eais-expansion.md, section: "6. Và đây là nơi Construction Case Study cực kỳ quan trọng", lines: "507-567"}
    - {file: brief-04-rag-to-eais-expansion.md, section: "7. Đây mới đúng First Principles", lines: "568-672"}
    - {file: brief-04-rag-to-eais-expansion.md, section: "11. Và tôi sẽ đặt một luật cực mạnh cho dự án", lines: "893-924"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này › V3 tôi sẽ ép Construction phá architecture này", lines: "623-651"}
  applies_to: [docs, evals, core/pipeline]
  phase: MVP
  verification: {kind: review, ref: "ADR-0002; mỗi capability trong core có liên kết tới một CON-F/SPT-F/PLT-F và test id (kiểm bằng script review)"}
  note: null
- id: REQ-MND-029
  area: MND
  statement: "Chuỗi tiến hoá capability: BUSINESS CASE → RUN CURRENT SYSTEM → FAIL → WHY → ROOT CAUSE → MISSING CAPABILITY → MINIMUM DESIGN → IMPLEMENT → TEST → MEASURE. Ví dụ bắt buộc phải có trong tài liệu: 'dầu 4k' → mơ hồ đơn vị → thiếu biểu diễn chuẩn → Normalization → 100 biến thể đơn vị → normalization accuracy; 'Doanh thu tháng này?' → RAG trả sai → số chính xác không đến từ độ tương đồng tài liệu → Structured Data Tool/SQL → golden queries → exact-match / execution accuracy."
  rationale: "Đây là cách EAIS tiến hoá theo failure case."
  sources:
    - {file: brief-04-rag-to-eais-expansion.md, section: "7. Đây mới đúng First Principles", lines: "568-672"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này › V3 tôi sẽ ép Construction phá architecture này", lines: "623-651"}
  applies_to: [docs, evals]
  phase: MVP
  verification: {kind: review, ref: "tài liệu 00-MASTER-MINDSET chứa chuỗi 10 bước và hai ví dụ, mỗi ví dụ trỏ REQ/ADR/test"}
  note: null
- id: REQ-MND-030
  area: MND
  statement: "Mọi cổng capability (phân loại ý định bằng model, trích xuất tin nhắn bằng model, rerank, agent, MCP, thị giác máy/fine-tune, hàng đợi/cache/engine ngoài) mặc định ĐÓNG: điều kiện mở là ngưỡng đo được ghi trong tài liệu, mở bằng ADR kèm số đo, và phải có test âm chứng minh cổng chặn khi chưa đủ bằng chứng. Phần này không được bỏ vì nó biến 'complexity must be earned by evidence' thành quản trị kiến trúc thật."
  rationale: "Cơ chế cổng là phần được chủ dự án nhấn 'đừng bỏ'."
  sources:
    - {file: brief-05-architecture-review.md, section: "Một điểm tôi rất thích: capability gates", lines: "512-545"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này", lines: "546-575"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "14. PHASE 6 — Advanced RAG", lines: "2891-2970"}
  applies_to: [docs, core/tenant, evals]
  phase: MVP
  verification: {kind: test, ref: "test âm: bật cờ capability có cổng khi chưa có bản ghi đo/ADR → cấu hình bị từ chối lúc khởi động hoặc cờ bị bỏ qua, có log"}
  note: null
- id: REQ-MND-031
  area: MND
  statement: "Thứ tự xây theo mười một bước, mỗi bước chỉ mở khi bước trước có bằng chứng: 0 kiểm kê (cái gì dính vào RAG/model) → 1 trích hợp đồng (Retriever, Model, ContextSource, Tool, Validator) → 2 nền tenant (tenant_id, config, cô lập, quyền) → 3 nền dữ liệu (chuẩn hoá, schema chuẩn, nhận dạng thực thể, provenance, thẩm quyền nguồn) → 4 router → 5 context engine (RAG thành một nguồn) → 6 thực thi (tools, skills, workflow) → 7 độ tin cậy (validation, fallback, clarification, approval) → 8 bằng chứng (golden dataset, eval thành phần, E2E, regression) → 9 control plane (quan sát, audit, bảo mật, chi phí, SLA) → 10 tenant thứ hai → kiểm toán abstraction. Không bắt đầu bằng MCP, Agent hay GraphRAG."
  rationale: "Lộ trình chuyển RAG cũ thành capability của EAIS theo kiểu strangler."
  sources:
    - {file: brief-04-rag-to-eais-expansion.md, section: "10. Roadmap migration của project cũ → EAIS", lines: "793-892"}
    - {file: brief-05-architecture-review.md, section: "Tôi chấm architecture hiện tại như này › V3 tôi sẽ ép Construction phá architecture này", lines: "653"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "docs/06-roadmap/mvp.md theo thứ tự 0–10 và nêu MCP/Agent/GraphRAG bị gate"}
  note: null
- id: REQ-MND-032
  area: MND
  statement: "Hệ thống kế thừa không bị viết lại mà được bọc theo kiểu strangler: RAG cũ hạ từ trung tâm kiến trúc thành một capability (intelligence/rag) sau interface KnowledgeRetriever; trước khi sửa mã phải có bảng kiểm kê từng module/file với nhãn KEEP / MOVE / GENERALIZE / DECOUPLE / REPLACE / DELETE / NEW rồi mới viết code, để EAIS không thành 'RAG cũ cộng thêm một đống thư mục mới'."
  rationale: "Giá trị của RAG cũ được giữ; sai nằm ở abstraction boundary chứ không ở RAG."
  sources:
    - {file: brief-04-rag-to-eais-expansion.md, section: "(mở đầu, chưa có tiêu đề)", lines: "3-45"}
    - {file: brief-04-rag-to-eais-expansion.md, section: "3. Đừng rewrite RAG. Bọc nó lại", lines: "201-302"}
    - {file: brief-04-rag-to-eais-expansion.md, section: "11. Và tôi sẽ đặt một luật cực mạnh cho dự án › Vậy project cũ của bạn thực chất rất có giá trị", lines: "925-959"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "docs/02-migration-audit.md phân loại đủ module bằng 7 nhãn; không có module nào chưa gán nhãn"}
  note: null
- id: REQ-MND-033
  area: MND
  statement: "Đường chuyển dịch kiến trúc theo bốn bậc: V1 model-centric (model + prompt + RAG) → V2 capability-centric (thêm router, tools, skills) → V3 system-centric (nghiệp vụ + dữ liệu + phần mềm tất định + ngữ cảnh + AI capabilities + thực thi + độ tin cậy + đánh giá + governance) → V4 nền tảng doanh nghiệp bất khả tri tenant (core + tenant runtime + cấu hình/ontology/schema/rules/skills/tools/corpus/evals theo tenant). Mục tiêu của EAIS là bậc V4 và mọi tài liệu phải nêu mình đang ở bậc nào."
  rationale: "Tên gọi các bậc giúp chủ dự án định vị phạm vi MVP/V1/V2."
  sources:
    - {file: brief-04-rag-to-eais-expansion.md, section: "5. Thực ra bạn đang chuyển từ Model-centric → System-centric", lines: "421-506"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "docs/06-roadmap nêu bậc hiện tại và tiêu chí chuyển bậc"}
  note: null
- id: REQ-MND-034
  area: MND
  statement: "Nhận diện hype bằng kỹ thuật: khi một công nghệ mới được dán nhãn AI khắp nơi (ví dụ máy giặt, máy sấy tóc có AI), phải hỏi capability đo được nào đã thay đổi: AI thực sự làm gì, tạo giá trị gì, có giảm giá thành/tiết kiệm không, có cải thiện trải nghiệm không, có giải quyết điều trước đây không giải được không; đặt vấn đề và giá trị trước công nghệ."
  rationale: "[VIDEO] Cái gì cũng gắn AI vì gắn AI thì bán được; kỹ sư phải hỏi giá trị đo được."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "3. PHASE 0 --- TÁCH HYPE KHỎI ENGINEERING", lines: "257-303"}
    - {file: z-luannt-learn-ai-with-quan-ai.v1.md, section: "[Transcript thô] \"data raww video\" — dòng 2-4 (nguồn của các ý [VIDEO])", lines: "4"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "mẫu đề xuất capability có mục 'giá trị đo được' (liên kết REQ-BIZ-001)"}
  note: null
- id: REQ-MND-035
  area: MND
  statement: "Tài liệu quản trị phải có tám cảnh báo chống mẫu hỏng (anti-pattern) với cách phát hiện: 1 mọi thứ vào frontier model rồi hy vọng; 2 dữ liệu doanh nghiệp bẩn → embedding → LLM; 3 PDF → raw text → vector DB → xong; 4 số quan trọng do LLM đoán rồi vào báo cáo; 5 benchmark cao → 'production ready'; 6 model generic tốt nhất → chạy mọi domain; 7 gắn YOLO/RAG/MCP/Agent vào sản phẩm là xong; 8 hệ thống sai → đổ cho model → nâng cấp model. Mỗi mẫu có một kiểm tra tương ứng (route test, kiểm lúc nạp, cổng chất lượng đọc, kiểm số S9, cổng eval theo tenant, model policy theo tenant, cổng capability, trace trước khi đổi model)."
  rationale: "Danh sách mẫu hỏng của video biến thành checklist review."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "39. ANTI-PATTERNS MÀ VIDEO CẢNH BÁO", lines: "2178-2259"}
  applies_to: [docs, evals]
  phase: MVP
  verification: {kind: review, ref: "checklist 8 mẫu hỏng ánh xạ tới REQ-RTE, REQ-DAT, REQ-DIG, REQ-VAL, REQ-EVL, REQ-MDL, REQ-MND (cổng), REQ-OBS; mỗi mẫu có một test hoặc mục review"}
  note: null
- id: REQ-MND-036
  area: MND
  statement: "Khi đầu ra sai, phải xác định tầng sai trước khi đổi model (P10): không mặc định 'wrong answer → đổi model mạnh hơn'; trace tách từng chặng, lỗi mang nhãn fault đúng tầng; ca lỗi chỉ được kết luận là lỗi model khi các tầng dữ liệu, parser, chuẩn hoá, nguồn sự thật, router, retrieval, context, tool, validator đã được loại trừ."
  rationale: "Nguyên tắc P10 và anti-pattern 8."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "37. DEBUGGING FLOW --- KHI AI SYSTEM TRẢ LỜI SAI", lines: "2056-2119"}
