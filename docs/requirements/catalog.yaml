  verification: {kind: test, ref: "vector 45+2 và 47 từ hai provider → cùng biểu diễn chuẩn; ca múi giờ"}
  note: null
- id: REQ-RT-002
  area: RT
  statement: "Event store của sports chỉ ghi thêm và có phiên bản; xử lý đủ: thứ tự sự kiện, sự kiện đến sai thứ tự, trùng, muộn, sửa (correction), rút lại (retraction), version, nhất quán thời gian; sửa muộn hoặc rút lại là sự kiện mới trỏ về sự kiện cũ (không ghi đè); projection (tỉ số, diễn biến, bảng xếp hạng) tính lại tất định từ event store."
  rationale: "Late correction và provider disagreement là đặc trưng của sports data."
  sources:
    - {file: brief-02-v2-two-tenants.md, section: "PART XVII — SPORTS EVENT MODEL", lines: "983-998"}
