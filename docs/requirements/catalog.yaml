  note: null
- id: REQ-DAT-004
  area: DAT
  statement: "Phát hiện trôi schema (schema drift) và trôi ngữ nghĩa (semantic drift) của nguồn dữ liệu: thay đổi cột/kiểu/ý nghĩa chỉ số so với hợp đồng dữ liệu bị phát hiện, chặn nạp tự động và yêu cầu cập nhật hợp đồng/ánh xạ."
  rationale: "Hai lớp lỗi khó thấy hơn lỗi dữ liệu từng dòng."
  sources:
