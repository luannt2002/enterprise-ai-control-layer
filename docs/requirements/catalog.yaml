  note: null
- id: REQ-CTX-006
  area: CTX
  statement: "Mỗi mục trong ContextPackage là Evidence có ID ổn định trong lượt (E1, E2...), loại (fact, passage, event, calculation, policy, history), nguồn + loại nguồn + phiên bản tài liệu, hạng thẩm quyền, thời điểm quan sát, độ tin cậy và giá trị có kiểu; câu trả lời chỉ được dựa vào Evidence trong gói và các claims phải trỏ ID."
  rationale: "Evidence binding và provenance là điều kiện kiểm số và trích dẫn."
  sources:
