- id: REQ-DAT-001
  area: DAT
  statement: "Trước khi bật AI cho một tenant phải hoàn tất kiểm kê dữ liệu theo chuỗi: inventory nguồn → phân loại (structured, semi-structured, unstructured, streaming, multimodal, derived, master, transactional, reference, historical) → kiểm chất lượng → nguồn sự thật → schema/hợp đồng dữ liệu → chuẩn hoá → quyền → validation → chỉ khi đó mới đến AI/retrieval/tools. Checklist mười mục: inventory toàn bộ nguồn; phân loại; nguồn sự thật; chủ sở hữu từng dataset; metadata phiên bản/độ tươi; schema rõ; luật xử lý xung đột; chính sách quyền; validation; bộ dữ liệu kiểm thử."
  rationale: "[VIDEO] Vào doanh nghiệp phải xem bộ dữ liệu trước và phân loại, không ném hết vào model frontier."
