  statement: "Không có đường nào đưa dữ liệu chưa qua kiểm lúc nạp vào kho facts hoặc index: bộ ghi facts/chunks chỉ chấp nhận bản ghi đã qua chuẩn hoá và kiểm; mô hình mạnh hơn không được dùng để bù cho nguồn sự thật, trùng lặp, phiên bản, dữ liệu cũ, schema sai, báo cáo mâu thuẫn, trường thiếu hay quyền."
  rationale: "[VIDEO] Dữ liệu rác vào model rất mạnh vẫn ra rác; ví dụ cùng một báo cáo tài chính có bốn nguồn bốn con số."
