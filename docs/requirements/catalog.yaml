- id: REQ-OBS-003
  area: OBS
  statement: "Mọi lỗi ra khỏi hệ thống mang đúng một nhãn fault và một nhóm lỗi trong mười tám nhóm; chèn lỗi ở tầng nào cho nhãn/nhóm đúng tầng đó; 'AI trả lời sai' không có trace thì gần như vô dụng để debug."
  rationale: "P10: sai thì tìm tầng sai trước khi đổi model."
