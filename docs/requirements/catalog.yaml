- id: REQ-NRM-016
  area: NRM
  statement: "Chuẩn hoá về một định dạng (CSV, XLSX, API, PDF → JSON) không có nghĩa dữ liệu đã được chuẩn hoá: cùng một lượng nhiên liệu có thể là bản ghi ERP {equipment_id: EX-003, fuel_liters: 4000}, dòng Excel 'Máy 03 | Dầu | 4.000 | L', tin nhắn 'con máy xúc 03 sáng lấy 4k dầu' và dòng kho 'M03 | DIESEL | 4 | m3'; đường chuẩn hoá đầy đủ: nguồn thô → parse định dạng → ánh xạ schema nguồn → chuẩn hoá kiểu → chuẩn hoá đơn vị → nhận dạng thực thể → ánh xạ ngữ nghĩa → kiểm → mô hình miền chuẩn (FuelIssue gồm tenant_id, project_id, equipment_id, material, quantity, unit, event_time, source, source_record_id, confidence, provenance); canonical format không quan trọng bằng canonical semantics."
  rationale: "Bốn biểu diễn khác nhau của cùng một sự kiện nhiên liệu."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Và chuyện “nhiều format → quy chuẩn về một cái” chính là một bài toán lớn", lines: "48-127"}
  applies_to: [data/normalization, data/ingestion, data/sourceoftruth]
  phase: MVP
  verification: {kind: test, ref: "bốn biểu diễn trên (ERP, Excel, tin nhắn, kho m3) cùng ra một FuelIssue đúng trường; từng chặng của đường chuẩn hoá có test riêng"}
  note: null
- id: REQ-EVL-023
  area: EVL
  statement: "Kim tự tháp bằng chứng của EAIS gồm bảy tầng: unit test → integration test → bộ kịch bản sinh tự động → dữ liệu bẩn/xung đột/trôi schema → chaos/lỗi/phục hồi → scale/load/soak → production-like replay/shadow; mock vẫn quan trọng nhưng nằm ở tầng dưới; chỉ vài chục ca mock cộng DB sạch cho thấy 'kiến trúc chạy trên ví dụ do chính mình chuẩn bị', tức tự ra đề dễ rồi tự chấm."
  rationale: "Chống đúng lỗi 'người chấm = người làm' trong CLAUDE.md."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Case testing của bạn phải thay đổi theo phát hiện này", lines: "128-173"}
  applies_to: [evals, simulations]
  phase: MVP
  verification: {kind: review, ref: "tài liệu proof-harness mô tả bảy tầng và tầng nào đã có/chưa có; báo cáo phát hành nêu tầng bằng chứng đạt được"}
  note: null
- id: REQ-EVL-024
  area: EVL
  statement: "Dữ liệu kiểm thử chia năm cấp: D0 fixture viết tay (logic cơ bản, ví dụ 20 bản ghi nhiên liệu); D1 fixture bẩn (4k, 4.000 L, 4,000L, 4 m3, thiếu đơn vị, thiết bị lạ, trùng, nguồn xung đột, ngày sai); D2 bộ sinh tự động (độ rộng và khối lượng); D3 production-shaped (độ thực); D4 dữ liệu thật ẩn danh/replay nếu được phép; MVP bắt buộc D0 và D1; báo cáo ghi rõ mỗi kết quả chạy trên cấp nào."
  rationale: "Mỗi cấp chứng minh một thứ khác nhau."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Case testing của bạn phải thay đổi theo phát hiện này › Tôi sẽ chia test data EAIS thành 5 cấp", lines: "174-220"}
  applies_to: [evals, simulations]
  phase: MVP
  verification: {kind: test, ref: "bộ ca ghi cấp dữ liệu (D0–D4); báo cáo eval gộp theo cấp; D1 phủ tất cả biến thể nêu trên"}
  note: null
- id: REQ-EVL-025
  area: EVL
  statement: "Cấp D2–D3 ở V1: bộ sinh có seed tạo thế giới nhất quán về nghiệp vụ (không phải hàng triệu dòng ngẫu nhiên) và dữ liệu production-shaped; kết quả đóng băng thành tệp; mọi tỉ lệ lỗi chèn là tham số mô phỏng, không được trình bày như tỉ lệ doanh nghiệp thật."
  rationale: "10 triệu dòng rác ngẫu nhiên không đại diện doanh nghiệp."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Đây là lý do `simulations/` trong architecture của bạn rất đáng giá", lines: "221-255"}
    - {file: brief-07-data-realism-proof.md, section: "Ví dụ Construction simulation", lines: "256-312"}
  applies_to: [simulations, evals]
  phase: V1
  verification: {kind: test, ref: "lệnh simulate với seed cố định cho cùng đầu ra; kiểm quan hệ hợp lệ giữa thực thể; báo cáo ghi tỉ lệ lỗi là tham số"}
  note: null
- id: REQ-EVL-026
  area: EVL
  statement: "Cấp D4 (dữ liệu thật ẩn danh hoặc replay) chỉ dùng khi có phép hợp pháp, đã ẩn danh và được chủ dữ liệu cho phép; trước đó không tuyên bố độ tin cậy production."
  rationale: "Production confidence cần dữ liệu thật nhưng phải hợp pháp."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Case testing của bạn phải thay đổi theo phát hiện này › Tôi sẽ chia test data EAIS thành 5 cấp", lines: "174-220"}
    - {file: brief-09-blind-spot-audit-29.md, section: "26. 🔴 Synthetic data cũng có thể tạo “synthetic illusion”", lines: "1169-1216"}
  applies_to: [evals, simulations]
  phase: GATED
  verification: {kind: review, ref: "ADR cho phép dùng dữ liệu thật ẩn danh nêu căn cứ pháp lý, phạm vi, ẩn danh"}
  note: "Điều kiện mở cổng: có thoả thuận/chấp thuận hợp pháp của chủ dữ liệu, đã ẩn danh theo quy trình được duyệt; mặc định đóng và repo chỉ chứa dữ liệu giả lập."
- id: REQ-EVL-027
  area: EVL
  statement: "Thư mục simulations/ là một phần của EAIS Proof System: construction có generator, schemas, scenarios, dirty_data, conflicts, drift, scale_profiles; sports có generator, providers, events, duplicates, corrections, out_of_order, scale_profiles; generator tạo thế giới nhất quán về nghiệp vụ, không chỉ hàng ngẫu nhiên."
  rationale: "simulations/ + evals/ thành Proof Harness, không chỉ thư mục test phụ."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Đây là lý do `simulations/` trong architecture của bạn rất đáng giá", lines: "221-255"}
    - {file: brief-08-rag-vs-eais-v0-v4.md, section: "Sports tenant cũng không phải để làm chatbot thể thao › Vì vậy tôi sẽ mô tả quá trình tiến hóa dự án của bạn như này", lines: "425-440"}
    - {file: brief-07-data-realism-proof.md, section: "Vậy phát hiện của bạn làm roadmap thay đổi thế nào?", lines: "564-626"}
  applies_to: [simulations, evals]
  phase: MVP
  verification: {kind: review, ref: "cấu trúc simulations/ khớp danh sách thư mục con; mỗi thư mục có đầu ra đóng băng hoặc ghi lý do hoãn"}
  note: null
- id: REQ-EVL-028
  area: EVL
  statement: "Thế giới mô phỏng construction cỡ V1: một công ty với khoảng 50 dự án, 2.000 nhân viên, 1.000 thiết bị, 300 nhà cung cấp, 200 nhà thầu phụ; mỗi dự án có hợp đồng, BOQ, WBS, thiết bị, vật tư, báo cáo ngày, giao dịch nhiên liệu, kiểm tra, RFI, change order, thanh toán với quan hệ hợp lệ; sau đó chèn lỗi có chủ ý (ví dụ 0,5% trùng, 1% thiếu trường, 0,3% đơn vị sai, 2% bí danh, 0,1% xung đột chéo nguồn, 5% sự kiện muộn, 0,2% phiên bản tài liệu cũ) như tham số mô phỏng."
  rationale: "Business-consistent world rồi mới inject lỗi."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Ví dụ Construction simulation", lines: "256-312"}
  applies_to: [simulations, tenants/construction]
  phase: V1
  verification: {kind: test, ref: "bộ sinh với seed tạo đúng số lượng/quan hệ và tỉ lệ lỗi chèn đo lại được từ đầu ra"}
  note: null
- id: REQ-EVL-029
  area: EVL
  statement: "Thế giới mô phỏng sports cỡ V1: khoảng 20 provider, 500 giải, 10.000 đội, 100.000 cầu thủ, 1.000.000 lượt trận, 100.000.000 sự kiện; quan trọng hơn khối lượng là biến thể (cùng một đội có ba cách ghi giữa ba provider; cùng một bàn thắng có ba cách ghi thời điểm 45+2, phút 47, 45:00 + bù 2) và chuỗi sự kiện (đến → trùng → sửa → sự kiện cũ đến muộn → provider rút lại) mà canonical state phải đúng."
  rationale: "Sports thử kiến trúc bằng thứ tự, trùng, sửa và rút lại."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Sports còn test scale rất hay", lines: "313-369"}
  applies_to: [simulations, tenants/sports, domain/sportsevents]
  phase: V1
  verification: {kind: test, ref: "bộ sinh sports với seed; chuỗi sự kiện trùng/sửa/muộn/rút lại cho canonical state đúng"}
  note: null
- id: REQ-EVL-030
  area: EVL
  statement: "Tách hai câu hỏi: tính đúng (100 bản ghi → kết quả đúng?) và khả năng mở rộng (10 triệu bản ghi → vẫn đúng? độ trễ? RAM? CPU? kết nối DB? kích thước index? thông lượng? phục hồi?); không dùng load test để chứng minh tính đúng ngữ nghĩa và không dùng unit test để tuyên bố khả năng mở rộng."
  rationale: "Hai loại bằng chứng khác nhau, không thay thế nhau."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Và cần tách 2 câu hỏi", lines: "370-400"}
    - {file: brief-07-data-realism-proof.md, section: "Và cần tách 2 câu hỏi › Scalability", lines: "381-400"}
  applies_to: [evals]
  phase: MVP
  verification: {kind: review, ref: "báo cáo phân biệt cột 'tính đúng' và cột 'mở rộng'; tuyên bố scale không dựa trên unit test"}
  note: null
- id: REQ-EVL-031
  area: EVL
  statement: "Hồ sơ scale mô tả cả cardinality, không chỉ số dòng: số tenant, dự án/tenant, người dùng/tenant, thiết bị, thực thể, bí danh, facts, tài liệu, chunk, sự kiện/giây (bình thường và đỉnh); 10 triệu bản ghi cho 1 tenant khác hẳn 10 triệu cho 1.000 tenant với 100.000 dự án và 50 triệu bí danh; hồ sơ là mục tiêu mô phỏng chứ không phải cam kết năng lực production."
  rationale: "Kiến trúc có thể chết vì cardinality cao chứ không phải vì khối lượng thô."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Tôi sẽ thêm một trục nữa: Cardinality", lines: "401-455"}
  applies_to: [simulations, evals]
  phase: V1
  verification: {kind: eval, ref: "tệp scale_profiles (yaml) khai các trục cardinality; kết quả đo kèm profile; ghi 'mục tiêu mô phỏng' (chưa đo)"}
  note: null
- id: REQ-DAT-009
  area: DAT
  statement: "Đường chuẩn hoá dữ liệu là một subsystem có eval riêng cho từng mũi tên: thế giới ngoài (ERP, Excel, CSV, API, PDF, tin nhắn, provider) → RAW/bronze → parse → ánh xạ nguồn → chuẩn hoá → nhận dạng thực thể → canonicalize → kiểm → hợp lệ (→ fact/event → thẩm quyền nguồn → hoà giải) hoặc bị từ chối (→ quarantine); không chỉ kiểm câu trả lời cuối của chatbot."
  rationale: "Mỗi chặng sai theo cách riêng nên phải đo riêng."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Quan trọng hơn nữa: test transformation pipeline", lines: "456-514"}
  applies_to: [data/ingestion, data/normalization, data/sourceoftruth, evals]
  phase: MVP
  verification: {kind: test, ref: "mỗi chặng của pipeline có bộ ca đầu vào/đầu ra; bản ghi bị từ chối vào quarantine kèm lý do; eval riêng theo chặng"}
  note: null
- id: REQ-NRM-017
  area: NRM
  statement: "Thuộc tính biến hình (metamorphic property): biểu diễn thay đổi nhưng ngữ nghĩa không đổi thì kết quả canonical phải tương đương; ví dụ 'EX-03, 4,000 L, 19/10/2026', 'Máy 03 - 4k dầu - hôm nay' và JSON {machine: EX003, diesel_m3: 4} đều ra equipment EX-003, metric fuel_issue, quantity 4000 L, date 2026-10-19."
  rationale: "Mạnh hơn nhiều so với ba assert happy-case rời rạc."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Ví dụ một test cực giá trị", lines: "515-563"}
  applies_to: [data/normalization, evals]
  phase: MVP
  verification: {kind: test, ref: "test metamorphic: sinh biến thể biểu diễn của cùng một bản ghi và khẳng định canonical bằng nhau; chạy trên bộ NRM-V"}
  note: null
- id: REQ-EVL-032
  area: EVL
  statement: "EAIS không được tuyên bố 'enterprise-ready' chỉ dựa trên fixture viết tay, mock database và happy path; chỉ được tuyên bố những gì đã chứng minh (logic thành phần đã kiểm, canonicalization đã kiểm trên N ca, cô lập tenant đã kiểm) và phải ghi rõ chưa chứng minh (chưa scale, chưa production realism, chưa phục hồi); mỗi tuyên bố mang nhãn Đã chứng minh / Mới nghi / Chưa đo; nếu cuối cùng chỉ còn 'chat → mock DB/RAG → answer' với vài happy case thì đổi tên thành EAIS không làm nó thành Enterprise AI System."
  rationale: "Proof Harness là cách kiểm chứng lời hứa multi-tenant Enterprise AI Systems Platform."
  sources:
    - {file: brief-07-data-realism-proof.md, section: "Vậy phát hiện của bạn làm roadmap thay đổi thế nào?", lines: "564-626"}
    - {file: brief-08-rag-vs-eais-v0-v4.md, section: "Sports tenant cũng không phải để làm chatbot thể thao › Vì vậy tôi sẽ mô tả quá trình tiến hóa dự án của bạn như này", lines: "425-440"}
  applies_to: [evals, docs]
  phase: MVP
  verification: {kind: review, ref: "báo cáo phát hành có bảng 'đã chứng minh/mới nghi/chưa đo' theo bảy tầng proof; PR nêu tuyên bố vượt bằng chứng bị trả lại"}
  note: null
- id: REQ-MND-054
  area: MND
  statement: "Chat là interface, không phải architecture: cùng một câu hỏi người dùng ('Tháng này máy EX-03 dùng bao nhiêu dầu?') không mặc định chạy 'Question → RAG → Model → Answer' mà được coi là một business problem cần phân loại (ai hỏi, tenant/project nào, EX-03 là thực thể nào, 'tháng này' là khoảng nào, có quyền không, exact metric → SQL route → facts authoritative → SUM → kiểm → trả lời), có thể không gọi cả RAG lẫn LLM; vì vậy case study RAG (retrieve đúng không, context tốt không, model đúng không) và case study EAIS (input bẩn, thực thể mơ hồ, dữ liệu ở đâu, nguồn nào authoritative, conflict, quyền, route, evidence, validate, trace) kiểm hai thứ khác nhau."
  rationale: "EAIS thay đổi thứ cần chứng minh: từ 'AI trả lời đúng' sang 'hệ thống giải đúng business problem'."
  sources:
    - {file: brief-08-rag-vs-eais-v0-v4.md, section: "RAG ban đầu của bạn", lines: "3-76"}
    - {file: brief-08-rag-vs-eais-v0-v4.md, section: "Cùng là “hỏi đáp”, nhưng hai thứ đang test khác nhau", lines: "77-126"}
    - {file: brief-08-rag-vs-eais-v0-v4.md, section: "Sports tenant cũng không phải để làm chatbot thể thao › Vì vậy tôi sẽ mô tả quá trình tiến hóa dự án của bạn như này", lines: "425-440"}
  applies_to: [docs, evals]
  phase: MVP
  verification: {kind: review, ref: "tài liệu so sánh hai loại case study; bộ ca EAIS có cột kiểm các chặng thay vì chỉ 'trả lời đúng'"}
  note: null
- id: REQ-CLR-009
  area: CLR
  statement: "Câu hỏi có thể mơ hồ về ngữ nghĩa chỉ số: 'Dự án A hôm qua cấp 4k dầu đúng không?' khi site nhắn ≈ 4.000 L, kho xuất 3.850 L, ERP 3.900 L, hoá đơn 4.100 L, cảm biến tiêu thụ 3.782 L thì '4k' là lượng xuất, nhận, báo cáo, tiêu thụ hay hoá đơn chưa rõ; hệ thống phải phát hiện mơ hồ ngữ nghĩa cộng xung đột nguồn và hỏi lại kèm ứng viên (ví dụ 'Phiếu kho ghi lượng xuất 3.850 L, báo cáo hiện trường ước khoảng 4.000 L; bạn muốn kiểm tra lượng xuất kho hay lượng tiêu thụ thực tế?'), không gật bừa 'khoảng 4.000 L'."
  rationale: "RAG mạnh hơn chưa chắc chữa được; đây là business correctness."
  sources:
    - {file: brief-08-rag-vs-eais-v0-v4.md, section: "Ví dụ sẽ thấy ngay sự khác biệt", lines: "127-190"}
  applies_to: [reliability/clarification, data/sourceoftruth, evals]
  phase: MVP
  verification: {kind: test, ref: "ca CON-T: câu hỏi '4k dầu đúng không' với năm giá trị khác chỉ số → CLARIFICATION nêu ứng viên theo chỉ số; không có con số được khẳng định"}
  note: null
- id: REQ-EVL-033
  area: EVL
  statement: "Case tiến hoá theo thang độ khó: happy → input bẩn → nhiều định dạng → nhiều nguồn → mơ hồ ngữ nghĩa → fact xung đột → dữ liệu thiếu → dữ liệu cũ → sai quyền → thử chéo tenant → trôi schema → khối lượng lớn → lỗi từng phần → phục hồi; mỗi ca trong bộ kiểm thử mang nhãn bậc trên thang; mục tiêu chứng minh 'hệ thống biến dữ liệu doanh nghiệp lộn xộn thành câu trả lời/hành động kiểm chứng được', không phải 'chatbot trả lời được'."
  rationale: "Mock DB một máy một con số chưa khác demo RAG về mức chứng minh."
  sources:
    - {file: brief-08-rag-vs-eais-v0-v4.md, section: "Đây cũng là lý do phát hiện vừa rồi của bạn về data scale rất quan trọng", lines: "191-254"}
  applies_to: [evals, tenants/construction, tenants/sports]
  phase: MVP
  verification: {kind: test, ref: "bộ ca có trường bậc (tier) 14 mức; báo cáo phân bố theo bậc; bậc không có ca phải ghi lý do"}
  note: null
- id: REQ-BIZ-021
  area: BIZ
  statement: "Construction đóng vai máy phá EAIS Core chứ không phải chatbot hỏi đáp ngành xây dựng: ca mẫu 'máy 03 sáng lấy 2k, chiều lấy thêm 2k' + warehouse.xlsx EX003 = 3.850 L + ERP Equipment_0003 = 3.900 L + daily_report.pdf '~4 khối' + câu hỏi 'Hôm nay máy 03 thực tế nhận bao nhiêu?' phải được chạy để xem chết ở chặng nào (parsing, normalization, đổi đơn vị, nhận dạng thực thể, time resolution, thẩm quyền nguồn, hoà giải, router, context, validation) và chẩn đoán theo chặng: 'máy 03' ≠ EX003 → thiếu/yếu entity resolution; 4 khối → 4 L → lỗi normalization; lấy PDF làm sự thật thay vì kho → lỗi source authority; model tự chọn 4.000 vì thấy xuất hiện nhiều → lỗi kiến trúc/điều khiển."
  rationale: "Failure-driven case study."
  sources:
    - {file: brief-08-rag-vs-eais-v0-v4.md, section: "Và đây mới là chỗ Construction case study có giá trị", lines: "255-324"}
  applies_to: [tenants/construction, evals]
  phase: MVP
  verification: {kind: test, ref: "kịch bản CON-S/CON-T cho ca trên với kỳ vọng theo chặng; mỗi lỗi được gán nhóm lỗi đúng"}
  note: null
- id: REQ-MND-055
  area: MND
  statement: "Hành trình tiến hoá dự án: V0 LLM ('model trả lời được không?'), V1 RAG ('model có đúng knowledge không?'), V2 Production RAG (ingestion, chunking, retrieval, reranking, citation: 'knowledge pipeline có đáng tin không?'), V3 EAIS (business, data, source of truth, normalization, entity resolution, router, SQL, RAG, context, model, tools, validation, permission, tenant, eval: 'business outcome có đáng tin không?'), V4 EAIS PROOF (dirty data, nhiều định dạng, nhiều nguồn, conflict, scale, failure injection, cross-tenant, load, recovery: 'có BẰNG CHỨNG rằng nó đáng tin trong điều kiện gần doanh nghiệp thật không?'); bản V0–V4 này khác cách đánh số V1–V4 của brief 04 nhưng cùng hướng."
  rationale: "Mảnh vừa phát hiện (V4) là bằng chứng ở điều kiện gần thực tế."
  sources:
    - {file: brief-08-rag-vs-eais-v0-v4.md, section: "Sports tenant cũng không phải để làm chatbot thể thao › Vì vậy tôi sẽ mô tả quá trình tiến hóa dự án của bạn như này", lines: "369-440"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "docs/06-roadmap nêu mỗi bậc V0–V4 cùng câu hỏi đặc trưng và bậc dự án đang ở; ghi chú quy ước đánh số khác của brief 04"}
  note: null
- id: REQ-SOT-012
  area: SOT
  statement: "Canonicalize ý nghĩa nghiệp vụ, không chỉ dữ liệu: các giá trị cùng thiết bị nhưng khác ngữ nghĩa (kho xuất 4.000 L, site nhận 3.900 L, cảm biến tiêu thụ 3.720 L, kế toán thanh toán 4.100 L) có thể đều đúng nên không được gộp sớm thành 'fuel = xxxx'; pack phân biệt loại như FuelIssued, FuelDelivered, FuelReceived, FuelConsumed, FuelReported, FuelEstimated, FuelBilled, FuelAdjusted; đường xử lý: RAW → chuẩn hoá biểu diễn → nhận dạng thực thể → DIỄN GIẢI NGỮ NGHĨA → sự kiện/quan sát nghiệp vụ → phân loại fact → thẩm quyền → hoà giải; Source of Truth không được thành 'nhiều giá trị → chọn giá trị authoritative'."
  rationale: "Nhiều observation → xác định chúng nói về business fact nào → rồi mới reconcile."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "1. 🔴 Bạn đang canonicalize data, nhưng chưa canonicalize business meaning", lines: "12-108"}
  applies_to: [data/sourceoftruth, data/normalization, core/tenant]
  phase: MVP
  verification: {kind: test, ref: "pack khai tập chỉ số ngữ nghĩa; test: bốn giá trị khác ngữ nghĩa không bị gộp hay loại; chặng diễn giải ngữ nghĩa có test riêng"}
  note: null
- id: REQ-ENT-010
  area: ENT
  statement: "Mô hình ngữ nghĩa/ontology doanh nghiệp có quan hệ chứ không chỉ entity + metric: Project có Contract, WBS, WorkPackage, Equipment, Material, Subcontractor; Equipment được giao cho Project, do Employee vận hành, nhận FuelIssue, sinh Telemetry, có MaintenanceEvent; và khái niệm khác nhau không được trộn: Invoice ≠ Payment ≠ Payment Certificate ≠ Cost ≠ Commitment ≠ Accrual; nếu thiếu thì chỉ có canonical JSON mà không có canonical business meaning (khác nhau giữa chuẩn hoá dữ liệu và mô hình thông tin doanh nghiệp)."
  rationale: "lexicon/entities/metrics chưa đủ cho quan hệ và ngữ nghĩa nghiệp vụ."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "2. 🔴 EAIS chưa có Enterprise Ontology / Semantic Model đủ mạnh", lines: "109-162"}
  applies_to: [core/tenant, data/entityresolution, tenants/construction]
  phase: V1
  verification: {kind: test, ref: "pack khai quan hệ giữa thực thể và các khái niệm tài chính phân biệt; test truy vấn quan hệ và từ chối trộn Invoice với Payment"}
  note: null
- id: REQ-SOT-013
  area: SOT
  statement: "Thời gian đa chiều (bitemporal): event_time, observed_time, effective_from, effective_to, recorded_at, ingested_at, corrected_at; phân biệt câu hỏi 'tại ngày 10/3 hệ thống đã biết gì?' với 'điều gì được coi là có hiệu lực pháp lý cho ngày 10/3?' (ví dụ hợp đồng v1 hiệu lực 1/1, phụ lục ký 20/3 hiệu lực từ 1/3, hệ thống nạp 25/3); sports cũng cần (sự kiện xảy ra 20:01:03, provider gửi 20:01:05, EAIS nhận 20:01:08, correction đến 20:03:00); một ObservedAt không đủ."
  rationale: "Truy vấn lịch sử phải đúng theo thời điểm biết và thời điểm hiệu lực."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "3. 🔴 Time hiện đang quá đơn giản", lines: "163-223"}
  applies_to: [data/sourceoftruth, db/migrations, domain/sportsevents]
  phase: V1
  verification: {kind: test, ref: "fixture hợp đồng + phụ lục: truy vấn 'as of known' và 'as of effective' cho kết quả khác nhau đúng kỳ vọng; sports correction giữ đủ mốc thời gian"}
  note: null
- id: REQ-ENT-011
  area: ENT
  statement: "Vòng đời định danh: danh tính chuẩn + bí danh + ID ngoài + khoảng hiệu lực + gộp (merge) + tách (split) + chuyển hướng (redirect) + danh tính lịch sử; các tình huống: EX-03 đổi dự án hoặc đổi mã nội bộ, nhà cung cấp sáp nhập, nhân viên đổi phòng, cầu thủ chuyển đội, giải đổi tên, provider đổi ID ngoài; truy vấn lịch sử phải trả đúng thực thể tại thời điểm quá khứ chứ không chỉ thực thể hiện tại."
  rationale: "Identity resolution mới giải 'entity nào?', chưa giải identity lifecycle."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "4. 🔴 Identity Resolution mới giải “entity nào?”, chưa giải identity lifecycle", lines: "224-275"}
  applies_to: [data/entityresolution, db/migrations]
  phase: V1
  verification: {kind: test, ref: "fixture thiết bị đổi dự án/mã, cầu thủ chuyển đội, giải đổi tên; truy vấn theo ngày trả danh tính đúng lúc đó; merge/split/redirect có test"}
  note: null
- id: REQ-WFL-020
  area: WFL
  statement: "Thế giới đầu vào doanh nghiệp gồm QUERY ('chuyện gì đã xảy ra?'), COMMAND ('làm việc này'), EVENT ('việc này đã xảy ra'), WORKFLOW ('đưa quy trình từ A sang B'), DECISION ('có nên duyệt không?'), NOTIFICATION ('báo các bên khi có thay đổi'); luồng hợp nhất INPUT → {QUERY, COMMAND, EVENT} → DECISION → WORKFLOW → ACTION; model chỉ xuất hiện ở nút nào cần trí tuệ xác suất; MVP có bốn loại đầu, DECISION và NOTIFICATION được khai báo trong pack (guard/luật so sánh và kênh thông báo theo tên) ở V1."
  rationale: "Query pipeline mạnh nhưng Command/Event/Workflow chưa first-class; có thể thành thay đổi kiến trúc V4."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "5. 🔴 Query pipeline mạnh, nhưng Command/Event/Workflow vẫn chưa phải first-class", lines: "276-329"}
  applies_to: [core/pipeline, execution/workflows, execution/triggers]
  phase: V1
  verification: {kind: test, ref: "ca DECISION (duyệt/không duyệt theo guard) và NOTIFICATION (báo đúng người khi đổi trạng thái); mỗi ca có audit"}
  note: null
- id: REQ-WFL-021
  area: WFL
  statement: "Ranh giới giao dịch và mô hình nhất quán phải được nêu rõ: tạo Purchase Order là validate → giữ ngân sách → tạo PO → cập nhật workflow → ghi audit → phát sự kiện; phải trả lời các tình huống DB commit thành công nhưng phát sự kiện lỗi, gọi API nhà cung cấp thành công nhưng cập nhật DB lỗi; lớp vấn đề gồm transaction boundary, atomicity, outbox, inbox, idempotency, at-least-once, trùng giao nhận, nhất quán cuối cùng, bù trừ (compensation), saga; không có nghĩa thêm Kafka ngay vì cổng capability vẫn giữ."
  rationale: "Biểu đồ kiến trúc đẹp dễ bỏ sót transaction boundary."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "6. 🔴 Thiếu transaction boundary và consistency model", lines: "330-391"}
  applies_to: [execution/workflows, platform/store, execution/tools]
  phase: V1
  verification: {kind: test, ref: "failure injection hai chiều (commit ✓/publish ✗; API ✓/DB ✗): kỳ vọng không có tác dụng kép, có bù trừ hoặc đối soát, audit đủ"}
  note: null
- id: REQ-TOL-013
  area: TOL
  statement: "Retry có thể gây thiệt hại nghiệp vụ: với create invoice, send payment, create purchase order, approve change order, khi tác dụng phụ ngoài đã thành công nhưng phản hồi bị mất và EAIS tưởng thất bại rồi retry, hệ thống không được thực thi lần hai (khoá idempotency gửi cho bên ngoài hoặc tra cứu trạng thái trước khi thử lại); đây là ca kiểm bắt buộc cho mọi tool ghi."
  rationale: "Retry HTTP GET thường ổn; retry hành động ghi thì không."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "7. 🔴 Retry có thể gây business damage", lines: "392-428"}
  applies_to: [execution/tools, execution/workflows]
  phase: V1
  verification: {kind: test, ref: "fixture bên ngoài giả: tác dụng phụ thành công, phản hồi mất → retry không tạo bản ghi thứ hai; đếm tác dụng phụ = 1"}
  note: null
- id: REQ-DAT-010
  area: DAT
  statement: "Quyền sở hữu dữ liệu tách khỏi thẩm quyền nguồn: ngoài 'ERP mạnh hơn chat' phải biết ai chịu trách nhiệm sửa dữ liệu sai, ai duyệt sửa, ai sở hữu schema, ai xử lý quarantine, ai giải quyết conflict; mỗi dataset có Data Owner, Data Steward, Producer, Consumer, Authority, Quality SLA, correction workflow; xung đột không được nằm mãi — hệ thống đo tuổi hàng đợi xung đột và giao việc cho người có trách nhiệm."
  rationale: "Nếu chỉ phát hiện SOURCE_CONFLICT mà không vận hành thì mới 'phát hiện vấn đề'."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "8. 🟠 Bạn có Source Authority nhưng chưa đủ Data Ownership", lines: "429-469"}
  applies_to: [data/sourceoftruth, execution/workflows, core/tenant]
  phase: V1
  verification: {kind: test, ref: "fixture xung đột: tạo human task cho steward, có hạn; số xung đột chưa xử lý quá 24 giờ được báo cáo"}
  note: null
- id: REQ-DAT-011
  area: DAT
  statement: "Chất lượng dữ liệu có SLO đo được: completeness, validity, consistency, uniqueness, freshness, accuracy proxy, referential integrity, schema conformity; ví dụ báo cáo 'fuel.quantity completeness = 99,97%', 'equipment resolution = 99,2%', 'unknown unit = 0,08%', 'source conflicts unresolved > 24h = 37'; không có chỉ số này thì 'data pipeline hoạt động' vẫn chỉ là lời khai."
  rationale: "Mở rộng REQ chất lượng dữ liệu thành SLO có ngưỡng và cảnh báo."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "9. 🟠 Data Quality chưa có SLO", lines: "470-503"}
  applies_to: [evals, data/ingestion, observability/traces]
  phase: V1
  verification: {kind: eval, ref: "báo cáo chất lượng dữ liệu theo tám chiều trên dữ liệu mô phỏng; ngưỡng SLO đặt sau lần đo đầu (chưa đo)"}
  note: null
- id: REQ-DAT-012
  area: DAT
  statement: "Tiến hoá schema được stress-test, không chỉ nhận diện phiên bản: nguồn đổi {fuel: 4000} thành {fuel: {value: 4000, unit: L}} hoặc ERP đổi equipment_code thành asset_code; phải có phiên bản schema, migration, tương thích ngược và xuôi, trường lạ, trường bị bỏ (deprecated), phát lại dữ liệu cũ; pack_version là nền tốt nhưng cần test tiến hoá chứ không chỉ định danh phiên bản."
  rationale: "Schema evolution là rủi ro nhìn thấy muộn."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "10. 🟠 Schema evolution chưa được stress-test", lines: "504-554"}
  applies_to: [data/ingestion, core/tenant, evals]
  phase: V1
  verification: {kind: test, ref: "fixture đổi schema (lồng giá trị/đổi tên cột/trường lạ): nạp được qua ánh xạ mới, phát lại dữ liệu cũ cho cùng kết quả"}
  note: null
- id: REQ-OBS-012
  area: OBS
  statement: "Tái lập toàn bộ thực thi (execution reproducibility): trace của một request phải trả lời nó dùng phiên bản mã nào, pack nào, schema nào, model nào, prompt nào, chỉ mục truy xuất nào, tài liệu nào (phiên bản), tool nào; phát lại request cũ với pack mới có thể ra kết quả khác nên phải so sánh được; pack_version chỉ là bước đầu."
  rationale: "Pack v17 → v18 đổi luật chuẩn hoá; replay request cũ cho kết quả khác."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "11. 🟠 Pack version tạo ra một vấn đề mới: reproducibility", lines: "555-599"}
  applies_to: [observability/traces, core/tenant]
  phase: V1
  verification: {kind: test, ref: "test: trace chứa đủ 8 loại phiên bản; replay với phiên bản ghi trong trace cho cùng kết quả; replay với pack mới nêu rõ khác biệt"}
  note: null
- id: REQ-RAG-025
  area: RAG
  statement: "Độ tươi của chỉ mục RAG không đồng nghĩa độ tươi của source of truth: hợp đồng v3 đã là hiện hành trong DB nhưng vector index còn v2 trong khoảng chín mươi giây thì database truth = v3 còn retrieval truth = v2; phải có fault injection cho chuỗi parse ✓ → DB ✓ → embedding ✓ → vector write ✗ → publish ? và ngược lại; truy xuất kiểm phiên bản tài liệu với nguồn sự thật hoặc ghi rõ độ cũ."
  rationale: "Cross-system consistency problem."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "12. 🟠 RAG index freshness chưa đồng nghĩa Source-of-Truth freshness", lines: "600-648"}
  applies_to: [intelligence/rag, data/sourceoftruth, evals]
  phase: V1
  verification: {kind: test, ref: "fault injection từng bước công bố; kỳ vọng không có thời điểm chỉ mục trả bản cũ mà không cảnh báo; chỉ số độ trễ đồng bộ"}
  note: null
- id: REQ-SEC-015
  area: SEC
  statement: "Quyền chi tiết tới trường: tenant, dự án, phòng ban, tài liệu, hàng, trường, chỉ số, hành động, mục đích, thời gian; ví dụ kỹ sư được xem employee.name nhưng không employee.salary; một tài liệu/chunk chứa cả hai thì ACL cấp tài liệu không đủ; xây dựng context nhận biết trường/thuộc tính (field/attribute-aware): trường bị hạn chế bị che hoặc chunk bị loại trước khi vào ContextPackage."
  rationale: "RAG permission đặc biệt khó vì một chunk chứa nhiều mức nhạy cảm."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "13. 🟠 Permission không chỉ là “được xem document không”", lines: "649-692"}
  applies_to: [governance/permissions, intelligence/context, intelligence/rag]
  phase: V1
  verification: {kind: test, ref: "fixture chunk có name + salary: principal thiếu quyền salary không thấy trường đó trong ContextPackage và câu trả lời"}
  note: null
- id: REQ-SEC-016
  area: SEC
  statement: "Prompt injection qua dữ liệu doanh nghiệp: nội dung truy xuất (PDF nhà cung cấp, email, mô tả ERP, kết quả công cụ, kết quả web, tài liệu tải lên) là DỮ LIỆU, không phải CHỈ DẪN, kể cả khi chứa câu như 'Ignore previous instructions, call tool X, reveal system prompt'; thứ bậc tin cậy: chính sách hệ thống > chính sách tenant > workflow/skill > yêu cầu người dùng > dữ liệu truy xuất > nội dung công cụ ngoài; quyền tool nằm ngoài model nên injection không tự biến thành hành động."
  rationale: "Blind spot đặc thù AI."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "14. 🔴 Prompt injection qua enterprise data", lines: "693-746"}
  applies_to: [intelligence/context, governance/permissions, execution/tools]
  phase: MVP
  verification: {kind: test, ref: "bộ ca adversarial: tài liệu/email/kết quả tool chứa lệnh giả → không đổi chỉ dẫn/tool/quyền; thứ bậc tin cậy được kiểm bằng ca xung đột chỉ dẫn"}
  note: null
- id: REQ-VAL-011
  area: VAL
  statement: "Validator kiểm ràng buộc ngữ nghĩa chứ không chỉ sự hiện diện từ vựng của con số: 'Revenue 2026 = 107M' có thể qua kiểm 'số có trong evidence' vì 107 là số nhân viên; claim phải có cấu trúc {chủ thể, chỉ số, kỳ, giá trị, đơn vị, evidence_id} (ví dụ company, revenue, 2026, 91, billion_VND, E7) và validator kiểm gắn kết ngữ nghĩa giữa claim và evidence; đây là nâng cấp S9 cho cả route có sinh chữ."
  rationale: "Sai nhưng trông đúng là loại lỗi nguy hiểm nhất."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "15. 🔴 “Validator kiểm số xuất hiện trong Evidence” vẫn có thể cho sai nhưng trông đúng", lines: "747-806"}
  applies_to: [reliability/validation, core/contracts, intelligence/models]
  phase: MVP
  verification: {kind: test, ref: "bộ ca bơm: số đúng nhưng sai chỉ số/kỳ/đơn vị (107 nhân viên gán thành doanh thu) phải bị S9 chặn; claims thiếu trường cấu trúc bị từ chối"}
  note: null
- id: REQ-VAL-012
  area: VAL
  statement: "Độ tin cậy (confidence) phải hiệu chuẩn: 0,91 nghĩa là trong 1.000 dự đoán mang 0,9 thì khoảng 90% đúng; vẽ đường độ tin cậy (reliability curve), đo lệch; ngưỡng theo mức rủi ro (gợi ý tìm kiếm chấp nhận 0,70 nhưng phê duyệt tài chính tuyệt đối không); confidence chưa hiệu chuẩn không được dùng làm điều kiện tự động hành động."
  rationale: "Con số confidence không hiệu chuẩn gần như vô dụng."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "16. 🟠 Confidence đang có nhưng chưa có calibration", lines: "807-838"}
  applies_to: [reliability/validation, reliability/clarification, evals]
  phase: V1
  verification: {kind: eval, ref: "đo đường hiệu chuẩn trên bộ ca; ngưỡng theo rủi ro lưu trong pack; chưa đo"}
  note: null
- id: REQ-CLR-010
  area: CLR
  statement: "Kinh tế của human-in-the-loop: không phải mọi ca không chắc đều đẩy cho người (nếu 30% request vào review thì AI có thể đắt hơn làm tay); đo Escalation Rate, Review Time, False Escalation, Missed Escalation, Cost per Review, Queue Age, Business Severity; mục tiêu là AI + phần mềm + người đạt độ tin cậy chấp nhận được với kinh tế hợp lý chứ không phải AI tránh mọi sai lầm."
  rationale: "Human review có chi phí và hàng đợi."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "17. 🟠 Human-in-the-loop chưa có economics", lines: "839-870"}
  applies_to: [reliability/clarification, execution/workflows, evals]
  phase: V1
  verification: {kind: eval, ref: "báo cáo bảy chỉ số review trên bộ ca; ngưỡng đặt sau lần đo đầu (chưa đo)"}
  note: null
- id: REQ-OBS-013
  area: OBS
  statement: "Mô hình chi phí không chỉ token: LLM + embedding + lưu trữ vector + Postgres + parse tài liệu + OCR + mạng + tool/API + review người + xử lý lại + request thất bại + quan sát; chỉ số tốt hơn là Cost per Successful Business Task, không phải Cost per LLM Request."
  rationale: "Chi phí doanh nghiệp rộng hơn bảng giá model."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "18. 🟠 Cost model không chỉ là token cost", lines: "871-916"}
  applies_to: [observability/cost, evals]
  phase: V1
  verification: {kind: eval, ref: "báo cáo chi phí theo mười hai thành phần cho một tác vụ nghiệp vụ thành công (chưa đo)"}
  note: null
- id: REQ-SLA-006
  area: SLA
  statement: "SLA phải là SLA nghiệp vụ nhiều chiều: availability, latency, freshness, correctness, completeness, consistency, recovery; API p95 = 300 ms nghe tốt nhưng nếu độ tươi dữ liệu 6 giờ thì câu hỏi realtime vẫn sai; không có một con số độ trễ đại diện toàn bộ độ tin cậy."
  rationale: "Mở rộng SLO thành đa chiều."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "19. 🟠 SLA cũng phải là business SLA", lines: "917-950"}
  applies_to: [docs, observability/traces]
  phase: PROD
  verification: {kind: review, ref: "tài liệu SLO mỗi tenant có đủ bảy chiều; chiều chưa đo ghi 'chưa đo'"}
  note: null
- id: REQ-SEC-017
  area: SEC
  statement: "Cô lập hàng xóm ồn (noisy neighbor): RLS giải cô lập dữ liệu nhưng tenant A tải 100.000 PDF có thể làm truy vấn tenant B chậm 10 lần mà không lộ dữ liệu; cần giới hạn tốc độ, hạn ngạch, ngân sách đồng thời, ngân sách model, ngân sách nạp, ngân sách lưu trữ, lập lịch công bằng; chưa cần cài ngay nhưng phải có ca kiểm."
  rationale: "Phá SLA mà không rò dữ liệu."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "20. 🟠 Multi-tenancy còn bài toán noisy neighbor", lines: "951-984"}
  applies_to: [governance/tenancy, data/ingestion, observability/cost]
  phase: V1
  verification: {kind: test, ref: "ca tải: tenant A nạp khối lượng lớn → độ trễ truy vấn tenant B trong ngưỡng; hạn ngạch/giới hạn tác động đúng tenant A"}
  note: null
- id: REQ-TEN-016
  area: TEN
  statement: "Việc tiếp nhận tenant mới là một chỉ số: 'thêm Tenant C mất bao nhiêu thay đổi trong Core?'; mục tiêu mẫu core changes = 0, pack mới = có, domain module = có thể, adapter mới = có thể, bộ eval mới = có; nếu mỗi tenant mới phải sửa router, normalizer, context, DB hoặc core contracts thì abstraction chưa thực sự multi-tenant."
  rationale: "Một phép thử mạnh của tenant-agnostic architecture."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "21. 🟠 Tenant onboarding chưa được coi là metric", lines: "985-1018"}
  applies_to: [evals, core/tenant, docs]
  phase: V1
  verification: {kind: review, ref: "báo cáo onboarding tenant ghi số thay đổi core (mục tiêu 0), pack, domain module, adapter, eval; khác 0 phải có ADR"}
  note: null
- id: REQ-MDL-014
  area: MDL
  statement: "Phép thử thay thế model (Model Replaceability Test): đổi Model A sang Model B với cùng hợp đồng và cùng bộ ca; nếu router, tools, parser hay luật nghiệp vụ vỡ thì model đang coupling sâu hơn kiến trúc tuyên bố; MVP chạy bằng hai adapter model (giả/ghi sẵn) qua ModelGateway, V1 với nhà cung cấp thật."
  rationale: "Muốn nói Model ≠ System thì phải chứng minh."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "22. 🔴 Bạn cần test model replacement", lines: "1019-1060"}
  applies_to: [intelligence/models, evals]
  phase: MVP
  verification: {kind: test, ref: "bộ eval chạy với hai adapter model: kết quả route/tool/parser/luật không phụ thuộc adapter; chênh lệch chỉ ở phần diễn đạt"}
  note: null
- id: REQ-RAG-026
  area: RAG
  statement: "Phép thử thay thế truy xuất (Retrieval Replacement Test): đổi Retriever A (BM25) sang B (vector) sang C (hybrid) không làm hợp đồng nghiệp vụ thay đổi; nếu phải viết lại Context Builder thì abstraction KnowledgeRetriever đang rò rỉ."
  rationale: "Chứng minh EAIS chỉ cần Evidence, không biết bên dưới."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "23. 🟠 Tương tự: Retrieval replacement test", lines: "1061-1087"}
  applies_to: [intelligence/rag, intelligence/context, evals]
  phase: MVP
  verification: {kind: test, ref: "ba implementation retriever qua cùng bộ ca: ContextBuilder và S9 không đổi mã; kết quả khác nhau chỉ ở chất lượng truy xuất"}
  note: null
- id: REQ-EVL-034
  area: EVL
  statement: "Bất biến nghiệp vụ (business invariants) được kiểm bằng property-based test: quantity ≥ 0; payment ≤ approved amount; một thiết bị không được giao cho hai dự án đang hoạt động cùng lúc; phiên bản hợp đồng đã duyệt không biến mất âm thầm; workflow đã đóng không quay về DRAFT nếu không có reopen tường minh; thực thể tenant A không tham chiếu dự án tenant B; mạnh hơn nhiều so với 'input X → expected Y'."
  rationale: "Những điều PHẢI luôn đúng của doanh nghiệp."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "24. 🔴 Một blind spot lớn: business invariants", lines: "1088-1129"}
  applies_to: [evals, execution/workflows, governance/tenancy]
  phase: MVP
  verification: {kind: test, ref: "bộ property-based test cho từng bất biến nêu trên với đầu vào sinh ngẫu nhiên có seed; bất biến được khai trong pack/domain module"}
  note: null
- id: REQ-EVL-035
  area: EVL
  statement: "Số lượng ca không phải thước đo: 500 ca cùng một kiểu hỏng vẫn là vanity metric; theo dõi ma trận độ phủ gồm failure dimensions, chuyển trạng thái, biểu diễn dữ liệu, xung đột nguồn, ranh giới quyền, hồ sơ scale, đường phục hồi, bất biến; câu hỏi không phải 'có bao nhiêu ca' mà 'đã phủ những chiều nào'."
  rationale: "Coverage matrix thay cho case count."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "25. 🔴 Case count có thể trở thành vanity metric", lines: "1130-1168"}
  applies_to: [evals]
  phase: MVP
  verification: {kind: eval, ref: "báo cáo ma trận độ phủ tám chiều từ bộ ca; chiều có 0 ca bị đánh dấu"}
  note: null
- id: REQ-EVL-036
  area: EVL
  statement: "Ảo tưởng dữ liệu tổng hợp (synthetic illusion): generator viết theo giả định của kiến trúc rồi kiến trúc pass generator là tự xác nhận; thang bằng chứng phải là: viết tay → sinh bẩn → ca đối kháng do người khác thiết kế độc lập → mẫu production-shaped → mẫu thật ẩn danh (nếu hợp pháp) → replay → shadow/canary; 'synthetic scale' không bằng 'enterprise proven'."
  rationale: "Phiên bản mới của mock illusion."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "26. 🔴 Synthetic data cũng có thể tạo “synthetic illusion”", lines: "1169-1216"}
  applies_to: [evals, simulations]
  phase: V1
  verification: {kind: review, ref: "báo cáo proof nêu ai thiết kế từng bộ ca và bậc thang bằng chứng; bộ ca đối kháng do người/agent độc lập với người viết generator"}
  note: null
- id: REQ-OBS-014
  area: OBS
  statement: "Gỡ lỗi nhân quả (causal debugging): trả lời 'vì sao đầu ra đổi từ hôm qua?' bằng cách so sánh được code, pack, dữ liệu, tài liệu, chỉ mục, model, prompt, thẩm quyền nguồn, ánh xạ thực thể; cần decision provenance và configuration provenance, không chỉ distributed tracing."
  rationale: "Trace chưa chắc đủ để giải thích thay đổi."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "27. 🟠 Observability có trace, nhưng chưa chắc có causal debugging", lines: "1217-1256"}
  applies_to: [observability/traces, core/tenant]
  phase: V1
  verification: {kind: test, ref: "công cụ diff hai lượt cùng đầu vào: liệt kê đúng thành phần đã đổi (pack, tài liệu, chỉ mục, model, prompt...)"}
  note: null
- id: REQ-EVL-037
  area: EVL
  statement: "Chuyển từ RAG cũ phải có baseline: trước khi cắt chuyển, kiểm kê hành vi, golden queries, độ trễ hiện tại, chi phí hiện tại, lỗi đã biết; chạy cùng lưu lượng so kết quả cũ và mới; thiếu baseline thì sau vài tháng nói 'EAIS tốt hơn' mà không chứng minh được tốt hơn cái gì."
  rationale: "Migration từ RAG cũ là một rủi ro riêng."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "28. 🟠 Migration từ RAG cũ vẫn là một rủi ro riêng", lines: "1257-1290"}
  applies_to: [evals, docs]
  phase: V1
  verification: {kind: eval, ref: "so sánh cũ–mới trên cùng bộ golden queries và lưu lượng ghi lại: chất lượng, độ trễ, chi phí (chưa đo)"}
  note: null
- id: REQ-MND-056
  area: MND
  statement: "Chống nguy cơ biến EAIS thành dự án nghiên cứu kiến trúc: khoá một lát cắt dọc tạo giá trị với North Star 'MỘT tenant, MỘT quy trình nghiệp vụ, dữ liệu thực tế, lỗi thật, đầu-cuối, đo được'; ví dụ construction Fuel Reconciliation đi qua CSV, Excel, tin nhắn, ERP, định dạng bẩn, bí danh thực thể, đơn vị, xung đột nguồn, quyền, SQL, hỏi lại, audit, scale, lỗi và phục hồi; một lát cắt sâu giá trị hơn ba mươi module mỗi module 20%; không thêm mười module mới trước khi có lát cắt này."
  rationale: "Rủi ro phi kỹ thuật lớn nhất của dự án."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "29. 🔴 Có nguy cơ EAIS trở thành “architecture research project” thay vì product", lines: "1291-1360"}
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Vì thế Construction case study cũng phải hiểu lại", lines: "256-327"}
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Tôi chỉ chỉnh một điểm quan trọng trong roadmap hiện tại › Nên bức tranh hiện tại của dự án, theo tôi, là:", lines: "412-464"}
  applies_to: [docs, tenants/construction, evals]
  phase: MVP
  verification: {kind: review, ref: "kế hoạch MVP chỉ định Fuel Reconciliation làm lát cắt dọc đầu tiên với danh sách mười lăm yếu tố phải đi qua; module ngoài lát cắt chưa mở"}
  note: null
- id: REQ-MND-057
  area: MND
  statement: "Các điểm mù được xếp mức ưu tiên: P0 gồm ngữ nghĩa nghiệp vụ/ontology, đúng đắn theo thời gian, Query → Command/Event/Workflow, giao dịch/nhất quán, prompt injection/ngữ cảnh không đáng tin, validation claim ngữ nghĩa, bất biến nghiệp vụ, tính thực của bằng chứng (synthetic illusion); P1 gồm vòng đời định danh, quyền sở hữu/stewardship dữ liệu, SLO chất lượng dữ liệu, tiến hoá schema, tái lập/provenance phiên bản, nhất quán chỉ mục–nguồn, quyền chi tiết, hiệu chuẩn confidence, kinh tế review người, chi phí/SLA nghiệp vụ, cô lập hàng xóm ồn, phép thử onboarding tenant, thay thế model/retriever, quan sát nhân quả, baseline migration; và rủi ro sản phẩm: kiến trúc không có lát cắt nghiệp vụ dọc; mỗi mục P0 phải có ca kiểm trước khi gọi là enterprise-ready."
  rationale: "Bảng tổng hợp audit hai mươi chín điểm mù."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "Tổng hợp audit", lines: "1361-1393"}
    - {file: brief-09-blind-spot-audit-29.md, section: "(mở đầu, chưa có tiêu đề)", lines: "1-10"}
  applies_to: [docs, evals]
  phase: MVP
  verification: {kind: review, ref: "bảng ưu tiên P0/P1 trong docs trỏ tới REQ của từng điểm mù; P0 có ca kiểm hoặc ghi 'chưa có'"}
  note: null
- id: REQ-MND-058
  area: MND
  statement: "Roadmap đổi từ 'thêm Router → Context → Tools → Workflow → Agent → MCP' sang chiều dọc: EAIS CORE → lát cắt nghiệp vụ (Fuel Reconciliation) → ba trục REALISM (nhiều định dạng, dữ liệu bẩn, ngữ nghĩa, thời gian), FAILURE (xung đột, dữ liệu cũ, outage, trùng) và SCALE (khối lượng, cardinality, đồng thời, noisy neighbor) → FAIL → ROOT CAUSE → MISSING PROPERTY → MINIMUM CAPABILITY → PROVE → REGRESSION GATE → NEXT BUSINESS CASE; chỉ khi một failure thật sự đòi mới mở Agent, MCP, Kafka, Redis, GraphRAG, ML Entity Resolution, Reranker hay fine-tuning."
  rationale: "Những primitive sống sót sau khi phá kiến trúc mới xứng đáng thành EAIS Core."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "Bức tranh mới sau audit", lines: "1394-1464"}
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Thậm chí audit vừa rồi còn giúp sửa roadmap một chút", lines: "155-255"}
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Đây là điểm tôi đánh giá roadmap hiện tại đúng nhất", lines: "328-367"}
  applies_to: [docs, evals]
  phase: MVP
  verification: {kind: review, ref: "docs/06-roadmap trình bày vòng dọc và liên kết từng lần mở capability với failure + số đo"}
  note: null
- id: REQ-MND-059
  area: MND
  statement: "Ba ảo tưởng cần tránh: ARCHITECTURE ILLUSION (có đủ module ≠ giải được doanh nghiệp), DATA ILLUSION (có canonical schema + dữ liệu tổng hợp ≠ hiểu đúng ngữ nghĩa nghiệp vụ và dữ liệu thật), PROOF ILLUSION (500 test xanh ≠ enterprise-ready nếu test không phủ đúng các chiều hỏng); RAG cũ có nguy cơ 'model illusion', EAIS đã chữa phần lớn model illusion; bước đáng làm trước khi viết thêm mã là chọn một vertical Construction thật sâu và cố tình phá kiến trúc theo thứ tự semantics → time → authority → conflict → permission → transaction → scale → failure → recovery."
  rationale: "Tóm tắt audit thành một câu và thứ tự phá kiến trúc."
  sources:
    - {file: brief-09-blind-spot-audit-29.md, section: "Bức tranh mới sau audit › Nếu gom tất cả audit đến giờ thành một câu", lines: "1465-1487"}
  applies_to: [docs, evals]
  phase: MVP
  verification: {kind: review, ref: "tài liệu mindset nêu ba ảo tưởng; kế hoạch phá kiến trúc theo chín bước có ca cho mỗi bước"}
  note: null
- id: REQ-MND-060
  area: MND
  statement: "Chia bài toán theo nguyên lý đầu: BUSINESS PROBLEM → FIRST PRINCIPLES → DATA/SOURCE OF TRUTH → tách tất định (SQL, code, luật, tính toán, state machine) và xác suất (suy luận ngữ nghĩa, mơ hồ, trích xuất, sinh, tóm tắt) → thiết kế hệ thống (Context/RAG/Router/Tools/Workflow) → kiểm soát (validation) → eval/observability → đo → cải tiến; phân bổ cụ thể: tính toán → code; fact chính xác → DB; quyền → policy; luật nghiệp vụ → tất định; trạng thái workflow → state machine; tài liệu → retrieval; mơ hồ, suy luận, sinh → model; hành động → tool có kiểm soát."
  rationale: "Đúng mindset 'AI is just another tech stack' + First Principles."
  sources:
    - {file: brief-10-working-hypothesis-first-principles.md, section: "(mở đầu, chưa có tiêu đề)", lines: "1-51"}
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Điểm rất quan trọng: roadmap vừa audit không phải đang “đi xa khỏi AI”", lines: "52-93"}
  applies_to: [docs, intelligence/router]
  phase: MVP
  verification: {kind: review, ref: "bảng phân bổ tất định/xác suất trong tài liệu nền tảng khớp mười dòng; liên kết REQ-RTE về bảng ranh giới"}
  note: null
- id: REQ-MND-061
  area: MND
  statement: "Công nghệ chỉ xuất hiện sau khi xác định thiếu thuộc tính nào: thiếu tri thức tài liệu → RAG; thiếu fact có cấu trúc chính xác → SQL; thiếu hiểu ngôn ngữ mơ hồ → Model; thiếu chọn đường → Router; thiếu hành động có kiểm soát → Tool; thiếu quy trình nghiệp vụ cố định → Workflow; thiếu lập kế hoạch động → có thể Agent; thiếu chuẩn hoá tích hợp → có thể MCP; chuỗi là problem → requirement → capability → technology, không phải technology → tìm use case."
  rationale: "Roadmap kiểu checklist công nghệ bị thay bằng chuỗi từ vấn đề."
  sources:
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Thậm chí audit vừa rồi còn giúp sửa roadmap một chút", lines: "155-255"}
  applies_to: [docs, intelligence/router]
  phase: MVP
  verification: {kind: review, ref: "bảng thiếu thuộc tính → capability trong tài liệu nền tảng; mỗi capability mới dẫn chiếu thuộc tính thiếu và ca hỏng"}
  note: null
- id: REQ-AGT-006
  area: AGT
  statement: "Agent phải thắng workflow cố định trên eval: quy trình quyết định gồm 'có failure nào fixed workflow không giải được không?' → không thì không Agent; có thì 'dynamic planning có thật sự cần không?' → không thì Workflow; có thì Agent, rồi dùng eval để xem Agent có tốt hơn không; tương tự cho MCP, GraphRAG, reranker, fine-tuning, Kafka, Redis."
  rationale: "Complexity must be earned by evidence áp cho từng capability."
  sources:
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Đây là điểm tôi đánh giá roadmap hiện tại đúng nhất", lines: "328-367"}
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Thậm chí audit vừa rồi còn giúp sửa roadmap một chút", lines: "155-255"}
  applies_to: [execution/agents, evals]
  phase: GATED
  verification: {kind: eval, ref: "so sánh Agent với workflow cố định trên cùng bộ ca; Agent chỉ giữ nếu thắng đo được"}
  note: "Điều kiện mở cổng giữ như REQ-AGT-001; REQ này thêm yêu cầu 'phải thắng workflow cố định trên eval' trước khi giữ lại agent."
- id: REQ-MND-062
  area: MND
  statement: "Kiến trúc EAIS hiện tại là giả thuyết làm việc (working hypothesis), không phải đáp án: First Principles → EAIS V1 → thực tế construction → FAIL → V2 → thực tế sports → FAIL → V3 → Tenant C → portability test → ...; một module hiện có có thể bị xoá nếu không chứng minh giá trị, một abstraction có thể đổi, một capability có thể không bao giờ được mở; bước chuyển từ 'thiết kế EAIS' sang 'dùng thực nghiệm để khám phá EAIS đúng phải là gì'; đừng mở rộng roadmap ngang bằng cách thêm technology mà đi dọc."
  rationale: "Mindset gốc áp dụng cho chính kiến trúc."
  sources:
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Đây là điểm tôi đánh giá roadmap hiện tại đúng nhất › Tôi chỉ chỉnh một điểm quan trọng trong roadmap hiện tại", lines: "368-411"}
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Tôi chỉ chỉnh một điểm quan trọng trong roadmap hiện tại › Nên bức tranh hiện tại của dự án, theo tôi, là:", lines: "412-464"}
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Điểm rất quan trọng: roadmap vừa audit không phải đang “đi xa khỏi AI”", lines: "52-93"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "docs/01-architecture.md và README ghi 'working hypothesis'; mọi ADR xoá/đổi module nêu bằng chứng"}
  note: null
- id: REQ-BIZ-022
  area: BIZ
  statement: "Construction case study bắt đầu từ quy trình nghiệp vụ thật chứ không từ 'chatbot AI cho xây dựng': chọn quy trình (Fuel Reconciliation), mô phỏng thực tế nghiệp vụ (ERP, Excel, PDF, kho, tin nhắn công trường, thiết bị, con người, quyền, bản ghi lịch sử, đầu vào bẩn, xung đột), đập vào EAIS và để nó FAIL; mỗi kiểu fail cho phép thêm một capability: '4k dầu' không hiểu nghĩa → vấn đề ngữ nghĩa/chuẩn hoá; kho 3.850 / ERP 3.900 / site ~4.000 → vấn đề nguồn/ngữ nghĩa/hoà giải; EX03 / Machine03 / Máy xúc 03 → vấn đề thực thể; phụ lục hợp đồng đổi theo thời gian → vấn đề thời gian; 10 triệu bản ghi → vấn đề scale."
  rationale: "Mỗi failure mới cho phép kiến trúc kiếm thêm một capability."
  sources:
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Vì thế Construction case study cũng phải hiểu lại", lines: "256-327"}
  applies_to: [tenants/construction, evals]
  phase: MVP
  verification: {kind: test, ref: "kịch bản CON-T cho từng kiểu fail; bảng fail → vấn đề → capability được ghi trong failure catalog"}
  note: null
- id: REQ-MND-063
  area: MND
  statement: "Mỗi sự thật có một nguồn duy nhất: CLAUDE.md gốc chỉ giữ ranh giới và luật, không chép toàn bộ spec kiến trúc (cây module, S0–S10, hợp đồng Normalizer/EntityResolver/Router/KnowledgeRetriever/ContextBuilder/ModelGateway/Validator) và không chép schema pack (lexicon, entities, metrics, intents, tools, skills, templates, validation) — chi tiết ở architecture/contracts để không có hai nguồn sự thật dễ lệch nhau; CLAUDE.md theo thư mục con (tenants/construction, intelligence/rag, governance) chỉ bổ sung luật theo phạm vi, không chép lại luật gốc; capability gate (classifier, model extraction, reranker, Agent, MCP, vision/fine-tuning) giữ nguyên tinh thần mặc định đóng."
  rationale: "Tránh hai source-of-truth lệch nhau."
  sources:
    - {file: brief-11-claude-md-rationale.md, section: "(mở đầu, chưa có tiêu đề)", lines: "1-8"}
    - {file: brief-11-claude-md-rationale.md, section: "(mở đầu, chưa có tiêu đề)", lines: "9-10"}
  applies_to: [docs]
  phase: MVP
  verification: {kind: review, ref: "review: CLAUDE.md không chứa bản sao spec kiến trúc hay schema pack; CLAUDE.md con chỉ chứa luật phạm vi"}
  note: null
- id: REQ-MDL-015
  area: MDL
  statement: "Không khoá tên model/nhà cung cấp cụ thể (ví dụ các cấp Haiku/Sonnet/Opus) vào luật gốc hay tài liệu bất biến vì model thay đổi theo thời gian và môi trường; nguyên tắc bền hơn là chọn model qua policy/config và model mạnh không thay thế verification; khoá model cụ thể chỉ nằm ở cấu hình runtime/dự án hoặc provider policy."
  rationale: "Model selection là cấu hình, không phải invariant kiến trúc."
  sources:
    - {file: brief-11-claude-md-rationale.md, section: "(mở đầu, chưa có tiêu đề)", lines: "1-10"}
  applies_to: [intelligence/models, core/tenant, docs]
  phase: MVP
  verification: {kind: test, ref: "quét tài liệu/luật gốc: không có tên model cụ thể làm điều kiện; tên model chỉ xuất hiện trong tệp cấu hình/policy"}
  note: null
- id: REQ-EVL-038
  area: EVL
  statement: "Phát hiện 'mock database + vài happy case không đại diện dữ liệu doanh nghiệp' được đọc theo nguyên lý đầu: câu hỏi không phải 'test có xanh không' mà 'hệ thống có xử lý được business reality không'; từ đó mỗi thực tế sinh một yêu cầu: nhiều định dạng → canonicalization; dữ liệu bẩn → normalization; bí danh → entity resolution; nhiều nguồn → provenance; khác nghĩa → ngữ nghĩa nghiệp vụ; giá trị xung đột → hoà giải; thay đổi lịch sử → mô hình thời gian; khối lượng lớn → test scale; lỗi → khả năng chịu lỗi; nhiều tenant → cô lập; 500 test tự viết → chưa chắc là bằng chứng production."
  rationale: "Cùng một logic First Principles áp cho dữ liệu: mục tiêu chứng minh là business reality."
  sources:
    - {file: brief-10-working-hypothesis-first-principles.md, section: "Và phát hiện mới về data cũng đúng cùng một logic", lines: "94-154"}
  applies_to: [evals, simulations]
  phase: MVP
  verification: {kind: review, ref: "bảng 'thực tế dữ liệu → yêu cầu → REQ' trong tài liệu proof; mỗi dòng có REQ tương ứng"}
  note: null
