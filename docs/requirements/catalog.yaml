  phase: MVP
  verification: {kind: test, ref: "ca: hỏi tỉ số khi chưa có dữ liệu → INSUFFICIENT_EVIDENCE; số trong tóm tắt khớp projection"}
  note: null
- id: REQ-RT-009
  area: RT
  statement: "Bảng xếp hạng (standing) và ranking là projection tính tất định từ event store theo luật của giải (pack); không có số xếp hạng nào do model sinh; tính lại sau correction cho kết quả khớp."
