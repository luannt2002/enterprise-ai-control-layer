  statement: "Bộ RTE-T phải có các ca mẫu: 'Tổng dầu dự án A tháng 9?' → SQL_QUERY (SUM, kiểm, không RAG); 'Quy định định mức nhiên liệu máy X?' → RAG (SOP, evidence, trích dẫn); 'Máy X tháng này tiêu thụ dầu có bất thường không?' → HYBRID_RETRIEVAL + CALCULATION; '4k dầu' → chuẩn hoá thành 4000 L (không RAG); 'Làm báo cáo ngày' → WORKFLOW; 'Gửi báo cáo này cho trưởng phòng' → TOOL; 'Tóm tắt đoạn này' → DIRECT_LLM; 'Tính tổng hoá đơn' → CALCULATION; 'Thời tiết hôm nay?' → TOOL/API ngoài nếu pack có."
