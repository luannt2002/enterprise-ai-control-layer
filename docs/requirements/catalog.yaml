  note: null
- id: REQ-MND-019
  area: MND
  statement: "Mỗi package thuộc đúng một trong bốn loại thành phần: kỹ thuật phần mềm (auth, tenant, RBAC/ABAC, DB, API, giao dịch, trạng thái, workflow, audit, retry, timeout, idempotency, quan sát), kỹ thuật dữ liệu (đọc tài liệu, chuẩn hoá, schema chuẩn, nguồn sự thật, dòng dõi, phiên bản, index, tìm kiếm, dựng ngữ cảnh), trí tuệ xác suất (hiểu ngôn ngữ mơ hồ, phân loại ngữ nghĩa, diễn giải mơ hồ, truy xuất ngữ nghĩa, so khớp thực thể mờ, trích xuất, suy luận, tóm tắt, giải thích, sinh văn bản, thị giác, rerank học được, lập kế hoạch khi cần agent), điều khiển (router, ngưỡng tin cậy, cổng capability, validation, chính sách lùi)."
  rationale: "Phân loại giúp biết đâu là AI, đâu không phải, và chỗ nào cần cổng."
  sources:
