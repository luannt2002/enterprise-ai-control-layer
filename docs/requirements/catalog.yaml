  statement: "Câu hỏi 'RAG là custom cho từng doanh nghiệp hay một codebase multi-tenant?' được trả lời là cả hai: một codebase + kiến trúc multi-tenant + cấu hình, dữ liệu, tri thức miền và quyền riêng theo tenant. Bảng chia sẻ/tuỳ biến theo lớp: engine nạp (chung)/connector và cấu hình riêng; parser (chung)/luật đọc riêng; chunking, embedding pipeline (chung)/chiến lược, model riêng; vector store abstraction (chung)/namespace và index riêng; retrieval (chung)/bộ lọc riêng; reranker (chung)/cấu hình riêng; Context Builder framework (chung)/chính sách domain riêng; Router framework (chung)/intents và routes riêng; Tool framework (chung)/tool của tenant; MCP client (chung)/MCP server riêng; Skills framework (chung)/skill riêng; Validation framework (chung)/luật nghiệp vụ riêng; Evaluation engine (chung)/golden dataset riêng; Observability (chung)/trace tách theo tenant; Dữ liệu (KHÔNG chung, phải cô lập); Quyền (engine chung)/chính sách riêng; Source of truth (abstraction chung)/nguồn riêng."
  rationale: "Một cùng codebase, cấu hình và dữ liệu riêng theo tenant."
