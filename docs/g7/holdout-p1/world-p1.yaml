# Thế giới WIN MVP (docs/04-core-mvp.md) — dữ liệu GIẢ LẬP, mọi tên đều hư cấu.
#
# Đây là ĐẶC TẢ LOGIC của thế giới, viết tay, đóng băng trước W1. Bộ sinh (W1) đọc tệp này để:
#   - render từng bản ghi ra định dạng nguồn của nó (CSV / XLSX / JSON / tin nhắn / PDF văn bản / markdown);
#   - sinh thêm dữ liệu nền (FUNCTIONAL, SCALE SMOKE) KHÔNG đụng vào các thực thể và ngày ở đây;
#   - ghi manifest (id bản ghi → quan sát kỳ vọng) để cổng G1 so độc lập.
# Bộ ca WIN (cases-*.yaml) tính đáp án từ ĐÚNG tệp này + luật thẩm quyền trong pack metrics.yaml.
#
# Quy ước:
#   reference_date = "hôm nay" của bộ ca (múi giờ Asia/Ho_Chi_Minh) → "hôm qua" = 2026-10-19.
#   Mọi lượng ở đây đã là đơn vị CHUẨN của chỉ số (L); bản ghi nguồn có thể ghi khác (m3, "2k"…)
#   ở trường raw — quan sát chuẩn phải ra đúng value_l.

# ==================================================================================================
# BẢN BỔ SUNG CHO BỘ CA GIỮ LẠI CỦA PHASE 1 (khối M4: lệnh open_discrepancy_ticket)
#
# Tệp này = bản chép NGUYÊN VĂN world.yaml (không sửa, không xoá, không đổi thứ tự dòng gốc) CỘNG các
# dòng đánh dấu "[P1+]" (chỉ thêm). Người soạn bộ ca giữ lại viết thêm vì world.yaml chưa đủ tính chất
# cho mọi lớp ca của hợp đồng: tenant thứ hai chỉ có vế kho xuất; thiếu cặp hai vế bằng nhau; thiếu số
# ước lượng ở vế kho xuất; thiếu cặp xung đột ngang thẩm quyền mà vế kia đủ; thiếu máy đủ hai vế để
# chạy nhiều lời gọi đồng thời; thiếu vai có tickets.create với phạm vi hẹp.
#
# Nguyên tắc chọn số liệu thêm (để đáp án không phụ thuộc điều nằm ngoài tệp này):
#   - mỗi vế của máy 'sạch' chỉ có ĐÚNG MỘT bản ghi có cấu trúc, nên không cần luật thẩm quyền giữa
#     các loại nguồn;
#   - cặp xung đột chỉ dùng hai loại nguồn mà chú thích gốc của DZ-05 đã nêu là NGANG thẩm quyền
#     (erp và excel_summary), lệch xa hơn dung sai issued_fuel (10 L) nhiều lần;
#   - không máy nào thêm vào trộn nhiều bản ghi cùng ngày với thứ hạng nguồn không nêu trong tệp gốc;
#   - các máy, ngày và bản ghi gốc (EX-03, DZ-05, EX-07, RL-07, RL-02, EX-99…) KHÔNG bị sửa.
# Bộ sinh dữ liệu nền không đụng vào thực thể và ngày ở đây (quy ước gốc ở đầu tệp).
#
# Lượt sửa 1 (sau soát độc lập): chỉ đổi các dòng [P1+] (RL-32 và EX-11 ngày 18/10: nới chênh lệch; EX-22: thêm raw và format cho khớp kiểu EX-17) và
# thêm người gọi u-b-eng; không dòng gốc nào của world.yaml bị đụng.
# Tệp này chỉ dùng cho bộ ca giữ lại của Phase 1. Các ca WIN gốc vẫn chạy trên world.yaml: tổng cấp dự án của ngày 18 và 19/10
# ở đây KHÁC world.yaml vì các máy thêm cùng thuộc PRJ-A, PRJ-B.
# ==================================================================================================

reference_date: 2026-10-20

tenants:
