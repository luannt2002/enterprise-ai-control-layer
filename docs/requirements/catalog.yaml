- id: REQ-RTE-001
  area: RTE
  statement: "Router trả về đúng một trong mười hai route cố định: DIRECT_LLM, SQL_QUERY, FULL_TEXT_SEARCH, RAG, HYBRID_RETRIEVAL, CALCULATION, TOOL, WORKFLOW, AGENT, CLARIFICATION, HUMAN_ESCALATION, REJECT; mỗi route trong tài liệu router có đủ tám trường: Trigger, Examples, Counterexamples, Confidence, Fallback, Permission, Expected latency, Evaluation metric; route AGENT tồn tại trong từ vựng nhưng cổng đóng."
  rationale: "Taxonomy router production của prompt V2; một điểm vào cho mọi yêu cầu."
