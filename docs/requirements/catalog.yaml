  note: null
- id: REQ-CTX-009
  area: CTX
  statement: "ContextPackage có ngân sách token theo route/model policy; mục tiêu là tập nhỏ nhất nhưng tín hiệu cao nhất (nhiều context hơn không đồng nghĩa tốt hơn); cắt theo thẩm quyền và độ liên quan chứ không theo thứ tự đến; chỉ số context precision = bằng chứng liên quan / tổng bằng chứng trong gói."
  rationale: "Cửa sổ ngữ cảnh hữu hạn: chỉ dẫn, bằng chứng, lịch sử cùng tranh giành ngân sách."
  sources:
