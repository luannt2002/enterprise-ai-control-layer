  verification: {kind: test, ref: "fixture giải mô phỏng: standing tính đúng; sau correction tính lại khớp"}
  note: null
- id: REQ-RT-010
  area: RT
  statement: "Mục tiêu hiệu năng của sports (high-volume, real-time, event-driven, multi-source, cập nhật thường xuyên, read-heavy, nhạy độ trễ) được đo bằng benchmark mô phỏng: thông lượng sự kiện, độ trễ provider → API, độ cũ projection, tỉ lệ sự kiện muộn; ngưỡng đặt sau lần đo đầu."
