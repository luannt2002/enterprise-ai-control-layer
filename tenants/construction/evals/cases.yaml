# Bộ ca kiểm thử của tenant abc-infra (ABC Infrastructure JSC, hư cấu) — 100 ca, định dạng CONVENTIONS §5.
#
# Quy ước đọc:
# - Mọi con số, tên người/máy/kho/nhà thầu trong tệp này là DỮ LIỆU GIẢ LẬP (ví dụ), không phải kết quả đo.
# - `scenario` là mã CON-S-NNN trong docs/tenants/construction/05-problem-catalog.md; `entry_type` bằng entry_type của kịch bản.
# - Ca hỏng (CON-F-NNN, docs/tenants/construction/07-failure-catalog.md) được phủ bởi ca nào thì ca đó nêu mã trong
#   `acceptance_criteria` bằng cụm "Phủ CON-F-NNN: ...".
# - Một số ca là BIẾN THỂ của kịch bản gốc (đầu vào/precondition khác nên route khác kịch bản gốc); ghi trong `preconditions`.
# - Tỉ lệ: 20 happy_path · 20 dirty_data · 15 ambiguity · 15 conflict · 10 permission · 10 infrastructure · 10 adversarial.
# - Ca lệnh/sự kiện/workflow dùng `expected_state` {workflow, from, to, ...}; ca QUERY để `null`.
# - Không so chuỗi nguyên văn: `expected_output_properties` mô tả tính chất.

