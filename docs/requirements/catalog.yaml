  note: null
- id: REQ-MCP-001
  area: MCP
  statement: "Tài liệu và mã phân biệt API (giao diện dịch vụ), Tool (capability AI gọi được), MCP (giao thức chuẩn hoá cách expose và kết nối capability/context cho hệ AI gồm tools, resources, prompts), Skill (procedure), Router (chọn đường/điều phối); MCP thuộc tầng tích hợp, không phải trí tuệ, không thay REST/gRPC/database, không phải RAG; execution/tools độc lập với việc có dùng MCP hay không."
  rationale: "[HIỆU CHỈNH] Đừng học 'MCP = cách AI gọi API'."
  sources:
    - {file: z-luannt-learn-ai-with-quan-ai.v0.md, section: "25. PHASE 22 --- MCP", lines: "1431-1481"}
