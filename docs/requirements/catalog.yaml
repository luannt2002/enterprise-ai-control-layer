- id: REQ-ENT-002
  area: ENT
  statement: "Phải mô phỏng và kiểm thử ba kiểu mơ hồ: cùng một từ ở các phòng ban khác nhau có nghĩa khác nhau; cùng một viết tắt ở các tài liệu khác nhau có nghĩa khác nhau; cùng một con số với đơn vị khác nhau có nghĩa nghiệp vụ khác nhau; ví dụ 'khối lượng hôm nay đạt 80%' mang nghĩa tỉ lệ khối lượng hoàn thành chứ không phải khối lượng vật lý, và 'DA' là dầu trong báo cáo công trường nhưng có thể là viết tắt khác trong tài liệu khác."
