  statement: "Tài liệu thiết kế của từng tenant phải được rà từ tám vai: (1) Enterprise Business Analyst (business model → phòng ban → nghiệp vụ → process → dữ liệu → pain point); (2) Domain Analyst (terminology, entity, lifecycle, business rules, exception); (3) Enterprise Solution Architect (không mặc định mọi thứ dùng AI); (4) AI Systems Engineer (nơi cần Model, Router, RAG, Context Engineering, Tools, Skills, MCP, Agent, Memory/State, Fine-tuning); (5) Backend/Data Architect (database, schema, event, API, queue, cache, search, ETL, normalization, source-of-truth, consistency, multi-tenancy); (6) Reliability Engineer (validation, retry, fallback, idempotency, clarification, approval, SLA/SLO); (7) Security/Governance Architect (AuthN/AuthZ, tenant isolation, RBAC/ABAC, audit, phân loại dữ liệu, permission-aware retrieval); (8) Evaluation/Test Architect (test case, golden dataset, failure injection, component metric, E2E acceptance)."
  rationale: "Prompt V2 yêu cầu đóng đồng thời tám vai, không phải chatbot designer."
