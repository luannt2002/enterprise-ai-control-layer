  area: SOT
  statement: "Xung đột (cùng chỉ số, cùng thực thể, cùng kỳ) đi theo chuỗi phát hiện → phân loại → áp chính sách thẩm quyền → hoà giải → hỏi lại hoặc duyệt người khi cần; vượt ngưỡng chênh lệch của pack thì vào review_queue/HUMAN_ESCALATION; kết quả hoà giải ghi lý do và luật đã dùng."
