  note: null
- id: REQ-SEC-005
  area: SEC
  statement: "Phân quyền chi tiết (V1): thuộc tính ABAC của principal theo dự án, công trường, loại tài liệu, chỉ số, thời gian hiệu lực; least privilege mặc định từ chối; thay đổi quyền có hiệu lực ngay ở lượt sau; mọi thay đổi quyền kèm test cho phép và từ chối."
  rationale: "ABAC là bước nâng cấp của RBAC khi nhiều dự án và nhiều vai."
