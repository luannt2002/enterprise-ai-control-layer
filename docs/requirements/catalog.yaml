  note: null
- id: REQ-RAG-001
  area: RAG
  statement: "RAG là một subsystem sau interface KnowledgeRetriever (Retrieve(query, context, policy) → []Evidence); EAIS chỉ biết 'tôi cần bằng chứng', còn bên trong (BM25, vector, hybrid, reranker, Graph RAG, contextual retrieval) thay được mà không đổi core; RAG không sở hữu routing toàn cục, phân quyền tenant, giao dịch nghiệp vụ, workflow state, hoà giải nguồn sự thật, phép tính chính xác hay quyền doanh nghiệp."
  rationale: "RAG cũ được giữ như một capability có ranh giới (bounded capability)."
  sources:
    - {file: brief-04-rag-to-eais-expansion.md, section: "9. Tôi sẽ giữ RAG cũ thành một bounded capability", lines: "744-792"}
