  verification: {kind: review, ref: "docs/06-roadmap/v2.md ghi thứ tự tenant #3 trở đi và điều kiện bắt đầu (kiểm toán abstraction hai tenant tham chiếu hoàn tất)"}
  note: null
- id: REQ-BIZ-016
  area: BIZ
  statement: "Tenant giày-da (Tenant C về sau) phải được dùng để kiểm lại abstraction bằng các bài toán manufacturing: BOM theo style/màu/size, ma trận size×color, kế hoạch vật tư (MRP), tồn kho/WIP, các công đoạn cắt → may → định hình → hoàn thiện → QC → đóng gói, costing, supply chain; lý do hoãn là nó trùng nhiều với construction về ERP/inventory/planning nên độ tương phản thấp hơn Sports."
  rationale: "Giày-da rất tốt cho ERP/manufacturing nhưng chưa tối ưu để chứng minh core không kén tenant."
