  phase: MVP
  verification: {kind: test, ref: "test: body chứa tenant_id khác bị bỏ qua hoặc từ chối; principal đủ trường; thiếu/deny quyền → bị chặn"}
  note: null
- id: REQ-SEC-003
  area: SEC
  statement: "Ca phân quyền mẫu của construction: Site Engineer chỉ thuộc dự án Bridge A → ý định Daily Report → skill Daily Site Report → tool cho phép query_equipment, query_material, search_SOP và KHÔNG approve_payment → context chỉ gồm dữ liệu được phép → chỉ dẫn model nêu văn phong → model; thử vượt quyền ở mỗi tầng đều bị chặn bởi code."
  rationale: "Đây mới là enterprise-controlled AI."
  sources:
