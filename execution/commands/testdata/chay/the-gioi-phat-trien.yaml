# Thế giới PHÁT TRIỂN cho bộ chạy ca lệnh (HOP-DONG §12.1) — dữ liệu GIẢ LẬP, mọi tên đều hư cấu. Viết từ ví dụ của §10, §12.1 và định dạng của
# tenants/construction/win/world.yaml (bản chép khung + phần thêm); KHÔNG chép từ bộ giữ lại độc lập. Bộ sinh tenants/construction/win/gen
# render tệp này ra dữ liệu nguồn, đường nạp thật (data/ingestion) đọc lại thành fact và danh mục, rồi nạp vào bộ nhớ hoặc PostgreSQL.
#
# "Hôm nay" = reference_date lúc 10:00 giờ tenant, nên "hôm qua" = 2026-10-19. Mỗi máy mang MỘT tính chất để một lớp ca của §10 dùng:
#   EX-03  hai vế đủ, chênh lệch 68 (ví dụ §1.1); có thêm ngày 2026-10-18 (chênh lệch 10) cho ca "cùng khoá, khác ngày"
#   EX-04  50 · EX-05  100: máy khác cho ca đua khác nội dung và hai người gọi
#   EX-01  hai vế bằng nhau (NO_DISCREPANCY)
#   EX-02  thiếu vế đo · EX-11 không có số liệu nào (INSUFFICIENT_EVIDENCE)
#   EX-06  vế xuất có hai nguồn NGANG thẩm quyền (erp, excel_summary) lệch 200 > dung sai 10 (HUMAN_REVIEW_REQUIRED)
#   EX-07  như EX-06 và THIẾU vế đo: xung đột phải thắng thiếu vế
#   EX-08  vế xuất là số ước lượng (ô lượng của phiếu kho ghi "~500")
#   EX-09  máy của dự án PRJ-B, ngoài phạm vi của người chỉ được giao dự án PRJ-A
#   EX-10  kho xuất ÍT hơn lượng đo: chênh lệch âm vẫn là chênh lệch
# Tenant thứ hai def-build dùng CÙNG khoá EX-03 với số liệu khác (ca hai tenant dùng cùng khoá).

reference_date: 2026-10-20

tenants:
  - id: abc-infra
    projects:
      - {id: PRJ-A, name: Cầu A, aliases: [dự án A]}
      - {id: PRJ-B, name: Đường B, aliases: [dự án B]}
    equipment:
      - {id: EX-01, type: excavator, name: Máy xúc EX-01, project: PRJ-A, aliases: [], source_ids: {erp: asset-5001, fuel_sensor: EX001, warehouse_slip: EX-01}}
